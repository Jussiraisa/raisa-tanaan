    if (code <= 2) return { icon: "🌤️", phrase: "puolipilvistä" };
    if (code === 3) return { icon: "☁️", phrase: "pilvistä" };
    if (code === 45 || code === 48) return { icon: "🌫️", phrase: "sumua" };
    if (code >= 51 && code <= 57) return { icon: "🌦️", phrase: "tihkua" };
    if (code >= 61 && code <= 67) return { icon: "🌧️", phrase: "sadetta" };
    if (code >= 71 && code <= 77) return { icon: "❄️", phrase: "lunta" };
    if (code >= 80 && code <= 82) return { icon: "🌦️", phrase: "kuuroja" };
    if (code >= 95) return { icon: "⛈️", phrase: "ukkosta" };
    return { icon: "🌡️", phrase: "vaihtelevaa" };
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else cb(null);
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }
  function colorWho(who) { return WHO_COLOR[who] || "#B8A090"; }
  function initial(who) { return who ? String(who).charAt(0) : "?"; }
  function eventsOn(iso) {
    var out = [];
    if (!schedule || !schedule.events) return out;
    for (var i = 0; i < schedule.events.length; i++) {
      if (schedule.events[i].date === iso) out.push(schedule.events[i]);
    }
    out.sort(function (a, b) {
      var ta = parseMin(a.time); if (ta == null) ta = 9800;
      var tb = parseMin(b.time); if (tb == null) tb = 9800;
      return ta - tb;
    });
    return out;
  }
  function todayList(now) {
    var list = eventsOn(now.iso);
    var out = [], seen = {};
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e || e.kind === "koulu") continue;
      var k = (e.time || "") + "|" + (e.who || "") + "|" + (e.title || "");
      if (seen[k]) continue;
      seen[k] = 1;
      out.push(e);
    }
    return out;
  }
  function evEnd(e) {
    var en = parseMin(e.end);
    if (en != null) return en;
    var st = parseMin(e.time);
    return st == null ? null : st + 60;
  }
  function matchesWho(e, who) {
    if (!e) return false;
    if (e.who === who) return true;
    if ((e.who === "perhe" || e.who === "Perhe") && (who === "Jussi" || who === "Riikka")) return true;
    if ((who === "Jussi" || who === "Riikka") && (e.driver === who || e.pickup === who)) return true;
    return false;
  }
  function statusFor(who, now, list) {
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!matchesWho(e, who)) continue;
      var st = parseMin(e.time), en = evEnd(e);
      if (st != null && en != null && st <= now.minutes && now.minutes < en) return true;
    }
    if ((who === "Ellen" || who === "Samuel" || who === "Milla" || who === "Mea") &&
        now.wd >= 1 && now.wd <= 5 && now.minutes >= 8 * 60 && now.minutes < 14 * 60) return true;
    return false;
  }
  function nextExpectation(now) {
    if (!schedule || !schedule.expectations) return null;
    var best = null, bestD = 99999;
    for (var i = 0; i < schedule.expectations.length; i++) {
      var ex = schedule.expectations[i];
      var start = ex.start || "";
      if (!start) continue;
      var d = daysUntil(start, now);
      if (d < 0) {
        var end = ex.end || start;
        if (daysUntil(end, now) >= 0) d = 0;
        else continue;
      }
      if (d < bestD) { bestD = d; best = ex; best._days = d; }
    }
    // Always keep London as soft fallback if within 40 days
    var lonD = daysUntil(LONTOO_START, now);
    if (now.iso >= LONTOO_START && now.iso <= LONTOO_END) {
      return { label: "Lontoo", start: LONTOO_START, end: LONTOO_END, _days: 0, _kind: "trip" };
    }
    if ((!best || best._days > lonD) && lonD >= 0 && lonD <= 40) {
      return { label: "Lontoo · 13.–17.10.", start: LONTOO_START, end: LONTOO_END, _days: lonD, _kind: "trip" };
    }
    return best;
  }

  function paintHeader(now) {
    var g = document.getElementById("greet");
    var d = document.getElementById("dateLine");
    var c = document.getElementById("clock");
    if (g) g.textContent = greeting(now.hour);
    if (d) d.textContent = DAYS[now.wd] + " " + now.day + "." + now.month + ".";
    if (c) c.textContent = now.hour + "." + pad(now.minute);
    var q = document.getElementById("quote");
    if (q) q.textContent = QUOTES[now.day % QUOTES.length];
  }

  function paintPeople(now) {
    var row = document.getElementById("peopleRow");
    if (!row) return;
    var list = todayList(now);
    var html = "";
    for (var i = 0; i < PEOPLE.length; i++) {
      var who = PEOPLE[i];
      var on = statusFor(who, now, list);
      html += "<div class=\"person\"><div class=\"av\" style=\"background:" + colorWho(who) + "\">" +
        esc(initial(who)) + "<span class=\"dot" + (on ? " on" : "") + "\"></span></div>" +
        "<div class=\"nm\">" + esc(who) + "</div></div>";
    }
    row.innerHTML = html;
  }

  function paintHope(now) {
    var ex = nextExpectation(now);
    var title = document.getElementById("hopeTitle");
    var meta = document.getElementById("hopeMeta");
    var pill = document.getElementById("hopePill");
    var kick = document.getElementById("hopeKicker");
    var list = todayList(now);
    var liveIdx = -1, nextIdx = -1, nextDiff = 99999;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var st = parseMin(e.time), en = evEnd(e);
      if (st != null && en != null && st <= now.minutes && now.minutes < en) { liveIdx = i; break; }
      if (st != null && st > now.minutes) {
        var d = st - now.minutes;
        if (d < nextDiff) { nextDiff = d; nextIdx = i; }
      }
    }
    // Prefer near-term event if within 3h, else expectation
    if (liveIdx >= 0 || (nextIdx >= 0 && nextDiff <= 180)) {
      var focus = liveIdx >= 0 ? list[liveIdx] : list[nextIdx];
      if (kick) kick.textContent = liveIdx >= 0 ? "Nyt" : "Seuraavaksi";
      if (title) title.textContent = (focus.who && focus.who !== "perhe" && focus.who !== "Perhe" ? focus.who + " · " : "") + (focus.title || "");
      var bits = [];
      if (focus.time) bits.push(fmtRange(focus.time, focus.end));
      if (focus.place) bits.push(focus.place);
      if (focus.driver) bits.push("kuski " + focus.driver);
      if (meta) meta.textContent = bits.join(" · ");
      if (pill) {
        pill.style.display = "inline-block";
        if (liveIdx >= 0) pill.textContent = "Käynnissä";
        else if (nextDiff < 60) pill.textContent = "Alkioon " + nextDiff + " min";
        else pill.textContent = "Alkioon " + Math.floor(nextDiff / 60) + " h " + (nextDiff % 60) + " min";
      }
      return;
    }
    if (ex) {
      if (kick) kick.textContent = ex._kind === "trip" ? "Matka" : "Odotus";
      if (title) title.textContent = ex.label || "Tulossa";
      if (meta) meta.textContent = ex.menu ? String(ex.menu).split("·")[0].trim() : "";
      if (pill) {
        pill.style.display = "inline-block";
        if (ex._days === 0) pill.textContent = "Tänään";
        else if (ex._days === 1) pill.textContent = "Huomenna";
        else pill.textContent = ex._days + " päivää";
      }
      return;
    }
    if (kick) kick.textContent = "Hetki";
    if (title) title.textContent = "Rauhallinen päivä";
    if (meta) meta.textContent = "Ei kiirettä juuri nyt";
    if (pill) pill.style.display = "none";
  }

  function paintMeal(now) {
    var title = document.getElementById("mealTitle");
    var sub = document.getElementById("mealSub");
    var home = schedule && schedule.homeMeals ? schedule.homeMeals[now.iso] : null;
    var school = schedule && schedule.schoolLunch ? schedule.schoolLunch[now.iso] : null;
    if (title) title.textContent = home || "Ei merkintää";
    if (sub) sub.textContent = school ? ("Koulussa: " + school) : "Kotiruoka";
  }

  function paintToday(now) {
    var box = document.getElementById("todayList");
    if (!box) return;
    var list = todayList(now);
    var liveIdx = -1;
    for (var i = 0; i < list.length; i++) {
      var st = parseMin(list[i].time), en = evEnd(list[i]);
      if (st != null && en != null && st <= now.minutes && now.minutes < en) { liveIdx = i; break; }
    }
    var html = "";
    for (var j = 0; j < list.length; j++) {
      var e = list[j];
      var st2 = parseMin(e.time), en2 = evEnd(e);
      var cls = "tev";
      if (st2 != null && en2 != null && now.minutes >= en2) cls += " past";
      else if (j === liveIdx) cls += " live";
      var when = fmtRange(e.time, e.end) || "koko pv";
      var meta = [];
      if (e.place) meta.push(e.place);
      if (e.driver) meta.push("kuski " + e.driver);
      if (e.note) meta.push(e.note);
      html += "<div class=\"" + cls + "\"><div class=\"when\">" + esc(when) + "</div>";
      html += "<div class=\"rail\"><div class=\"dot\" style=\"background:" + colorWho(e.who) + "\"></div></div>";
      html += "<div class=\"txt\"><div class=\"who\">" + esc((e.who && e.who !== "perhe" && e.who !== "Perhe" ? e.who + " · " : "") + (e.title || "")) + "</div>";
      if (meta.length) html += "<div class=\"meta\">" + esc(meta.join(" · ")) + "</div>";
      html += "</div></div>";
    }
    if (!html) html = "<div class=\"empty\">Ei merkintöjä tänään — hyvä niin.</div>";
    box.innerHTML = html;
  }


  function schoolStartsForWd(wd) {
    var list = (schedule && schedule.schoolStarts) || SCHOOL_STARTS_FALLBACK;
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (!s) continue;
      var wds = s.weekdays || [];
      var ok = false;
      for (var j = 0; j < wds.length; j++) {
        if (wds[j] === wd) { ok = true; break; }
      }
      if (ok) out.push(s);
    }
    out.sort(function (a, b) {
      var ta = parseMin(a.time); if (ta == null) ta = 9800;
      var tb = parseMin(b.time); if (tb == null) tb = 9800;
      if (ta !== tb) return ta - tb;
      return String(a.who || "").localeCompare(String(b.who || ""));
    });
    return out;
  }

  function paintTomorrow(now) {
    var row = document.getElementById("tomorrowRow");
    if (!row) return;
    /* School today-vs-tomorrow at 17:00 Helsinki (theme still 18). */
    var showTomorrowSchool = (now.hour >= 17);
    var schoolWd = showTomorrowSchool ? ((now.wd + 1) % 7) : now.wd;
    var schools = schoolStartsForWd(schoolWd);
    var iso = addDaysIso(now.iso, 1);
    var list = eventsOn(iso) || [];
    var out = [], seen = {};
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e || e.kind === "koulu") continue;
      var k = (e.time || "") + "|" + (e.who || "") + "|" + (e.title || "");
      if (seen[k]) continue;
      seen[k] = 1;
      out.push(e);
    }
    var h2 = document.querySelector(".sect h2");
    /* Prefer the Huomenna section heading */
    var sects = document.querySelectorAll(".sect h2");
    for (var hi = 0; hi < sects.length; hi++) {
      var ht = sects[hi].textContent || "";
      if (ht.indexOf("Huomenna") === 0 || ht.indexOf("Tänään · koulu") === 0 || ht === "Huomenna · koulu") {
        h2 = sects[hi];
        break;
      }
    }
    if (h2) {
      if (schools.length) h2.textContent = showTomorrowSchool ? "Huomenna · koulu" : "Tänään · koulu";
      else h2.textContent = "Huomenna";
    }
    if (!schools.length && !out.length) {
      row.innerHTML = "<div class=\"tchip\"><div class=\"t\">Huomenna</div><div class=\"b\">Vapaampi päivä</div><div class=\"s\">Ei treenejä listalla</div></div>";
      return;
    }
    var html = "";
    var j;
    var shown = 0;
    var MAX_SCHOOL = 4;
    var MAX_HOBBY = 2;
    if (schools.length) {
      for (j = 0; j < schools.length && shown < MAX_SCHOOL; j++) {
        var s = schools[j];
        html += "<div class=\"tchip school\"><div class=\"t\">" + esc(fmtRange(s.time, s.end) || fmtHm(s.time) || "") +
          "</div><div class=\"b\">" + esc((shortWho(s.who) || "") + (s.who ? " · " : "") + (s.label || "Koulu")) +
          "</div></div>";
        shown++;
      }
    }
    var room = Math.max(0, MAX_HOBBY);

    for (j = 0; j < Math.min(out.length, room); j++) {
      var e2 = out[j];
      html += "<div class=\"tchip\"><div class=\"t\">" + esc(fmtRange(e2.time, e2.end) || "päivä") +
        "</div><div class=\"b\">" + esc((e2.who && e2.who !== "perhe" ? e2.who + " · " : "") + (e2.title || "")) +
        "</div><div class=\"s\">" + esc(e2.place || "") + "</div></div>";
    }
    row.innerHTML = html;
  }

  function showPhoto(p) {
    if (!p) return;
    var img = document.getElementById("memImg");
    var pl = document.getElementById("memPlace");
    var yr = document.getElementById("memYear");
    if (!img) return;
    img.classList.remove("zoom");
    img.style.opacity = "0";
    var next = new Image();
    next.onload = function () {
      img.src = p.src;
      img.style.opacity = "1";
      setTimeout(function () { img.classList.add("zoom"); }, 40);
    };
    next.src = p.src;
    if (pl) pl.textContent = p.place || "Muisto";
    if (yr) yr.textContent = p.year || "";
  }
  function paintMem(now) {
    if (!photos.length) return;
    if (!photoIdx && photoIdx !== 0) photoIdx = Math.abs(now.day * 17 + now.month) % photos.length;
    showPhoto(photos[photoIdx % photos.length]);
  }
  function rotateMem() {
    if (photos.length < 2) return;
    photoIdx = (photoIdx + 1) % photos.length;
    showPhoto(photos[photoIdx]);
  }
  (function bindMemTap() {
    var hero = document.querySelector(".hero");
    var last = 0;
    if (!hero) return;
    hero.addEventListener("click", function (ev) {
      var now = Date.now();
      if (now - last < 450) return;
      last = now;
      rotateMem();
    });
  })();

  function paintWx() {
    var c = wxState.current;
    if (!c) return;
    var w = wmo(c.code);
    var ico = document.getElementById("wxIco");
    var temp = document.getElementById("wxTemp");
    if (ico) ico.textContent = w.icon;
    if (temp) temp.textContent = Math.round(c.temp) + "°";
  }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    paintHeader(now);
    paintPeople(now);
    paintHope(now);
    paintMeal(now);
    paintToday(now);
    paintTomorrow(now);
    paintWx();
  }

  function londonW(now) {
    var d = daysUntil(LONTOO_START, now);
    if (now.iso >= LONTOO_START && now.iso <= LONTOO_END) return 0.55;
    if (d < 0) return 0.12;
    if (d > 21) return 0.28;
    if (d >= 8) return 0.45;
    return 0.62;
  }
  function weightPhotos(list, now) {
    if (!list || !list.length) return list || [];
    var lw = londonW(now);
    var lon = [], oth = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var isL = (p.place && /lontoo/i.test(p.place)) || (p.tags && p.tags.indexOf("london") >= 0);
      if (isL) lon.push(p); else oth.push(p);
    }
    var n = Math.min(list.length, 60);
    var nL = Math.round(n * lw);
    if (nL > lon.length) nL = lon.length;
    var out = lon.slice(0, nL).concat(oth.slice(0, n - nL));
    for (var j = out.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = out[j]; out[j] = out[k]; out[k] = tmp;
    }
    return out.length ? out : list;
  }

  getJSON("schedule.json?v=" + BUILD, function (data) {
    if (data) schedule = data;
    paint();
  });
  getJSON("photos-from-matkat.json?v=" + BUILD, function (data) {
    if (data && data.length) {
      photos = weightPhotos(data, helsinkiNow());
      photoIdx = Math.floor(Math.random() * photos.length);
      paintMem(helsinkiNow());
    }
  });
  getJSON(
    "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FHelsinki",
    function (data) {
      if (!data || !data.current) return;
      wxState.current = {
        temp: data.current.temperature_2m,
        code: data.current.weather_code,
        wind: data.current.wind_speed_10m
      };
      paintWx();
    }
  );

  paint();
  setInterval(function () { paint(); }, 30000);
  setInterval(rotateMem, 12000);
})();
</script>

<script>
(function () {
  function paintTsla(d) {
    var el = document.getElementById("navTsla");
    if (!el || !d || d.price == null) return;
    var p = Number(d.price);
    var pct = Number(d.changePct != null ? d.changePct : d.changePct);
    if (isNaN(pct)) pct = Number(d.changePct);
    if (isNaN(p)) return;
    var priceStr = p.toFixed(2);
    var cls = "flat";
    var pctStr = "0.0%";
    if (!isNaN(pct)) {
      if (pct > 0.005) cls = "up";
      else if (pct < -0.005) cls = "dn";
      var sign = pct > 0 ? "+" : "";
      pctStr = sign + pct.toFixed(1) + "%";
    }
    el.innerHTML = priceStr + "<br><span class=\"" + cls + "\">" + pctStr + "</span>";
  }
  function normalize(d) {
    if (!d) return null;
    var price = d.price;
    var pct = d.changePct;
    if (pct == null) pct = d.changePct;
    if (pct == null) pct = d.changePct;
    if (price == null) return null;
    return { price: price, changePct: pct };
  }
  function fromYahoo(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
      if (!meta) return null;
      var price = Number(meta.regularMarketPrice);
      var pct = Number(meta.regularMarketChangePercent);
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) cb(null, xhr.responseText);
      else cb("status");
    };
    xhr.onerror = function () { cb("net"); };
    xhr.ontimeout = function () { cb("timeout"); };
    xhr.send();
  }
  function loadLive() {
    var v = Math.floor(Date.now() / 60000);
    xhrGet("tsla.json?v=" + v, function (err0, text0) {
      if (!err0 && text0) {
        try {
          var d0 = JSON.parse(text0);
          paintTsla({ price: d0.price, changePct: (d0.changePct != null ? d0.changePct : d0.changePct) });
        } catch (e) {}
      }
      var yahooUrl = "https://api.allorigins.win/raw?url=" +
        encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/TSLA?interval=1d&range=5d");
      xhrGet(yahooUrl, function (err, text) {
        var d = (!err && text) ? fromYahoo(text) : null;
        if (d) paintTsla(d);
      });
    });
  }
  loadLive();
  setInterval(loadLive, 60000);
})();
</script>
