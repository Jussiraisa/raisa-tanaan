<script>
(function () {
  var BUILD = "20260922-puhelin-v5-tsla";
  var LONTOO_START = "2026-10-13";
  var LONTOO_END = "2026-10-17";
  var DAYS = ["Sunnuntai","Maanantai","Tiistai","Keskiviikko","Torstai","Perjantai","Lauantai"];
  var WHO_COLOR = {
    Ellen: "#d48aa8", Samuel: "#5b8fd4", Milla: "#c9a227", Mea: "#e08a3c",
    Jussi: "#5a7a5a", Riikka: "#7a6aad", perhe: "#c4a574", Perhe: "#c4a574"
  };
  var PEOPLE = ["Jussi", "Riikka", "Ellen", "Samuel", "Milla", "Mea"];
  var schedule = null;
  var photos = [];
  var wxState = { current: null, daily: null };

  function pad(n) { n = parseInt(n, 10); return n < 10 ? "0" + n : "" + n; }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function helsinkiNow() {
    var d = new Date();
    var parts = {};
    try {
      var fmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        weekday: "short", hour12: false
      });
      var arr = fmt.formatToParts(d);
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].type !== "literal") parts[arr[i].type] = arr[i].value;
      }
    } catch (e) {
      var hki = new Date(d.getTime() + 3 * 60 * 60 * 1000);
      parts.year = String(hki.getUTCFullYear());
      parts.month = pad(hki.getUTCMonth() + 1);
      parts.day = pad(hki.getUTCDate());
      parts.hour = pad(hki.getUTCHours());
      parts.minute = pad(hki.getUTCMinutes());
      parts.weekday = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][hki.getUTCDay()];
    }
    var wdMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    var wd = wdMap[parts.weekday]; if (wd == null) wd = new Date().getDay();
    var hour = parseInt(parts.hour, 10); if (hour === 24) hour = 0;
    var minute = parseInt(parts.minute, 10) || 0;
    var year = parseInt(parts.year, 10), month = parseInt(parts.month, 10), day = parseInt(parts.day, 10);
    return {
      year: year, month: month, day: day, hour: hour, minute: minute, wd: wd,
      iso: year + "-" + pad(month) + "-" + pad(day),
      minutes: hour * 60 + minute
    };
  }
  function greeting(hour) {
    if (hour >= 5 && hour < 11) return "Hyvää huomenta";
    if (hour >= 11 && hour < 17) return "Hyvää päivää";
    if (hour >= 17 && hour < 20) return "Hyvää iltaa";
    return "Hyvää yötä";
  }
  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function fmtRange(a, b) {
    if (!a && !b) return "";
    if (a && b) return fmtHm(a) + "–" + fmtHm(b);
    return a ? fmtHm(a) : "";
  }
  function wmo(code) {
    if (code === 0) return { icon: "☀️", phrase: "selkeää" };
    if (code <= 2) return { icon: "🌤️", phrase: "melkein selkeää" };
    if (code === 3) return { icon: "☁️", phrase: "pilvistä" };
    if (code === 45 || code === 48) return { icon: "🌫️", phrase: "sumua" };
    if (code >= 51 && code <= 57) return { icon: "🌦️", phrase: "tihkua" };
    if (code >= 61 && code <= 67) return { icon: "🌧️", phrase: "sadetta" };
    if (code >= 71 && code <= 77) return { icon: "❄️", phrase: "lunta" };
    if (code >= 80 && code <= 82) return { icon: "🌦️", phrase: "kuuroja" };
    if (code >= 85 && code <= 86) return { icon: "🌨️", phrase: "lumikuuroja" };
    if (code >= 95) return { icon: "⛈️", phrase: "ukkosta" };
    return { icon: "🌡️", phrase: "vaihtelevaa" };
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else cb(null);
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }
  function eventsOn(iso) {
    var out = [];
    if (!schedule || !schedule.events) return out;
    for (var i = 0; i < schedule.events.length; i++) {
      if (schedule.events[i].date === iso) out.push(schedule.events[i]);
    }
    out.sort(function (a, b) {
      var ta = parseMin(a.time); if (ta == null) ta = 9800;
      var tb = parseMin(b.time); if (tb == null) tb = 9800;
      return ta - tb;
    });
    return out;
  }
  function todayNonSchool(now) {
    var list = eventsOn(now.iso);
    var out = [], seen = {};
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e || e.kind === "koulu") continue;
      var k = (e.time || "") + "|" + (e.who || "") + "|" + (e.title || "");
      if (seen[k]) continue;
      seen[k] = 1;
      out.push(e);
    }
    return out;
  }
  function evEnd(e) {
    var en = parseMin(e.end);
    if (en != null) return en;
    var st = parseMin(e.time);
    if (st == null) return null;
    return st + 60;
  }
  function colorWho(who) { return WHO_COLOR[who] || "#b8a090"; }
  function initial(who) {
    if (!who) return "?";
    return String(who).charAt(0);
  }
  function matchesWho(e, who) {
    if (!e) return false;
    if (e.who === who) return true;
    if ((e.who === "perhe" || e.who === "Perhe") && (who === "Jussi" || who === "Riikka")) return true;
    if ((who === "Jussi" || who === "Riikka") && (e.driver === who || e.pickup === who)) return true;
    return false;
  }
  function statusFor(who, now, list) {
    var live = false;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!matchesWho(e, who)) continue;
      var st = parseMin(e.time), en = evEnd(e);
      if (st != null && en != null && st <= now.minutes && now.minutes < en) { live = true; break; }
    }
    if (!live && (who === "Ellen" || who === "Samuel" || who === "Milla" || who === "Mea") &&
        now.wd >= 1 && now.wd <= 5 && now.minutes < 14 * 60) live = true;
    return live;
  }

  function daysUntil(iso, now) {
    var a = now.iso.split("-").map(Number);
    var b = iso.split("-").map(Number);
    var da = Date.UTC(a[0], a[1] - 1, a[2]);
    var db = Date.UTC(b[0], b[1] - 1, b[2]);
    return Math.round((db - da) / 86400000);
  }

  function nextExpectation(now) {
    if (!schedule || !schedule.expectations) return null;
    var best = null, bestD = 99999;
    for (var i = 0; i < schedule.expectations.length; i++) {
      var ex = schedule.expectations[i];
      var start = ex.start || "";
      if (!start) continue;
      var d = daysUntil(start, now);
      if (d < 0) {
        var end = ex.end || start;
        if (daysUntil(end, now) >= 0) d = 0;
        else continue;
      }
      if (d < bestD) { bestD = d; best = ex; best._days = d; }
    }
    return best;
  }

  function paintPeople(now) {
    var row = document.getElementById("peopleRow");
    if (!row) return;
    var list = todayNonSchool(now);
    var html = "";
    for (var i = 0; i < PEOPLE.length; i++) {
      var who = PEOPLE[i];
      var on = statusFor(who, now, list);
      html += "<div class=\"person\"><div class=\"av\" style=\"background:" + colorWho(who) + "\">" +
        esc(initial(who)) + "<span class=\"sd" + (on ? " on" : "") + "\"></span></div>" +
        "<div class=\"nm\">" + esc(who) + "</div></div>";
    }
    row.innerHTML = html;
  }

  function paintToday(now) {
    var list = todayNonSchool(now);
    var box = document.getElementById("todayList");
    if (!box) return;
    var liveIdx = -1, nextIdx = -1, nextDiff = 99999;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var st = parseMin(e.time), en = evEnd(e);
      if (st != null && en != null && st <= now.minutes && now.minutes < en) { liveIdx = i; break; }
      if (st != null && st > now.minutes) {
        var d = st - now.minutes;
        if (d < nextDiff) { nextDiff = d; nextIdx = i; }
      }
    }

    var focus = liveIdx >= 0 ? list[liveIdx] : (nextIdx >= 0 ? list[nextIdx] : null);
    var nt = document.getElementById("nextTitle");
    var nm = document.getElementById("nextMeta");
    var nc = document.getElementById("nextCd");
    if (focus) {
      if (nt) nt.textContent = (focus.who && focus.who !== "perhe" ? focus.who + " · " : "") + (focus.title || "");
      var bits = [];
      if (focus.time) bits.push(fmtRange(focus.time, focus.end));
      if (focus.place) bits.push(focus.place);
      if (focus.driver) bits.push("kuski " + focus.driver);
      if (nm) nm.textContent = bits.join(" · ");
      if (nc) {
        if (liveIdx >= 0) {
          nc.style.display = "inline-block";
          nc.textContent = "Nyt käynnissä";
        } else if (nextDiff < 99999) {
          nc.style.display = "inline-block";
          if (nextDiff < 60) nc.textContent = "Alkioon " + nextDiff + " min";
          else nc.textContent = "Alkioon " + Math.floor(nextDiff / 60) + " h " + (nextDiff % 60) + " min";
        } else {
          nc.style.display = "none";
        }
      }
    } else {
      if (nt) nt.textContent = "Ei seuraavaa merkintää";
      if (nm) nm.textContent = "Rauhallinen hetki";
      if (nc) nc.style.display = "none";
    }

    var html = "";
    for (var j = 0; j < list.length; j++) {
      var e2 = list[j];
      var st2 = parseMin(e2.time), en2 = evEnd(e2);
      var cls = "tev";
      if (st2 != null && en2 != null && now.minutes >= en2) cls += " past";
      else if (j === liveIdx) cls += " live";
      var when = fmtRange(e2.time, e2.end) || "—";
      var meta = [];
      if (e2.place) meta.push(e2.place);
      if (e2.driver) meta.push(e2.driver);
      html += "<div class=\"" + cls + "\"><div class=\"when\">" + esc(when) + "</div>";
      html += "<div class=\"dotc\" style=\"background:" + colorWho(e2.who) + "\"></div>";
      html += "<div class=\"txt\">" + esc((e2.who && e2.who !== "perhe" ? e2.who + " · " : "") + (e2.title || ""));
      if (meta.length) html += "<div class=\"meta\">" + esc(meta.join(" · ")) + "</div>";
      html += "</div></div>";
    }
    if (!html) html = "<div class=\"empty\">Ei merkintöjä tänään</div>";
    box.innerHTML = html;
  }

  function paintMem(now) {
    if (!photos.length) return;
    var p = photos[Math.abs(now.day * 17 + now.month) % photos.length];
    var img = document.getElementById("memImg");
    var pl = document.getElementById("memPlace");
    var yr = document.getElementById("memYear");

    if (pl) pl.textContent = p.place || "Muisto";
    if (yr) yr.textContent = p.year || "";

  function paintWx() {
    var c = wxState.current;
    if (!c) return;
    var w = wmo(c.code);
    var ico = document.getElementById("wxIco");
    var temp = document.getElementById("wxTemp");
    var mw = document.getElementById("miniWx");
    var ms = document.getElementById("miniWxS");
    if (ico) ico.textContent = w.icon;
    if (temp) temp.textContent = Math.round(c.temp) + "°";
    if (mw) mw.textContent = w.icon + " " + Math.round(c.temp) + "°";
    var bits = [w.phrase];
    if (c.wind != null) bits.push(Math.round(c.wind) + " m/s");
    if (c.tmin != null && c.tmax != null) bits.push(Math.round(c.tmin) + "–" + Math.round(c.tmax) + "°");
    if (ms) ms.textContent = bits.join(" · ");
  }

  function paintExp(now) {
    var ex = nextExpectation(now);
    var b = document.getElementById("miniExp");
    var s = document.getElementById("miniExpS");
    if (!ex) {
      if (b) b.textContent = "—";
      if (s) s.textContent = "";
      return;
    }
    var label = ex.label || "Tapahtuma";
    var short = label.split("·")[0].trim();
    if (b) b.textContent = short;
    var d = ex._days;
    if (s) {
      if (d === 0) s.textContent = "Tänään";
      else if (d === 1) s.textContent = "Huomenna";
      else s.textContent = d + " päivää";
    }
  }

  function paint() {
    var now = helsinkiNow();
    var g = document.getElementById("greet");
    var d = document.getElementById("dateLine");
    if (g) g.textContent = greeting(now.hour);
    if (d) d.textContent = DAYS[now.wd] + " " + now.day + "." + now.month + ".";
    paintPeople(now);
    paintToday(now);
    paintMem(now);
    paintWx();
    paintExp(now);
  }

  function loadSchedule() {
    getJSON("schedule.json?v=" + BUILD, function (data) {
      if (data) schedule = data;
      paint();
    });
  }
  function daysUntilIso(iso, now) {
    try {
      var a = Date.parse(iso + "T12:00:00");
      var b = Date.parse(now.iso + "T12:00:00");
      return Math.round((a - b) / 86400000);
    } catch (e) { return 99; }
  }
  function londonW(now) {
    var d = daysUntilIso(LONTOO_START, now);
    if (now.iso >= LONTOO_START && now.iso <= LONTOO_END) return 0.50;
    if (d < 0) return 0.10;
    if (d > 21) return 0.25;
    if (d >= 8) return 0.45;
    return 0.60;
  }
  function weightPhotos(list, now) {
    if (!list || !list.length) return list || [];
    var lw = londonW(now);
    var lon = [], oth = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var isL = (p.place && /lontoo/i.test(p.place)) || (p.tags && p.tags.indexOf("london") >= 0);
      if (isL) lon.push(p); else oth.push(p);
    }
    var n = Math.min(list.length, 48);
    var nL = Math.round(n * lw);
    if (nL > lon.length) nL = lon.length;
    var out = lon.slice(0, nL).concat(oth.slice(0, n - nL));
    // light shuffle
    for (var j = out.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = out[j]; out[j] = out[k]; out[k] = tmp;
    }
    return out.length ? out : list;
  }
  function loadPhotos() {
    getJSON("photos-from-matkat.json?v=" + BUILD, function (data) {
      if (data && data.length) photos = weightPhotos(data, helsinkiNow());
      paint();
    });
  }
  function loadWx() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&current=temperature_2m,weather_code,wind_speed_10m&daily=weathercode,temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=5";
    getJSON(url, function (data) {
      if (!data) return;
      if (data.current) {
        wxState.current = {
          temp: data.current.temperature_2m,
          code: data.current.weather_code,
          wind: data.current.wind_speed_10m
        };
      }
      if (data.daily && wxState.current) {
        wxState.current.tmin = data.daily.temperature_2m_min[0];
        wxState.current.tmax = data.daily.temperature_2m_max[0];
      }
      paint();
    });
  }

  loadSchedule();
  loadPhotos();
  loadWx();
  setInterval(function () { paint(); }, 30000);
  setInterval(loadWx, 15 * 60 * 1000);
})();
</script>


<script>
(function () {
  function parseMoney(s) {
    if (s == null) return NaN;
    return parseFloat(String(s).replace(/[^0-9.\-]/g, ""));
  }
  function parsePct(s) {
    if (s == null) return NaN;
    return parseFloat(String(s).replace(/[^0-9.\-+]/g, ""));
  }
  function paintTsla(d) {
    var el = document.getElementById("navTsla");
    if (!el || !d || d.price == null) return;
    var p = Number(d.price);
    var pct = Number(d.changePct);
    if (isNaN(p)) return;
    var priceStr = p.toFixed(2);
    var cls = "flat";
    var pctStr = "0.0%";
    if (!isNaN(pct)) {
      if (pct > 0.005) cls = "up";
      else if (pct < -0.005) cls = "dn";
      var sign = pct > 0 ? "+" : "";
      pctStr = sign + pct.toFixed(1) + "%";
    }
    el.innerHTML = priceStr + " <span class=\"" + cls + "\">" + pctStr + "</span>";
  }
  function fromNasdaq(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var p = j && j.data && j.data.primaryData;
      if (!p) return null;
      var price = parseMoney(p.lastSalePrice);
      var chg = parseMoney(p.netChange);
      var pct = parsePct(p.percentageChange);
      if (String(p.netChange || "").indexOf("-") >= 0 || p.deltaIndicator === "down") {
        if (chg > 0) chg = -chg;
        if (pct > 0) pct = -pct;
      }
      if (isNaN(price)) return null;
      return { price: price, change: chg, changePct: pct };
    } catch (e) { return null; }
  }
  function fromYahoo(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
      if (!meta) return null;
      var price = Number(meta.regularMarketPrice);
      var pct = Number(meta.regularMarketChangePercent);
      if (pct == null || isNaN(pct)) pct = Number(meta.fulldayChangePercent);
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 12000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) cb(null, xhr.responseText);
      else cb("status");
    };
    xhr.onerror = function () { cb("net"); };
    xhr.ontimeout = function () { cb("timeout"); };
    xhr.send();
  }
  function loadLive() {
    var nasdaqUrl = "https://api.allorigins.win/raw?url=" +
      encodeURIComponent("https://api.nasdaq.com/api/quote/TSLA/info?assetclass=stocks");
    xhrGet(nasdaqUrl, function (err, text) {
      var d = (!err && text) ? fromNasdaq(text) : null;
      if (d) { paintTsla(d); return; }
      var yahooUrl = "https://api.allorigins.win/raw?url=" +
        encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/TSLA?interval=1d&range=5d");
      xhrGet(yahooUrl, function (err2, text2) {
        var d2 = (!err2 && text2) ? fromYahoo(text2) : null;
        if (d2) { paintTsla(d2); return; }
        var v = Math.floor(Date.now() / 60000);
        xhrGet("tsla.json?v=" + v, function (err3, text3) {
          if (err3 || !text3) return;
          try { paintTsla(JSON.parse(text3)); } catch (e) {}
        });
      });
    });
  }
  loadLive();
  setInterval(loadLive, 60000);
})();
</script>
