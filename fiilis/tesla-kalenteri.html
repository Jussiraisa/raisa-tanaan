<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="fiilis-build" content="20260922-wa-padel24">
  <meta name="theme-color" content="#F3EFE8">
  <title>Fiilis · Kalenteri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&display=swap">
  <style>
:root, body.day {
  --bg: #F3EFE8;
  --card: #F7F1E6;
  --text: #2A241C;
  --muted: #6E6254;
  --ev: #3F362C;
  --ev-time: #4A4034;
  --wd: #6E6254;
  --empty: #8A7C6A;
  --accent: #A67C3A;
  --shadow: rgba(60,40,18,.06);
}
body.evening {
  --bg: #E8DFD0;
  --card: #F0E8DA;
  --text: #1F1A14;
  --muted: #5E5448;
  --ev: #2C261E;
  --ev-time: #3A3228;
  --wd: #4E463C;
  --empty: #6A5E50;
  --accent: #A67C3A;
  --shadow: rgba(60,40,18,.08);
}
body.night {
  --bg: #DED4C4;
  --card: #E8DFD0;
  --text: #1A1510;
  --muted: #52483C;
  --ev: #1A1510;
  --ev-time: #2A221A;
  --wd: #3E362C;
  --empty: #52483C;
  --accent: #A67C3A;
  --shadow: rgba(60,40,18,.10);
}
html, body { overflow: hidden;  height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
.app {
  height: 100%; padding: 1.6vmin 2vmin 8vmin;
  display: flex; flex-direction: column;
}
.head {
  flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 1vmin;
}
.title {
  font-family: Newsreader, Georgia, serif;
  font-size: 2.8vmin; font-weight: 400; color: var(--text); letter-spacing: -.02em;
}
.sub { font-size: 1.35vmin; color: var(--muted); font-weight: 500; }
.brand { font-size: .95vmin; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--wd); margin-left: 1vmin; }

.grid-wrap {
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column;
}
.dow {
  flex: 0 0 auto; display: flex; margin-bottom: .4vmin;
}
.dow span {
  flex: 1; text-align: center; font-size: 1.15vmin; font-weight: 650;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.month {
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.week {
  flex: 1 1 0; min-height: 0; display: flex;
}
.week + .week { margin-top: .4vmin; }
.week > * + * { margin-left: .4vmin; }
.day {
  flex: 1 1 0; min-width: 0; min-height: 0;
  background: var(--card);
  border: 1px solid rgba(44,36,24,.08);
  border-radius: .85vmin;
  padding: .35vmin .4vmin .3vmin;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 .2vmin .8vmin var(--shadow);
}
.day.pad { visibility: hidden; border: 0; background: transparent; box-shadow: none; }
.day.out {
  opacity: .38;
  background: rgba(247,241,230,.45);
}
.day.is-today {
  background: rgba(184,136,62,.16);
  border: 1.5px solid #a3712a;
}
.day.is-lontoo:not(.is-today) { background: rgba(184,136,62,.08); }
.day .hd {
  flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: .25vmin;
}
.day .dn {
  font-size: 1.4vmin; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text);
}
.day.is-today .dn { color: #8f6524; }
.day .mo { font-size: 1.0vmin; font-weight: 600; color: var(--muted); margin-left: .25vmin; }
.day .wd { font-size: 1.0vmin; font-weight: 600; color: var(--wd); }
.day .evs { flex: 1 1 auto; min-height: 0; overflow: hidden; }
.day .ev {
  font-size: var(--ev-fs, 1.25vmin); line-height: 1.28; font-weight: 650;
  color: #1A140E !important;
  -webkit-text-fill-color: #1A140E !important;
  margin-top: .14vmin;
  white-space: normal; overflow-wrap: anywhere; word-break: break-word;
  opacity: 1 !important;
}
body.evening .day .ev, body.night .day .ev {
  color: #120E0A !important;
  -webkit-text-fill-color: #120E0A !important;
}
.month.tight .day { padding: .28vmin .35vmin .25vmin; }
.month.tight .day .dn { font-size: 1.55vmin; }
.month.tight .day .mo { font-size: 1vmin; }
.month.tight .day .ev { margin-top: .06vmin; }
.month.xtight .day .dn { font-size: 1.35vmin; }
.month.xtight .day .ev { font-size: var(--ev-fs, 0.85vmin); line-height: 1.15; }

.day .ev .dot {
  display: inline-block; width: .6vmin; height: .6vmin; border-radius: 999px;
  margin-right: .3vmin; vertical-align: .12em;
}
.day .ev .t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.95em; color: #1A140E !important; -webkit-text-fill-color: #1A140E !important; }
.day .empty-day { font-size: 1.2vmin; color: var(--empty); margin-top: .2vmin; }


.nav {
  position: fixed; left: 0; right: 0; bottom: 0; height: 6.4vmin;
  background: rgba(45,40,34,.94); color: #d8d0c4;
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 2vmin; z-index: 30;
}
.nav a {
  color: inherit; text-decoration: none; text-align: center;
  font-size: 1.2vmin; font-weight: 600; min-width: 8vmin;
  padding: .4vmin .6vmin; opacity: .72;
}
.nav a .ic { display: block; font-size: 2.2vmin; line-height: 1.1; margin-bottom: .1vmin; }
.nav a.on { opacity: 1; color: #fff; border-bottom: .28vmin solid #c45c4a; padding-bottom: .2vmin; }
.nav-tsla {
  font-size: 1.35vmin; font-weight: 650; opacity: .9;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  letter-spacing: .01em; line-height: 1.2; text-align: center;
  min-width: 0; padding: .3vmin .5vmin; pointer-events: none;
  color: #d8d0c4;
}
.nav-tsla .up { color: #6fcf8a; }
.nav-tsla .dn { color: #e07a6a; }
.nav-tsla .flat { color: #d8d0c4; opacity: .75; }
@media (max-width: 700px) {
  .nav { height: calc(3.7rem + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav a { font-size: 0.72rem; min-width: 4.2rem; }
  .nav a .ic { font-size: 1.2rem; }
  .nav-tsla { font-size: .72rem; }
}

</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="title" id="monthTitle">Kalenteri</div>
    <div><span class="sub" id="rangeLabel">Kuopio</span><span class="brand">Tesla</span></div>
  </div>
  <div class="grid-wrap">
    <div class="dow">
      <span>ma</span><span>ti</span><span>ke</span><span>to</span><span>pe</span><span>la</span><span>su</span>
    </div>
    <div class="month" id="monthGrid"></div>
  </div>
</div>

<script>
(function () {

  function themeClass(hour) {
    if (hour >= 7 && hour < 18) return "day";
    if (hour >= 18 && hour < 22) return "evening";
    return "night";
  }
  function applyTheme() {
    var h = new Date().getHours();
    try {
      var parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Helsinki", hour: "numeric", hour12: false }).formatToParts(new Date());
      for (var i = 0; i < parts.length; i++) if (parts[i].type === "hour") h = parseInt(parts[i].value, 10);
    } catch (e) {}
    document.body.className = themeClass(h);
  }
  applyTheme();
  setInterval(applyTheme, 60000);
  var BUILD = "20260922-wa-padel24";
  var MONTHS = ["tammikuu","helmikuu","maaliskuu","huhtikuu","toukokuu","kesäkuu",
    "heinäkuu","elokuu","syyskuu","lokakuu","marraskuu","joulukuu"];
  var WHO_COLOR = {
    Jussi: "#c5bfb6", Riikka: "#d4c0a0", Ellen: "#e8b4bc",
    Samuel: "#a8c4d8", Milla: "#e4c090", Mea: "#c4a8d8",
    perhe: "#c4a574", Perhe: "#c4a574"
  };
  var LONTOO_START = "2026-10-13";
  var LONTOO_END = "2026-10-17";
  var schedule = null;

  function pad(n) { n = parseInt(n, 10); return n < 10 ? "0" + n : "" + n; }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function helsinkiNow() {
    var d = new Date();
    var parts = {};
    try {
      var fmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", weekday: "short", hour12: false
      });
      var arr = fmt.formatToParts(d);
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].type !== "literal") parts[arr[i].type] = arr[i].value;
      }
    } catch (e) {
      var hki = new Date(d.getTime() + 3 * 60 * 60 * 1000);
      parts.year = String(hki.getUTCFullYear());
      parts.month = pad(hki.getUTCMonth() + 1);
      parts.day = pad(hki.getUTCDate());
    }
    var year = parseInt(parts.year, 10), month = parseInt(parts.month, 10), day = parseInt(parts.day, 10);
    return { year: year, month: month, day: day, iso: year + "-" + pad(month) + "-" + pad(day) };
  }
  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else cb(null);
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }
  function colorWho(who) { return WHO_COLOR[who] || "#b8a090"; }
  function shortWho(who) {
    var w = String(who || "");
    if (w === "perhe" || w === "Perhe") return "";
    return w;
  }
  /* Add n days to YYYY-MM-DD (UTC noon math → no DST edge) */
  function addDaysIso(iso, n) {
    var p = String(iso).split("-");
    var dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12, 0, 0));
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.getUTCFullYear() + "-" + pad(dt.getUTCMonth() + 1) + "-" + pad(dt.getUTCDate());
  }
  function weekdayMon0(iso) {
    var p = String(iso).split("-");
    var dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12, 0, 0));
    return (dt.getUTCDay() + 6) % 7; /* 0=ma … 6=su */
  }
  function eventsOn(iso) {
    var out = [];
    if (!schedule || !schedule.events) return out;
    for (var i = 0; i < schedule.events.length; i++) {
      if (schedule.events[i].date === iso) out.push(schedule.events[i]);
    }
    out.sort(function (a, b) {
      var ta = parseMin(a.time); if (ta == null) ta = 9800;
      var tb = parseMin(b.time); if (tb == null) tb = 9800;
      return ta - tb;
    });
    return out;
  }
  function dayExtras(iso) {
    var out = [];
    if (!schedule) return out;
    var p = iso.split("-");
    var mmdd = p[1] + "-" + p[2];
    var anns = schedule.anniversaries || [];
    for (var i = 0; i < anns.length; i++) {
      var a = anns[i];
      var raw = String(a.mmdd || a.date || "");
      var aMmdd = a.mmdd && String(a.mmdd).length === 5 ? String(a.mmdd) : (raw.length >= 5 ? raw.slice(-5) : "");
      if (aMmdd !== mmdd) continue;
      var title = a.label || (a.kind === "birthday" ? "Syntymäpäivä" : (a.kind === "wedding" ? "Hääpäivä" : "Merkkipäivä"));
      out.push({ who: a.who || "perhe", title: title, kind: "juhla" });
    }
    if (iso >= LONTOO_START && iso <= LONTOO_END) {
      out.push({ who: "perhe", title: "Lontoo", kind: "matka" });
    }
    return out;
  }

  function paint() {
    var now = helsinkiNow();
    var endIso = addDaysIso(now.iso, 30); /* today … today+30 = 31 days */
    var title = document.getElementById("monthTitle");
    if (title) {
      var endP = endIso.split("-");
      var endMo = parseInt(endP[1], 10);
      if (endMo === now.month) {
        title.textContent = MONTHS[now.month - 1] + " " + now.year;
      } else {
        title.textContent = MONTHS[now.month - 1] + "–" + MONTHS[endMo - 1];
      }
    }
    var rl = document.getElementById("rangeLabel");
    if (rl) {
      var endD = parseInt(endIso.slice(8), 10);
      var endM = parseInt(endIso.slice(5, 7), 10);
      rl.textContent = now.day + "." + now.month + ". → " + endD + "." + endM + ". · 31 pv";
    }

    var grid = document.getElementById("monthGrid");
    if (!grid) return;

    /* Rolling window aligned to Monday weeks — NOT month boundary */
    var monOff = weekdayMon0(now.iso);
    var gridStart = addDaysIso(now.iso, -monOff);
    var endOff = weekdayMon0(endIso);
    var gridEnd = addDaysIso(endIso, 6 - endOff);

    var cells = [];
    var cur = gridStart;
    while (cur <= gridEnd) {
      cells.push(cur);
      cur = addDaysIso(cur, 1);
    }
    var weeks = Math.ceil(cells.length / 7);

    var html = "";
    for (var w = 0; w < weeks; w++) {
      html += "<div class=\"week\">";
      for (var c = 0; c < 7; c++) {
        var iso = cells[w * 7 + c];
        if (!iso) {
          html += "<div class=\"day pad\"></div>";
          continue;
        }
        var inWindow = (iso >= now.iso && iso <= endIso);
        var dayNum = parseInt(iso.slice(8), 10);
        var moNum = parseInt(iso.slice(5, 7), 10);
        var cls = "day";
        if (!inWindow) cls += " out";
        if (iso === now.iso) cls += " is-today";
        if (iso >= LONTOO_START && iso <= LONTOO_END) cls += " is-lontoo";

        var evHtml = "";
        if (inWindow) {
          var evs = eventsOn(iso);
          var extras = dayExtras(iso);
          var lines = [];
          var seen = {};
          function addEv(e) {
            if (!e || e.kind === "koulu") return;
            var key = (e.who || "") + "|" + (e.title || "") + "|" + (e.time || "");
            if (seen[key]) return;
            seen[key] = 1;
            lines.push(e);
          }
          for (var ei = 0; ei < evs.length; ei++) addEv(evs[ei]);
          for (var xi = 0; xi < extras.length; xi++) addEv(extras[xi]);

          if (!lines.length) {
            evHtml = "<div class=\"empty-day\"> </div>";
          } else {
            for (var li = 0; li < lines.length; li++) {
              var e = lines[li];
              var who = shortWho(e.who);
              var tbit = e.time ? "<span class=\"t\">" + esc(fmtHm(e.time)) + "</span> " : "";
              var label = who ? (who + " · " + (e.title || "")) : (e.title || "");
              evHtml += "<div class=\"ev\"><span class=\"dot\" style=\"background:"
                + colorWho(e.who) + "\"></span>" + tbit + esc(label) + "</div>";
            }
          }
        }

        var moBit = "";
        if (dayNum === 1 || iso === now.iso || iso === gridStart) {
          moBit = "<span class=\"mo\">" + MONTHS[moNum - 1].slice(0, 3) + "</span>";
        }
        html += "<div class=\"" + cls + "\"><div class=\"hd\"><span class=\"dn\">" + dayNum
          + moBit + "</span></div><div class=\"evs\">" + evHtml + "</div></div>";
      }
      html += "</div>";
    }
    grid.innerHTML = html;
    fitCal(grid);
  }

  function fitCal(grid) {
    if (!grid) return;
    grid.className = "month";
    grid.style.setProperty("--ev-fs", "1.0vmin");
    var steps = [
      { cls: "", fs: "1.0vmin" },
      { cls: "", fs: "0.92vmin" },
      { cls: "tight", fs: "0.88vmin" },
      { cls: "tight", fs: "0.84vmin" },
      { cls: "xtight", fs: "0.80vmin" },
      { cls: "xtight", fs: "0.76vmin" },
      { cls: "xtight", fs: "0.72vmin" }
    ];
    function overflows() {
      if (grid.scrollHeight > grid.clientHeight + 2) return true;
      var days = grid.querySelectorAll(".day:not(.pad):not(.out)");
      for (var i = 0; i < days.length; i++) {
        var d = days[i];
        var evs = d.querySelector(".evs");
        if (evs && evs.scrollHeight > evs.clientHeight + 1) return true;
        if (d.scrollHeight > d.clientHeight + 1) return true;
      }
      return false;
    }
    for (var s = 0; s < steps.length; s++) {
      grid.className = "month" + (steps[s].cls ? (" " + steps[s].cls) : "");
      grid.style.setProperty("--ev-fs", steps[s].fs);
      /* force layout */
      void grid.offsetHeight;
      if (!overflows()) return;
    }
  }

  getJSON("schedule.json?v=" + BUILD, function (data) {
    if (data) schedule = data;
    paint();
  });
  paint();
  window.addEventListener("resize", function () {
    var g = document.getElementById("monthGrid");
    if (g) fitCal(g);
  });
})();
</script>

<script>

    try {
      var q = location.search || "";

<script>
(function () {
  function paintTsla(d) {
    var el = document.getElementById("navTsla");
    if (!el || !d || d.price == null) return;
    var p = Number(d.price);
    var pct = Number(d.changePct);
    if (isNaN(p)) return;
    var priceStr = p.toFixed(2);
    var cls = "flat";
    var pctStr = "0.0%";
    if (!isNaN(pct)) {
      if (pct > 0.005) cls = "up";
      else if (pct < -0.005) cls = "dn";
      var sign = pct > 0 ? "+" : "";
      pctStr = sign + pct.toFixed(1) + "%";
    }
    el.innerHTML = priceStr + " <span class=\"" + cls + "\">" + pctStr + "</span>";
  }
  function fromYahoo(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
      if (!meta) return null;
      var price = Number(meta.regularMarketPrice);
      var pct = Number(meta.regularMarketChangePercent);
      if (pct == null || isNaN(pct)) pct = Number(meta.fulldayChangePercent);
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) cb(null, xhr.responseText);
      else cb("status");
    };
    xhr.onerror = function () { cb("net"); };
    xhr.ontimeout = function () { cb("timeout"); };
    xhr.send();
  }
  function loadLive() {
    var v = Math.floor(Date.now() / 60000);
    // 1) same-origin cache first — shows immediately on phone
    xhrGet("tsla.json?v=" + v, function (err0, text0) {
      if (!err0 && text0) {
        try { paintTsla(JSON.parse(text0)); } catch (e) {}
      }
      // 2) then try live Yahoo via proxy (non-blocking upgrade)
      var yahooUrl = "https://api.allorigins.win/raw?url=" +
        encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/TSLA?interval=1d&range=5d");
      xhrGet(yahooUrl, function (err, text) {
        var d = (!err && text) ? fromYahoo(text) : null;
        if (d) paintTsla(d);
      });
    });
  }
  loadLive();
  setInterval(loadLive, 60000);
})();
