<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="fiilis-build" content="20260922-tesla-v2">
<title>Fiilis · Muistot</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap");
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Source Sans 3", system-ui, sans-serif;
    background: #F3EBDD;
    color: #2a241c;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: absolute; top: 1.6vmin; left: 1.6vmin; right: 1.6vmin; bottom: 7.4vmin;
    border-radius: 1.6vmin; overflow: hidden;
    background: #e8dfd0;
    box-shadow: 0 .5vmin 1.8vmin rgba(60,40,20,.1);
  }
  .stage img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    -webkit-transition: opacity .8s ease; transition: opacity .8s ease;
  }
  .veil {
    position: absolute; left: 0; right: 0; bottom: 0; height: 28%;
    background: linear-gradient(180deg, transparent, rgba(20,16,10,.62));
    pointer-events: none;
  }
  .cap {
    position: absolute; left: 2.2vmin; right: 2.2vmin; bottom: 2.2vmin;
    color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.45);
  }
  .cap .place {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 4.2vmin; font-weight: 700; font-style: italic;
  }
  .cap .year { font-size: 1.8vmin; opacity: .9; margin-top: .3vmin; font-weight: 600; }
  .cap .tag {
    margin-top: .6vmin; font-size: 1.55vmin; opacity: .85;
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
  }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; height: 6.4vmin;
    background: rgba(45,40,34,.94); color: #d8d0c4;
    display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center;
    -ms-flex-pack: distribute; justify-content: space-around;
    padding: 0 2vmin; z-index: 20;
  }
  .nav a {
    color: inherit; text-decoration: none; text-align: center;
    font-size: 1.2vmin; font-weight: 600; min-width: 8vmin; padding: .4vmin .6vmin;
    opacity: .72;
  }
  .nav a .ic { display: block; font-size: 2.2vmin; line-height: 1.1; margin-bottom: .1vmin; }
  .nav a.on { opacity: 1; color: #fff; border-bottom: .28vmin solid #c45c4a; padding-bottom: .2vmin; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img id="photo" alt="">
  <div class="veil"></div>
  <div class="cap">
    <div class="place" id="place">Muistot</div>
    <div class="year" id="year"></div>
    <div class="tag">Sama matka. Enemmän yhdessä.</div>
  </div>
</div>
<nav class="nav">
  <a href="tesla.html"><span class="ic">◎</span>Tänään</a>
  <a href="tesla-kalenteri.html"><span class="ic">▦</span>Kalenteri</a>
  <a href="tvr-vaaka.html"><span class="ic">⌂</span>Koti-TV</a>
  <a class="on" href="tesla-muistot.html"><span class="ic">♡</span>Muistot</a>
</nav>
<script>
(function () {
  var BUILD = "20260922-tesla-v2";
  var photos = [];
  var idx = 0;

  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else cb(null);
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }

  function show() {
    if (!photos.length) return;
    var p = photos[idx % photos.length];
    var img = document.getElementById("photo");
    var place = document.getElementById("place");
    var year = document.getElementById("year");
    if (img) {
      img.style.opacity = "0";
      setTimeout(function () {
        img.src = p.src;
        img.onload = function () { img.style.opacity = "1"; };
      }, 200);
    }
    if (place) place.textContent = p.place || "Muisto";
    if (year) year.textContent = p.year || "";
  }

  function next() {
    if (!photos.length) return;
    idx = (idx + 1) % photos.length;
    show();
  }

  getJSON("photos-from-matkat.json?v=" + BUILD, function (data) {
    if (data && data.length) {
      photos = data;
      idx = Math.floor(Math.random() * photos.length);
      show();
      setInterval(next, 8000);
    }
  });
})();
</script>
</body>
</html>
