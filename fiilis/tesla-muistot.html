}

}

  color: inherit; text-decoration: none; text-align: center;
  font-size: 1.2vmin; font-weight: 600; min-width: 8vmin;
  padding: .4vmin .6vmin; opacity: .72;
}

@media (max-width: 700px) {

  .nav a { font-size: 0.72rem; min-width: 4.2rem; }

    <div class="tag">Sama matka. Enemmän yhdessä.</div>

<script>
(function () {
  P260922-v96-sync";
  var LS_KEY = "fiilisMemAlbum";
  var PHOTO_DENY = {
    "matka-2018-lontoo-00-002.jpg": 1,
    "matka-2018-lontoo-05-007.jpg": 1,
    "matka-2022-eurooppa-01-031.jpg": 1,
    "matka-2025-costa-brava-02-053.jpg": 1,
    "matka-2025-lontoo-04-062.jpg": 1,
    "matka-2026-brasilia-00-065.jpg": 1,
    "matka-2026-brasilia-03-068.jpg": 1
  };
  var FALLBACK = [
    { src: "photos-web/matka-2018-lontoo-cover-001.jpg", place: "Lontoo", year: "2018" },
    { src: "photos-web/matka-2019-italia-cover-015.jpg", place: "Italia", year: "2019" },
    { src: "photos-web/matka-2020-norja-cover-022.jpg", place: "Norja", year: "2020" },
    { src: "photos-web/matka-2024-riviera-cover-043.jpg", place: "Riviera", year: "2024" },
    { src: "photos-web/matka-2025-lontoo-cover-057.jpg", place: "Lontoo", year: "2025" },
    { src: "photos-web/matka-2026-alicante-cover-071.jpg", place: "Alicante", year: "2026" }
  ];
  var albums = [];
  var albumId = "kaikki";
  var photos = FALLBACK.slice(0);
  var idx = 0;
  var timer = null;

  function photoDenied(src) {
    if (!src) return true;
    var base = String(src).split("/").pop();
    return !!PHOTO_DENY[base];
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else cb(null);
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }
  function loadAlbumPref() {
    try {
      var v = localStorage.getItem(LS_KEY);
      if (v) albumId = v;
    } catch (e) {}
  }
  function saveAlbumPref() {
    try { localStorage.setItem(LS_KEY, albumId); } catch (e) {}
  }
  function buildPool() {
    var out = [];
    if (!albums.length) { photos = FALLBACK.slice(0); return; }
    if (albumId === "kaikki") {
      for (var i = 0; i < albums.length; i++) {
        var ph = albums[i].photos || [];
        for (var j = 0; j < ph.length; j++) {
          var m = ph[j];
          if (m && m.src && !photoDenied(m.src)) {
            out.push({ src: m.src, place: m.place || albums[i].title || "Muisto", year: m.year || "" });
          }
        }
      }
    } else {
      for (var a = 0; a < albums.length; a++) {
        if (albums[a].id === albumId) {
          var list = albums[a].photos || [];
          for (var k = 0; k < list.length; k++) {
            var p = list[k];
            if (p && p.src && !photoDenied(p.src)) {
              out.push({ src: p.src, place: p.place || albums[a].title || "Muisto", year: p.year || "" });
            }
          }
          break;
        }
      }
    }
    photos = out.length ? out : FALLBACK.slice(0);
    idx = 0;
  }
  function renderChips() {
    var el = document.getElementById("chips");
    if (!el) return;
    var items = [{ id: "kaikki", title: "Kaikki" }];
    for (var i = 0; i < albums.length; i++) {
      items.push({ id: albums[i].id, title: albums[i].title });
    }
    el.innerHTML = "";
    for (var c = 0; c < items.length; c++) {
      (function (it) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (it.id === albumId ? " on" : "");
        b.textContent = it.title;
        b.setAttribute("aria-pressed", it.id === albumId ? "true" : "false");
        b.onclick = function () {
          albumId = it.id;
          saveAlbumPref();
          buildPool();
          renderChips();
          show();
          restartTimer();
        };
        el.appendChild(b);
      })(items[c]);
    }
  }
  function show() {
    if (!photos.length) return;
    var p = photos[idx % photos.length];
    var img = document.getElementById("photo");
    var place = document.getElementById("place");
    var year = document.getElementById("year");
    if (img) {
      img.style.opacity = "0";
      setTimeout(function () {
        img.src = p.src;
        img.onload = function () { img.style.opacity = "1"; };
      }, 220);
    }
    if (place) place.textContent = p.place || "Muisto";
    if (year) year.textContent = p.year || "";
  }
  function restartTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () {
      idx = (idx + 1) % photos.length;
      show();
    }, 12000);
  }
  loadAlbumPref();
  getJSON("photos-albums.json?v=" + BUILD, function (data) {
    if (data && data.albums && data.albums.length) {
      albums = data.albums;
      var ok = false;
      for (var i = 0; i < albums.length; i++) if (albums[i].id === albumId) ok = true;
      if (albumId !== "kaikki" && !ok) albumId = "kaikki";
      buildPool();
      renderChips();
      show();
      restartTimer();
      return;
    }
    // fallback flat list
    getJSON("photos-from-matkat.json?v=" + BUILD, function (flat) {
      if (flat && flat.length) {
        var out = [];
        for (var i = 0; i < flat.length; i++) {
          var m = flat[i];
          if (m && m.src && !photoDenied(m.src)) {
            out.push({ src: m.src, place: m.place || "Muisto", year: m.year || "" });
          }
        }
        if (out.length >= 6) photos = out;
      }
      renderChips();
      show();
      restartTimer();
    });
  });
  show();
})();
</script>

<script>
(function () {
  function fromPhone() {
    try {
      var q = location.search || "";
      if (q.indexOf("from=puhelin") >= 0) return true;
      if (window.matchMedia && window.matchMedia("(max-width: 700px)").matches) return true;
    } catch (e) {}
    return false;
  }
  var phone = fromPhone();
  var home = document.getElementById("navHome");
  if (home) {
    home.href = phone ? "puhelin.html" : "tesla.html";
    var lab = home.querySelector(".lab");
    if (lab) lab.textContent = phone ? "Koti" : "Tänään";
  }

  if (cal) cal.href = "tesla-kalenteri.html" + suf;
  var mem = document.getElementById("navMem");
  if (mem) mem.href = "tesla-muistot.html" + suf;
})();
</script>


<script>
(function () {
  function parseMoney(s) {
    if (s == null) return NaN;
    return parseFloat(String(s).replace(/[^0-9.\-]/g, ""));
  }
  function parsePct(s) {
    if (s == null) return NaN;
    return parseFloat(String(s).replace(/[^0-9.\-+]/g, ""));
  }
  function paintTsla(d) {
    var el = document.getElementById("navTsla");
    if (!el || !d || d.price == null) return;
    var p = Number(d.price);
    var pct = Number(d.changePct);
    if (isNaN(p)) return;
    var priceStr = p.toFixed(2);
    var cls = "flat";
    var pctStr = "0.0%";
    if (!isNaN(pct)) {
      if (pct > 0.005) cls = "up";
      else if (pct < -0.005) cls = "dn";
      var sign = pct > 0 ? "+" : "";
      pctStr = sign + pct.toFixed(1) + "%";
    }
    el.innerHTML = priceStr + " <span class=\"" + cls + "\">" + pctStr + "</span>";
  }
  function fromYahoo(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
      if (!meta) return null;
      var price = Number(meta.regularMarketPrice);
      var pct = Number(meta.regularMarketChangePercent);
      if (pct == null || isNaN(pct)) pct = Number(meta.fulldayChangePercent);
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function fromNasdaq(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var p = j && j.data && j.data.primaryData;
      if (!p) return null;
      var price = parseMoney(p.lastSalePrice);
      var pct = parsePct(p.percentageChange);
      if (String(p.netChange || "").indexOf("-") >= 0 || p.deltaIndicator === "down") {
        if (pct > 0) pct = -pct;
      }
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 10000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) cb(null, xhr.responseText);
      else cb("status");
    };
    xhr.onerror = function () { cb("net"); };
    xhr.ontimeout = function () { cb("timeout"); };
    xhr.send();
  }
  function loadLive() {
    // Prefer local tsla.json first (fast, same-origin), then live Yahoo via allorigins
    var v = Math.floor(Date.now() / 60000);
    xhrGet("tsla.json?v=" + v, function (err0, text0) {
      if (!err0 && text0) {
        try { paintTsla(JSON.parse(text0)); } catch (e) {}
      }
      var yahooUrl = "https://api.allorigins.win/raw?url=" +
        encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/TSLA?interval=1d&range=5d");
      xhrGet(yahooUrl, function (err, text) {
        var d = (!err && text) ? fromYahoo(text) : null;
        if (d) { paintTsla(d); return; }
        var nasdaqUrl = "https://api.allorigins.win/raw?url=" +
          encodeURIComponent("https://api.nasdaq.com/api/quote/TSLA/info?assetclass=stocks");
        xhrGet(nasdaqUrl, function (err2, text2) {
          var d2 = (!err2 && text2) ? fromNasdaq(text2) : null;
          if (d2) paintTsla(d2);
        });
      });
    });
  }
  loadLive();
  setInterval(loadLive, 60000);
})();
</script>
