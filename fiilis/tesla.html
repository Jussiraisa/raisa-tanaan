      var srcA = a.src + (a.src.indexOf("?") >= 0 ? "&" : "?") + "slot=" + slot;
      if (img.getAttribute("data-slot") !== String(slot)) {
        img.setAttribute("data-slot", String(slot));
        img.src = srcA;
      }
      if (cap) cap.textContent = (a.place || "") + (a.year ? " " + a.year : "");
    }
    if (b && q) {
      var srcB = b.src + (b.src.indexOf("?") >= 0 ? "&" : "?") + "slot=" + (slot + 13);
      if (q.getAttribute("data-slot") !== String(slot + 13)) {
        q.setAttribute("data-slot", String(slot + 13));
        q.src = srcB;
      }
    }
    var qt = document.getElementById("quoteTxt");
    if (qt && now) qt.textContent = "”" + QUOTES[slot % QUOTES.length] + "”";
  }

  function nextPhotos() {
    paintPhotos(helsinkiNow());
  }

  function isNiceExpectation(label3) {
    var s = String(label3 || "");
    if (/wilma|poissaolo|koe|koulu|opettaj|hakemus|terapia|huolto|päivätyö|päättöviikko|kirjoitustaito|ruotsi|geometria|yhtälö/i.test(s)) return false;
    if (/prep|paisto|porkkanakakku|valmistelu/i.test(s)) return false;
    return /synt|syntymäpäiv|juhla|hääpäiv|loma|matka|lontoo/i.test(s);
  }
  function daysUntilIso(iso, now) {
    if (!iso) return 9999;
    var a = new Date(now.iso + "T12:00:00");
    var b = new Date(iso + "T12:00:00");
    return Math.round((b - a) / 86400000);
  }
  function nextAnniversaryIsoTesla(a, now) {
    var mmdd = a.mmdd;
    if (!mmdd && a.date) {
      var p = String(a.date).split("-");
      if (p.length >= 3) mmdd = p[1] + "-" + p[2];
    }
    if (!mmdd) return null;
    var iso = now.year + "-" + mmdd;
    if (iso < now.iso) iso = (now.year + 1) + "-" + mmdd;
    return iso;
  }
  function paintExpectations(now) {
    var el = document.getElementById("expectList");
    if (!el) return;
    var items = [], seen = {};
    var exps = (schedule && schedule.expectations) || [];
    for (var i = 0; i < exps.length; i++) {
      var x = exps[i];
      if (!x || !x.start || !isNiceExpectation(x.label)) continue;
      if (now.iso > (x.end || x.start)) continue;
      if (/lontoo/i.test(String(x.label || ""))) continue;
      var d = daysUntilIso(x.start, now);
      if (d < 0 || d > 60) continue;
      var k = String(x.label || "").toLowerCase() + "|" + x.start;
      if (seen[k]) continue;
      seen[k] = 1;
      items.push({label:x.label,days:d});
    }
    var anns = (schedule && schedule.anniversaries) || [];
    for (var j = 0; j < anns.length; j++) {
      var a = anns[j], iso = nextAnniversaryIsoTesla(a, now);
      if (!iso) continue;
      var d2 = daysUntilIso(iso, now);
      if (d2 < 0 || d2 > 60) continue;
      var label = a.label || "";
      if (!label) {
        if (a.kind === "birthday") label = (a.who || "") + " · syntymäpäivä";
        else if (a.kind === "wedding") label = "Hääpäivä";
        else if (a.kind === "party") label = (a.who || "") + " · juhlat";
        else continue;
      } else if (a.who && a.who !== "perhe" && label.indexOf(a.who) < 0) {
        label = a.who + " · " + label;
      }
      var k2 = label.toLowerCase() + "|" + iso;
      if (seen[k2]) continue;
      seen[k2] = 1;
      items.push({label:label,days:d2});
    }
    items.sort(function(a,b){ return a.days-b.days; });
    var html = "";
    var max = Math.min(items.length,3);
    for (var n=0;n<max;n++) {
      var it=items[n];
      var rem = it.days===0 ? "nyt" : (it.days===1 ? "huom" : it.days+" pv");
      html += "<div class=\"expect-row\"><span>"+esc(it.label)+"</span><span class=\"d\">"+esc(rem)+"</span></div>";
    }
    el.innerHTML = html || "<div class=\"news-empty\">Ei odotuksia</div>";
  }

  function paintMeals(now) {
    var schoolEl = document.getElementById("mealSchool");
    var homeEl = document.getElementById("mealHome");
    if (!schoolEl && !homeEl) return;
    var schoolMap = (schedule && schedule.schoolLunch) || {};
    var homeMap = (schedule && schedule.homeMeals) || {};
    var school = schoolMap[now.iso] || "";
    var home = homeMap[now.iso] || "";
    if (schoolEl) {
      if (school) {
        schoolEl.className = "v";
        schoolEl.textContent = school;
      } else {
        schoolEl.className = "v muted";
        schoolEl.textContent = "Ei merkintää";
      }
    }
    if (homeEl) {
      if (home) {
        homeEl.className = "v";
        homeEl.textContent = home;
      } else {
        homeEl.className = "v muted";
        homeEl.textContent = "Ei merkintää";
      }
    }
  }


  var newsData = null;

  function paintNews() {
    var yleEl = document.getElementById("newsYle");
    var xEl = document.getElementById("newsX");
    if (!yleEl && !xEl) return;
    function lines(arr, maxN) {
      arr = arr || [];
      var html = "";
      var n = Math.min(arr.length, maxN);
      for (var i = 0; i < n; i++) {
        var it = arr[i];
        if (!it || !it.title) continue;
        html += "<div class=\"news-line\"><span class=\"dot\"></span><span class=\"ttl\">"
          + esc(it.title) + "</span></div>";
      }
      return html || "<div class=\"news-empty\">Ei otsikoita juuri nyt</div>";
    }
    if (yleEl) yleEl.innerHTML = lines(newsData && newsData.yle, 3);
    if (xEl) xEl.innerHTML = lines(newsData && newsData.x, 4);
  }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clock = document.getElementById("clock");
    var greet = document.getElementById("greet");
    var dateEl = document.getElementById("dateLine");
    if (clock) clock.textContent = pad(now.hour) + "." + pad(now.minute);
    if (greet) greet.textContent = greeting(now.hour);
    if (dateEl) dateEl.textContent = DAYS[now.wd].full + " " + now.day + "." + now.month + ".";
    paintToday(now);
    paintPeople(now);
    paintMeals(now);
    paintExpectations(now);
    paintNews();
    paintWx();
    paintPhotos(now);
    var bs = document.getElementById("buildStamp");
    if (bs) bs.textContent = BUILD;
  }

  
  function paintSaunaWarn(d) {
    var el = document.getElementById("saunaWarn");
    if (!el) return;
    var warn = !!(d && (d.saunaEveningWarn === true || d.saunaEveningWarn === "on" || d.saunaEveningWarn === 1));
    var wanted = !(d && (d.saunaWanted === false || d.saunaWanted === "off" || d.saunaWanted === 0));
    if (warn && wanted) {
      el.className = "sauna-warn on";
      el.setAttribute("title", "Saunailta ei ehdi lämmetä");
    } else {
      el.className = "sauna-warn";
      el.removeAttribute("title");
    }
  }
  function loadHa() {
    getJSON("ha.json?v=" + BUILD + "&t=" + Math.floor(Date.now()/60000), function (data) {
      if (data) paintSaunaWarn(data);
    });
  }

  function loadSchedule() {
    getJSON("schedule.json?v=" + BUILD, function (data) {
      if (data) schedule = data;
      loadHa();
  setInterval(loadHa, 60000);
  paint();
    });
    getJSON("news.json?v=" + BUILD + "&t=" + Math.floor(Date.now()/300000), function (data) {
      if (data) newsData = data;
      paintNews();
    });
  }
  function daysUntilIso(iso, now) {
    try {
      var a = Date.parse(iso + "T12:00:00");
      var b = Date.parse(now.iso + "T12:00:00");
      return Math.round((a - b) / 86400000);
    } catch (e) { return 99; }
  }
  function londonW(now) {
    var d = daysUntilIso(LONTOO_START, now);
    if (now.iso >= LONTOO_START && now.iso <= LONTOO_END) return 0.50;
    if (d < 0) return 0.10;
    if (d > 21) return 0.25;
    if (d >= 8) return 0.45;
    return 0.60;
  }
  function weightPhotos(list, now) {
    if (!list || !list.length) return list || [];
    var lw = londonW(now);
    var lon = [], oth = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var isL = (p.place && /lontoo/i.test(p.place)) || (p.tags && p.tags.indexOf("london") >= 0);
      if (isL) lon.push(p); else oth.push(p);
    }
    var n = Math.min(list.length, 48);
    var nL = Math.round(n * lw);
    if (nL > lon.length) nL = lon.length;
    var out = lon.slice(0, nL).concat(oth.slice(0, n - nL));
    // light shuffle
    for (var j = out.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = out[j]; out[j] = out[k]; out[k] = tmp;
    }
    return out.length ? out : list;
  }
  function loadPhotos() {
    getJSON("photos-from-matkat.json?v=" + BUILD, function (data) {
      if (data && data.length) photos = weightPhotos(data, helsinkiNow());
      paint();
    });
  }
  function loadWx() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&current=temperature_2m,weather_code,wind_speed_10m&daily=weathercode,temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=7";
    getJSON(url, function (data) {
      if (!data) return;
      if (data.current) {
        wxState.current = {
          temp: data.current.temperature_2m,
          code: data.current.weather_code,
          wind: data.current.wind_speed_10m
        };
      }
      if (data.daily) {
        wxState.daily = data.daily;
        if (wxState.current) {
          wxState.current.tmin = data.daily.temperature_2m_min[0];
          wxState.current.tmax = data.daily.temperature_2m_max[0];
        }
      }
      paint();
    });
  }

  loadSchedule();
  loadPhotos();
  loadWx();
  setInterval(function () { paint(); }, 30000);
  setInterval(nextPhotos, 3000);
  setInterval(loadWx, 15 * 60 * 1000);
})();
</script>

<script>
(function () {
  function paintTsla(d) {
    var el = document.getElementById("navTsla");
    if (!el || !d || d.price == null) return;
    var p = Number(d.price);
    var pct = Number(d.changePct);
    if (isNaN(p)) return;
    var priceStr = p.toFixed(2);
    var cls = "flat";
    var pctStr = "0.0%";
    if (!isNaN(pct)) {
      if (pct > 0.005) cls = "up";
      else if (pct < -0.005) cls = "dn";
      var sign = pct > 0 ? "+" : "";
      pctStr = sign + pct.toFixed(1) + "%";
    }
    el.innerHTML = priceStr + " <span class=\"" + cls + "\">" + pctStr + "</span>";
  }
  function fromYahoo(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
      if (!meta) return null;
      var price = Number(meta.regularMarketPrice);
      var pct = Number(meta.regularMarketChangePercent);
      if (pct == null || isNaN(pct)) pct = Number(meta.fulldayChangePercent);
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) cb(null, xhr.responseText);
      else cb("status");
    };
    xhr.onerror = function () { cb("net"); };
    xhr.ontimeout = function () { cb("timeout"); };
    xhr.send();
  }
  function loadLive() {
    var v = Math.floor(Date.now() / 60000);
    // 1) same-origin cache first — shows immediately on phone
    xhrGet("tsla.json?v=" + v, function (err0, text0) {
      if (!err0 && text0) {
        try { paintTsla(JSON.parse(text0)); } catch (e) {}
      }
      // 2) then try live Yahoo via proxy (non-blocking upgrade)
      var yahooUrl = "https://api.allorigins.win/raw?url=" +
        encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/TSLA?interval=1d&range=5d");
      xhrGet(yahooUrl, function (err, text) {
        var d = (!err && text) ? fromYahoo(text) : null;
        if (d) paintTsla(d);
      });
    });
  }
  loadLive();
  setInterval(loadLive, 60000);
})();
</script>
