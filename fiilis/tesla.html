  function evEnd(e) {
    var en = parseMin(e.end);
    if (en != null) return en;
    var st = parseMin(e.time);
    if (st == null) return null;
    return st + 60;
  }
  function colorWho(who) { return WHO_COLOR[who] || "#b8a090"; }
  function initial(who) {
    if (!who) return "?";
    if (who === "perhe" || who === "Perhe") return "P";
    return String(who).charAt(0);
  }
  function matchesWho(e, who) {
    if (!e) return false;
    if (e.who === who) return true;
    if ((e.who === "perhe" || e.who === "Perhe") && (who === "Jussi" || who === "Riikka")) return true;
    if ((who === "Jussi" || who === "Riikka") && (e.driver === who || e.pickup === who)) return true;
    return false;
  }
  function statusFor(who, now, list) {
    var live = null, next = null, nextDiff = 99999;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!matchesWho(e, who)) continue;
      var st = parseMin(e.time);
      var en = evEnd(e);
      if (st != null && en != null && st <= now.minutes && now.minutes < en) {
        if (e.who === who || e.who === "perhe" || e.who === "Perhe") { live = e; break; }
      }
      if (st != null && st > now.minutes) {
        var d = st - now.minutes;
        if (d < nextDiff) { nextDiff = d; next = e; }
      } else if (st == null && !next && (e.who === who || e.who === "perhe" || e.who === "Perhe")) {
        next = e;
      }
    }
    if (live) {
      return { text: live.title + (live.end ? " " + fmtHm(live.end) + " asti" : ""), live: true, color: colorWho(who) };
    }
    if (next) {
      var t = next.time ? fmtHm(next.time) + " " : "";
      return { text: t + (next.title || ""), live: false, color: colorWho(who) };
    }
    if ((who === "Ellen" || who === "Samuel" || who === "Milla" || who === "Mea") && now.wd >= 1 && now.wd <= 5 && now.minutes < 14 * 60) {
      return { text: "Koulupäivä", live: true, color: colorWho(who) };
    }
    return { text: "Vapaata", live: false, color: "#a09080" };
  }

  function paintPeople(now) {
    var row = document.getElementById("peopleRow");
    if (!row) return;
    var list = todayNonSchool(now);
    var html = "";
    for (var i = 0; i < PEOPLE.length; i++) {
      var who = PEOPLE[i];
      var st = statusFor(who, now, list);
      html += "<div class=\"card chip\">";
      html += "<div class=\"av\" style=\"background:" + st.color + "\">" + esc(initial(who)) + "</div>";
      html += "<div style=\"min-width:0\"><div class=\"nm\">" + esc(who);
      if (st.live) html += "<span class=\"dot\" style=\"background:#3a9a5a\"></span>";
      html += "</div><div class=\"st\">" + esc(st.text) + "</div></div></div>";
    }
    row.innerHTML = html;
  }

  function paintToday(now) {
    var list = todayNonSchool(now);
    var box = document.getElementById("todayList");
    var nowBox = document.getElementById("nowBox");
    if (!box) return;
    var liveIdx = -1, nextIdx = -1, nextDiff = 99999;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var st = parseMin(e.time);
      var en = evEnd(e);
      if (st != null && en != null && st <= now.minutes && now.minutes < en) { liveIdx = i; break; }
      if (st != null && st > now.minutes) {
        var d = st - now.minutes;
        if (d < nextDiff) { nextDiff = d; nextIdx = i; }
      }
    }
    if (nowBox) {
      if (liveIdx >= 0) {
        var L = list[liveIdx];
        nowBox.innerHTML = "<div class=\"nowpill\"><span class=\"b\">Nyt</span>" +
          esc(fmtRange(L.time, L.end)) + " " + esc(L.who || "") + " " + esc(L.title || "") + "</div>";
      } else if (nextIdx >= 0) {
        var N = list[nextIdx];
        var extra = nextDiff < 60 ? (" · " + nextDiff + " min") : "";
        nowBox.innerHTML = "<div class=\"nowpill\"><span class=\"b\">Seuraavaksi</span>" +
          esc(fmtRange(N.time, N.end)) + " " + esc(N.who || "") + " " + esc(N.title || "") + esc(extra) + "</div>";
      } else {
        nowBox.innerHTML = "";
      }
    }
    var html = "";
    for (var j = 0; j < list.length; j++) {
      var e2 = list[j];
      var st2 = parseMin(e2.time);
      var en2 = evEnd(e2);
      var cls = "tev";
      if (st2 != null && en2 != null && now.minutes >= en2) cls += " past";
      else if (j === liveIdx) cls += " live";
      var when = fmtRange(e2.time, e2.end) || "—";
      var bits = [];
      if (e2.who && e2.who !== "perhe" && e2.who !== "Perhe") bits.push(e2.who);
      bits.push(e2.title || "");
      var meta = [];
      if (e2.driver) meta.push(e2.driver);
      else if (e2.place) meta.push(e2.place);
      html += "<div class=\"" + cls + "\">";
      html += "<div class=\"when\">" + esc(when) + "</div>";
      html += "<div class=\"dotc\" style=\"background:" + colorWho(e2.who) + "\"></div>";
      html += "<div class=\"txt\">" + esc(bits.join(" · "));
      if (meta.length) html += " <span class=\"meta\">· " + esc(meta.join(" · ")) + "</span>";
      html += "</div></div>";
    }
    if (!html) html = "<div class=\"tev\"><div class=\"txt\" style=\"color:#7a6a55\">Ei merkintöjä tänään</div></div>";
    box.innerHTML = html;

    var card = document.getElementById("navCard");
    var dest = document.getElementById("navDest");
    var metaEl = document.getElementById("navMeta");
    var focus = liveIdx >= 0 ? list[liveIdx] : (nextIdx >= 0 ? list[nextIdx] : null);
    if (focus && dest && metaEl && card) {
      card.className = "navcard";
      dest.textContent = focus.place || focus.title || "—";
      var parts = [];
      if (focus.time) parts.push(fmtRange(focus.time, focus.end));
      if (focus.who) parts.push(focus.who);
      if (focus.title && focus.place) parts.push(focus.title);
      if (focus.driver) parts.push("kuski " + focus.driver);
      metaEl.innerHTML = esc(parts.join(" · "));
    } else if (dest && metaEl && card) {
      card.className = "navcard empty";
      dest.textContent = "Kotona / ei ajoa";
      metaEl.textContent = "";
    }
  }

  function paintWx() {
    var c = wxState.current;
    if (!c) return;
    var w = wmo(c.code);
    var ico = document.getElementById("wxIco");
    var temp = document.getElementById("wxTemp");
    var phr = document.getElementById("wxPhr");
    var hl = document.getElementById("wxHl");
    if (ico) ico.textContent = w.icon;
    if (temp) temp.textContent = Math.round(c.temp) + "°";
    if (phr) phr.textContent = w.phrase.charAt(0).toUpperCase() + w.phrase.slice(1);
    var bits = [];
    if (c.tmin != null && c.tmax != null) bits.push(Math.round(c.tmin) + "°  " + Math.round(c.tmax) + "°");
    if (c.wind != null) bits.push(Math.round(c.wind) + " m/s");
    if (hl) hl.textContent = bits.join(" · ");
  }

  function paintWeek(now) {
    var el = document.getElementById("weekWx");
    if (!el || !wxState.daily) return;
    var d = wxState.daily;
    var html = "";
    var n = Math.min(5, (d.time || []).length);
    for (var i = 0; i < n; i++) {
      var iso = d.time[i];
      var p = String(iso).split("-");
      var dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
      var wd = dt.getUTCDay();
      var codes = d.weathercode || d.weather_code || [];
      var ww = wmo(codes[i]);
      var tmin = Math.round((d.temperature_2m_min || [])[i]);
      var tmax = Math.round((d.temperature_2m_max || [])[i]);
      var on = iso === now.iso ? " on" : "";
      html += "<div class=\"wd" + on + "\"><div class=\"d\">" + DAYS[wd].short + "</div>";
      html += "<div class=\"i\">" + ww.icon + "</div>";
      html += "<div class=\"t\">" + tmin + "°/" + tmax + "°</div></div>";
    }
    el.innerHTML = html;
  }

  function pickPhoto(seed) {
    if (!photos.length) return null;
    return photos[Math.abs(seed) % photos.length];
  }

  var PHOTO_MS = 12000;
  var lastPhotoSlot = -1;

  function paintPhotos(now) {
    if (!photos.length) return;
    var slot = Math.floor(Date.now() / PHOTO_MS);
    lastPhotoSlot = slot;
    var a = photos[slot % photos.length];
    var b = photos[(slot + 13) % photos.length];
    var img = document.getElementById("heroImg");
    var cap = document.getElementById("photoCapL");
    var q = document.getElementById("quoteImg");
    if (a && img) {
      var srcA = a.src + (a.src.indexOf("?") >= 0 ? "&" : "?") + "slot=" + slot;
      if (img.getAttribute("data-slot") !== String(slot)) {
        img.setAttribute("data-slot", String(slot));
        img.src = srcA;
      }
      if (cap) cap.textContent = (a.place || "") + (a.year ? " " + a.year : "");
    }
    if (b && q) {
      var srcB = b.src + (b.src.indexOf("?") >= 0 ? "&" : "?") + "slot=" + (slot + 13);
      if (q.getAttribute("data-slot") !== String(slot + 13)) {
        q.setAttribute("data-slot", String(slot + 13));
        q.src = srcB;
      }
    }
    var qt = document.getElementById("quoteTxt");
    if (qt && now) qt.textContent = "”" + QUOTES[slot % QUOTES.length] + "”";
  }

  function nextPhotos() {
    paintPhotos(helsinkiNow());
  }

  function paintMeals(now) {
    var schoolEl = document.getElementById("mealSchool");
    var homeEl = document.getElementById("mealHome");
    if (!schoolEl && !homeEl) return;
    var schoolMap = (schedule && schedule.schoolLunch) || {};
    var homeMap = (schedule && schedule.homeMeals) || {};
    var school = schoolMap[now.iso] || "";
    var home = homeMap[now.iso] || "";
    if (schoolEl) {
      if (school) {
        schoolEl.className = "v";
        schoolEl.textContent = school;
      } else {
        schoolEl.className = "v muted";
        schoolEl.textContent = "Ei merkintää";
      }
    }
    if (homeEl) {
      if (home) {
        homeEl.className = "v";
        homeEl.textContent = home;
      } else {
        homeEl.className = "v muted";
        homeEl.textContent = "Ei merkintää";
      }
    }
  }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clock = document.getElementById("clock");
    var greet = document.getElementById("greet");
    var dateEl = document.getElementById("dateLine");
    if (clock) clock.textContent = pad(now.hour) + "." + pad(now.minute);
    if (greet) greet.textContent = greeting(now.hour);
    if (dateEl) dateEl.textContent = DAYS[now.wd].full + " " + now.day + "." + now.month + ".";
    paintToday(now);
    paintPeople(now);
    paintMeals(now);
    paintWx();
    paintPhotos(now);
    var bs = document.getElementById("buildStamp");
    if (bs) bs.textContent = BUILD;
  }

  function loadSchedule() {
    getJSON("schedule.json?v=" + BUILD, function (data) {
      if (data) schedule = data;
      paint();
    });
  }
  function daysUntilIso(iso, now) {
    try {
      var a = Date.parse(iso + "T12:00:00");
      var b = Date.parse(now.iso + "T12:00:00");
      return Math.round((a - b) / 86400000);
    } catch (e) { return 99; }
  }
  function londonW(now) {
    var d = daysUntilIso(LONTOO_START, now);
    if (now.iso >= LONTOO_START && now.iso <= LONTOO_END) return 0.50;
    if (d < 0) return 0.10;
    if (d > 21) return 0.25;
    if (d >= 8) return 0.45;
    return 0.60;
  }
  function weightPhotos(list, now) {
    if (!list || !list.length) return list || [];
    var lw = londonW(now);
    var lon = [], oth = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var isL = (p.place && /lontoo/i.test(p.place)) || (p.tags && p.tags.indexOf("london") >= 0);
      if (isL) lon.push(p); else oth.push(p);
    }
    var n = Math.min(list.length, 48);
    var nL = Math.round(n * lw);
    if (nL > lon.length) nL = lon.length;
    var out = lon.slice(0, nL).concat(oth.slice(0, n - nL));
    // light shuffle
    for (var j = out.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = out[j]; out[j] = out[k]; out[k] = tmp;
    }
    return out.length ? out : list;
  }
  function loadPhotos() {
    getJSON("photos-from-matkat.json?v=" + BUILD, function (data) {
      if (data && data.length) photos = weightPhotos(data, helsinkiNow());
      paint();
    });
  }
  function loadWx() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&current=temperature_2m,weather_code,wind_speed_10m&daily=weathercode,temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=7";
    getJSON(url, function (data) {
      if (!data) return;
      if (data.current) {
        wxState.current = {
          temp: data.current.temperature_2m,
          code: data.current.weather_code,
          wind: data.current.wind_speed_10m
        };
      }
      if (data.daily) {
        wxState.daily = data.daily;
        if (wxState.current) {
          wxState.current.tmin = data.daily.temperature_2m_min[0];
          wxState.current.tmax = data.daily.temperature_2m_max[0];
        }
      }
      paint();
    });
  }

  loadSchedule();
  loadPhotos();
  loadWx();
  setInterval(function () { paint(); }, 30000);
  setInterval(nextPhotos, 3000);
  setInterval(loadWx, 15 * 60 * 1000);
})();
</script>

</script>




<script>
(function () {
  function paintTsla(d) {
    var el = document.getElementById("navTsla");
    if (!el || !d || d.price == null) return;
    var p = Number(d.price);
    var pct = Number(d.changePct);
    if (isNaN(p)) return;
    var priceStr = p.toFixed(2);
    var cls = "flat";
    var pctStr = "0.0%";
    if (!isNaN(pct)) {
      if (pct > 0.005) cls = "up";
      else if (pct < -0.005) cls = "dn";
      var sign = pct > 0 ? "+" : "";
      pctStr = sign + pct.toFixed(1) + "%";
    }
    el.innerHTML = priceStr + " <span class=\"" + cls + "\">" + pctStr + "</span>";
  }
  function fromYahoo(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
      if (!meta) return null;
      var price = Number(meta.regularMarketPrice);
      var pct = Number(meta.regularMarketChangePercent);
      if (pct == null || isNaN(pct)) pct = Number(meta.fulldayChangePercent);
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) cb(null, xhr.responseText);
      else cb("status");
    };
    xhr.onerror = function () { cb("net"); };
    xhr.ontimeout = function () { cb("timeout"); };
    xhr.send();
  }
  function loadLive() {
    var v = Math.floor(Date.now() / 60000);
    // 1) same-origin cache first — shows immediately on phone
    xhrGet("tsla.json?v=" + v, function (err0, text0) {
      if (!err0 && text0) {
        try { paintTsla(JSON.parse(text0)); } catch (e) {}
      }
      // 2) then try live Yahoo via proxy (non-blocking upgrade)
      var yahooUrl = "https://api.allorigins.win/raw?url=" +
        encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/TSLA?interval=1d&range=5d");
      xhrGet(yahooUrl, function (err, text) {
        var d = (!err && text) ? fromYahoo(text) : null;
        if (d) paintTsla(d);
      });
    });
  }
  loadLive();
  setInterval(loadLive, 60000);
})();
</script>
