    var parts = {};
    try {
      var fmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        weekday: "short", hour12: false
      });
      var arr = fmt.formatToParts(d);
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].type !== "literal") parts[arr[i].type] = arr[i].value;
      }
    } catch (e) {
      var hki = new Date(d.getTime() + 3 * 60 * 60 * 1000);
      parts.year = String(hki.getUTCFullYear());
      parts.month = pad(hki.getUTCMonth() + 1);
      parts.day = pad(hki.getUTCDate());
      parts.hour = pad(hki.getUTCHours());
      parts.minute = pad(hki.getUTCMinutes());
      parts.weekday = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][hki.getUTCDay()];
    }
    var wdMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    var wd = wdMap[parts.weekday];
    if (wd == null) wd = new Date().getDay();
    var hour = parseInt(parts.hour, 10);
    if (parts.hour === "24") hour = 0;
    var minute = parseInt(parts.minute, 10) || 0;
    var year = parseInt(parts.year, 10);
    var month = parseInt(parts.month, 10);
    var day = parseInt(parts.day, 10);
    return {
      year: year, month: month, day: day, hour: hour, minute: minute, wd: wd,
      key: DAYS[wd].key, iso: year + "-" + pad(month) + "-" + pad(day),
      minutes: hour * 60 + minute
    };
  }

  function greeting(hour) {
    if (hour >= 5 && hour < 11) return "Hyvää huomenta";
    if (hour >= 11 && hour < 17) return "Hyvää päivää";
    if (hour >= 17 && hour < 22) return "Hyvää iltaa";
    return "Hyvää yötä";
  }

  function themeClass(hour) {
    if (hour >= 5 && hour < 11) return "morning";
    if (hour >= 11 && hour < 17) return "afternoon";
    if (hour >= 17 && hour < 22) return "evening";
    return "night";
  }

  function applyTheme(hour) {
    document.body.className = themeClass(hour);
  }

  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function fmtRange(a, b) {
    if (!a && !b) return "";
    if (a && b) return fmtHm(a) + "–" + fmtHm(b);
    return a ? fmtHm(a) : "";
  }

  function daysUntil(iso, now) {
    var a = Date.UTC(now.year, now.month - 1, now.day);
    var p = String(iso).split("-");
    var b = Date.UTC(+p[0], +p[1] - 1, +p[2]);
    return Math.round((b - a) / 86400000);
  }

  function addDaysIso(iso, n) {
    var p = String(iso).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }

  function isoParts(iso) {
    var p = String(iso).split("-");
    return { y: +p[0], m: +p[1], d: +p[2] };
  }

  function wmo(code) {
    if (code === 0) return { icon: "☀️", phrase: "selkeää" };
    if (code <= 2) return { icon: "🌤️", phrase: "melkein selkeää" };
    if (code === 3) return { icon: "☁️", phrase: "pilvistä" };
    if (code === 45 || code === 48) return { icon: "🌫️", phrase: "sumua" };
    if (code >= 51 && code <= 57) return { icon: "🌦️", phrase: "tihkua" };
    if (code >= 61 && code <= 67) return { icon: "🌧️", phrase: "sadetta" };
    if (code >= 71 && code <= 77) return { icon: "❄️", phrase: "lunta" };
    if (code >= 80 && code <= 82) return { icon: "🌦️", phrase: "kuuroja" };
    if (code >= 85 && code <= 86) return { icon: "🌨️", phrase: "lumikuuroja" };
    if (code >= 95) return { icon: "⛈️", phrase: "ukkosta" };
    return { icon: "🌡️", phrase: "vaihtelevaa" };
  }

  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else {
            cb(null);
          }
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }

  function chipHtml(who) {
    var col = WHO_COLOR[who];
    if (!col) return esc(who || "");
    return "<span class=\"namechip\" style=\"background:" + col + "\">" + esc(who) + "</span>";
  }

  function isAbsentDriver(name, iso) {
    if (!name || !schedule || !schedule.absences) return false;
    var abs = schedule.absences;
    for (var i = 0; i < abs.length; i++) {
      var a = abs[i];
      if (a.who === name && iso >= a.from && iso <= a.to) return true;
    }
    return false;
  }

  function driverOf(e, iso) {
    if (!e) return "";
    var d = e.driver || "";
    var p = e.pickup || "";
    if (d && isAbsentDriver(d, iso)) d = "";
    if (p && isAbsentDriver(p, iso)) p = "";
    if (d && p && d === p) return d;
    if (d && p) return d + " / " + p;
    return d || p || "";
  }

  function schoolTarget(now) {
    var wd = now.wd;
    var tomorrow = false;
    var dayIdx = wd;
    var lunchIso = now.iso;
    var label = "Koulu";
    /* weekend → next Monday school; Fri evening also peek Monday if desired — user: weekend evening */
    if (wd === 0 || wd === 6) {
      dayIdx = 1;
      tomorrow = true;
      lunchIso = addDaysIso(now.iso, wd === 0 ? 1 : 2);
      label = "Koulu · maanantai";
    } else if ((wd === 5 || wd === 6 || wd === 0) && now.hour >= 17) {
      /* weekend evening already covered; Fri evening show Monday */
      if (wd === 5 && now.hour >= 17) {
        dayIdx = 1;
        tomorrow = true;
        lunchIso = addDaysIso(now.iso, 3);
        label = "Koulu · maanantai";
      }
    }
    return { wd: dayIdx, tomorrow: tomorrow, lunchIso: lunchIso, label: label };
  }

  function schoolForTarget(tgt) {
    var out = [];
    if (!schedule || !schedule.schoolStarts) return out;
    var list = schedule.schoolStarts;
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      var wds = s.weekdays || [];
      var ok = false;
      for (var j = 0; j < wds.length; j++) if (wds[j] === tgt.wd) ok = true;
      if (ok) out.push(s);
    }
    out.sort(function (a, b) {
      var ia = KID_ORDER.indexOf(a.who); if (ia < 0) ia = 99;
      var ib = KID_ORDER.indexOf(b.who); if (ib < 0) ib = 99;
      if (ia !== ib) return ia - ib;
      return (parseMin(a.time) || 0) - (parseMin(b.time) || 0);
    });
    return out;
  }

  function eventsOn(iso) {
    var out = [];
    if (!schedule || !schedule.events) return out;
    var list = schedule.events;
    for (var i = 0; i < list.length; i++) {
      if (list[i].date === iso) out.push(list[i]);
    }
    out.sort(function (a, b) {
      return (parseMin(a.time) || 0) - (parseMin(b.time) || 0);
    });
    return out;
  }

  function remainingEvents(now) {
    var list = eventsOn(now.iso);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.kind === "matka") continue;
      var end = parseMin(e.end);
      var start = parseMin(e.time);
      var doneAt = end != null ? end : (start != null ? start + 60 : null);
      if (doneAt != null && doneAt <= now.minutes) continue;
      out.push(e);
    }
    return out;
  }

  function paintSchool(now) {
    var el = document.getElementById("todaySchool");
    var lbl = document.getElementById("kouluLbl");
    var lunchEl = document.getElementById("schoolLunch");
    if (!el) return;
    var tgt = schoolTarget(now);
    if (lbl) lbl.textContent = tgt.label;
    var list = schoolForTarget(tgt);
    if (!list.length) {
      el.innerHTML = "<div class=\"empty muted\">Ei koulua</div>";
    } else {
      var html = "";
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        html += "<div class=\"row\">"
          + "<div>" + chipHtml(s.who)
          + "<div class=\"meta muted\">" + esc(s.label || "Koulu") + "</div></div>"
          + "<div class=\"hrs\">" + esc(fmtRange(s.time, s.end)) + "</div></div>";
      }
      el.innerHTML = html;
    }
    if (lunchEl) {
      var lunch = "";
      if (schedule && schedule.schoolLunch) lunch = schedule.schoolLunch[tgt.lunchIso] || "";
      if (lunch) {
        lunchEl.style.display = "block";
        lunchEl.innerHTML = "<span class=\"accent\">Kouluruoka</span> · " + esc(lunch);
      } else {
        lunchEl.style.display = "none";
        lunchEl.innerHTML = "";
      }
    }
  }

  function paintEvents(now) {
    var el = document.getElementById("todayEvents");
    if (!el) return;
    var list = remainingEvents(now);
    if (!list.length) {
      el.innerHTML = "<div class=\"empty muted\">Rauhallinen ilta</div>";
      return;
    }
    var html = "";
    var max = Math.min(list.length, 5);
    for (var i = 0; i < max; i++) {
      var e = list[i];
      var drv = driverOf(e, now.iso);
      var whoBit = (e.who && e.who !== "perhe") ? chipHtml(e.who) + " " : "";
      html += "<div class=\"row\" style=\"display:block\">"
        + "<div class=\"hrs accent\" style=\"margin:0\">" + esc(fmtRange(e.time, e.end) || "") + "</div>"
        + "<div class=\"who\">" + whoBit + esc(e.title || "") + "</div>"
        + (e.place ? "<div class=\"meta muted\">" + esc(e.place) + "</div>" : "")
        + (drv ? "<div class=\"drv accent\">" + esc(drv) + "</div>" : "")
        + "</div>";
    }
    el.innerHTML = html;
  }

  function nextAnniversaryIso(ann, now) {
    var mmdd = ann.mmdd;
    if (!mmdd && ann.date) {
      var p = String(ann.date).split("-");
      mmdd = p[1] + "-" + p[2];
    }
    if (!mmdd) return null;
    var cand = now.year + "-" + mmdd;
    if (cand < now.iso) cand = (now.year + 1) + "-" + mmdd;
    return cand;
  }

  function paintOdotukset(now) {
    var el = document.getElementById("countdown");
    var listEl = document.getElementById("odoteList");
    if (el) {
      var d = daysUntil(LONTOO_START, now);
      if (d > 1) {
        el.innerHTML = "Lontoo 13.–17.10.<span class=\"big\">" + d + " päivää</span>";
      } else if (d === 1) {
        el.innerHTML = "Lontoo 13.–17.10.<span class=\"big\">huomenna!</span>";
      } else if (d === 0 || (now.iso >= LONTOO_START && now.iso <= LONTOO_END)) {
        el.innerHTML = "Lontoo<span class=\"big\">nyt menossa</span>";
      } else {
        el.innerHTML = "Lontoo<span class=\"big\">kiitos matkasta</span>";
      }
    }
    if (!listEl) return;
    var items = [];
    var anns = (schedule && schedule.anniversaries) || FALLBACK.anniversaries;
    for (var i = 0; i < anns.length; i++) {
      var a = anns[i];
      var iso = nextAnniversaryIso(a, now);
      if (!iso) continue;
      var du = daysUntil(iso, now);
      if (du < 0 || du > 45) continue;
      var label = a.label || "";
      if (!label) {
        if (a.kind === "birthday") label = (a.who || "") + " · syntymäpäivä";
        else if (a.kind === "wedding") label = "Hääpäivä";
        else if (a.kind === "party") label = (a.who || "") + " · juhlat";
        else label = a.who || "Merkkipäivä";
      } else if (a.who && a.who !== "perhe" && label.indexOf(a.who) < 0) {
        label = a.who + " · " + label;
      }
      var ip = isoParts(iso);
      items.push({ label: label, days: du, when: ip.d + "." + ip.m + "." });
    }
    /* also highlight known near dates from events juhla */
    items.sort(function (a, b) { return a.days - b.days; });
    var html = "";
    var max = Math.min(items.length, 4);
    for (var j = 0; j < max; j++) {
      var it = items[j];
      var rem = it.days === 0 ? "tänään" : (it.days === 1 ? "huomenna" : it.days + " pv");
      html += "<div class=\"odote\"><span>" + esc(it.label)
        + " <span class=\"muted\">" + esc(it.when) + "</span></span>"
        + "<span class=\"d accent\">" + esc(rem) + "</span></div>";
    }
    listEl.innerHTML = html || "<div class=\"empty muted\">Hiljaista odotuksissa</div>";
  }

  function paintMeals(now) {
    var el = document.getElementById("mealBox");
    if (!el) return;
    var map = (schedule && schedule.homeMeals) || {};
    var html = "";
    var shown = 0;
    for (var n = 0; n < 5 && shown < 4; n++) {
      var iso = addDaysIso(now.iso, n);
      var dish = map[iso];
      if (!dish && n > 0) continue;
      var wd = (now.wd + n) % 7;
      var dayLbl = n === 0 ? "Tänään" : DAYS[wd].short;
      html += "<div class=\"meal-line\"><span class=\"d accent\">" + esc(dayLbl) + "</span>"
        + "<span class=\"t\">" + esc(dish || "Ei merkintää") + "</span></div>";
      shown++;
      if (!dish && n === 0) { /* still show today empty then continue */ }
    }
    el.innerHTML = html || "<div class=\"empty muted\">Ei merkintää</div>";
  }

  function paintCal(now) {
    var el = document.getElementById("calNext");
    if (!el) return;
    var bits = [];
    for (var n = 0; n <= 10; n++) {
      var iso = addDaysIso(now.iso, n);
      var wd = (now.wd + n) % 7;
      var list = eventsOn(iso);
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (e.kind === "matka") continue;
        if (n === 0) {
          var end = parseMin(e.end);
          var start = parseMin(e.time);
          var doneAt = end != null ? end : (start != null ? start + 60 : null);
          if (doneAt != null && doneAt <= now.minutes) continue;
        }
        var who = e.who && e.who !== "perhe" ? e.who + " · " : "";
        var ip = isoParts(iso);
        var dayBit = n === 0 ? "Tänään" : (DAYS[wd].short + " " + ip.d + "." + ip.m + ".");
        bits.push("<div class=\"cal-line\"><span class=\"accent\">" + esc(dayBit) + "</span> "
          + esc((fmtHm(e.time) ? fmtHm(e.time) + " " : "") + who + (e.title || "")) + "</div>");
        if (bits.length >= 8) break;
      }
      if (bits.length >= 8) break;
    }
    el.innerHTML = bits.length ? bits.join("") : "<div class=\"empty muted\">Hiljaista lähiviikolla</div>";
  }

  function paintWx() {
    var el = document.getElementById("wx");
    if (!el) return;
    if (!weather.temp) {
      el.innerHTML = "<div class=\"wxbody\"><div class=\"wxtemp muted\">Kuopio</div></div>";
      return;
    }
    el.innerHTML = "<div class=\"wxicon\">" + weather.icon + "</div><div class=\"wxbody\"><div class=\"wxtemp\">"
      + esc(weather.temp) + "</div><div class=\"wxmeta muted\">" + esc(weather.phrase) + "</div></div>";
  }

  function paintWeekWx(now) {
    var el = document.getElementById("weekWx");
    if (!el) return;
    if (!weekWx.length) {
      el.innerHTML = "<div class=\"empty muted\">Sää latautuu…</div>";
      return;
    }
    var html = "";
    for (var i = 0; i < weekWx.length && i < 7; i++) {
      var d = weekWx[i];
      var cls = d.iso === now.iso ? "wxday is-today" : "wxday";
      html += "<div class=\"" + cls + "\"><div class=\"dn\">" + esc(d.dn) + "</div>"
        + "<div class=\"ic\">" + d.icon + "</div>"
        + "<div class=\"tm\">" + esc(d.tmin + "–" + d.tmax + "°") + "</div></div>";
    }
    el.innerHTML = html;
  }

  function paintPhoto() {
    var img = document.getElementById("photo");
    var cap = document.getElementById("photoCap");
    if (!img || !photos.length) return;
    var p = photos[photoIdx % photos.length];
    img.src = p.src;
    var place = p.place || "Muisto";
    var year = p.year || "";
    var line = year ? (place + " · " + year) : place;
    if (cap) cap.innerHTML = "<div class=\"wh\">Muistatko…</div>" + esc(line);
  }

  function paintChips() {
    var el = document.getElementById("chips");
    if (!el) return;
    var html = "";
    for (var i = 0; i < FAMILY.length; i++) {
      var f = FAMILY[i];
      html += "<span class=\"chip\" style=\"background:" + f.color + "\">" + esc(f.name) + "</span>";
    }
    el.innerHTML = html;
  }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
    var dateEl = document.getElementById("dateLine");
    if (dateEl) dateEl.textContent = DAYS[now.wd].full + " " + now.day + "." + now.month + ".";
    paintSchool(now);
    paintEvents(now);
    paintOdotukset(now);
    paintMeals(now);
    paintCal(now);
    paintWx();
    paintWeekWx(now);
  }

  function tickClock() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
  }

  function loadSchedule() {
    getJSON("schedule.json?v=20260920v31", function (data) {
      if (data) schedule = data;
      paint();
    });
  }

  function loadPhotos() {
    getJSON("photos-from-matkat.json?v=20260920v31", function (data) {
      if (data && data.length) {
        var out = [];
        for (var i = 0; i < data.length; i++) {
          var m = data[i];
          if (m && m.src && String(m.src).indexOf("matka-") >= 0) {
            out.push({ src: m.src, place: m.place || "Muisto", year: m.year || "" });
          }
        }
        if (out.length >= 8) photos = out;
      }
      paintPhoto();
    });
  }

  function loadWeather() {
    getJSON(
      "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FHelsinki&forecast_days=7",
      function (data) {
        if (!data || !data.daily) return;
        try {
          var tmin = Math.round(data.daily.temperature_2m_min[0]);
          var tmax = Math.round(data.daily.temperature_2m_max[0]);
          var w = wmo(data.daily.weathercode[0]);
          weather = { icon: w.icon, temp: tmin + "–" + tmax + "°", phrase: w.phrase };
          var arr = [];
          var times = data.daily.time || [];
          for (var i = 0; i < times.length && i < 7; i++) {
            var iso = times[i];
            var p = isoParts(iso);
            var dt = new Date(Date.UTC(p.y, p.m - 1, p.d));
            var wd = dt.getUTCDay();
            var ww = wmo(data.daily.weathercode[i]);
            arr.push({
              iso: iso,
              dn: DAYS[wd].short,
              icon: ww.icon,
              tmin: Math.round(data.daily.temperature_2m_min[i]),
              tmax: Math.round(data.daily.temperature_2m_max[i])
            });
          }
          weekWx = arr;
          paintWx();
          paintWeekWx(helsinkiNow());
        } catch (e) {}
      }
    );
  }

  paintChips();
  paint();
  paintPhoto();
  loadSchedule();
  loadPhotos();
  loadWeather();
  setInterval(tickClock, 1000);
  setInterval(function () { paint(); }, 30000);
  setInterval(function () { loadSchedule(); }, 60000);
  setInterval(function () {
    if (!photos.length) return;
    photoIdx = (photoIdx + 1) % photos.length;
    paintPhoto();
  }, 16000);
  setInterval(loadWeather, 30 * 60 * 1000);
})();
  </script>
</body>
