<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="fiilis-build" content="20260920-v30-tv1">
  <meta name="theme-color" content="#f6f0e4">
  <title>Räisä · Fiilis TV</title>
  <style>
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      background: #f6f0e4; color: #2c2418;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    .tv {
      height: 100vh; width: 100vw;
      padding: 2vh 2.2vw 1.6vh;
      display: -ms-flexbox; display: flex;
      -ms-flex-direction: column; flex-direction: column;
    }
    body.evening { background: #e8d5c0; color: #2a2018; }
    body.evening .card { background: rgba(255,255,255,0.38); border-color: rgba(42,32,24,0.12); }
    body.evening .accent { color: #a86a3a; }
    body.evening .muted { color: rgba(42,32,24,0.55); }
    body.evening .photo-wrap { border-color: rgba(42,32,24,0.14); box-shadow: 0 1.2vh 3vh rgba(80,40,20,0.12); }
    body.night { background: #1c1814; color: #f0e4d4; }
    body.night .card { background: rgba(255,248,238,0.06); border-color: rgba(240,228,212,0.12); }
    body.night .accent { color: #d4a06a; }
    body.night .muted { color: rgba(240,228,212,0.55); }
    body.night .line { border-color: rgba(240,228,212,0.12); }
    body.night .photo-wrap { border-color: rgba(240,228,212,0.14); box-shadow: 0 1.2vh 3vh rgba(0,0,0,0.35); }
    body.night .foot { color: rgba(240,228,212,0.45); }

    .head {
      display: -ms-flexbox; display: flex;
      -ms-flex-pack: justify; justify-content: space-between;
      -ms-flex-align: center; align-items: center;
      margin-bottom: 1.6vh; -ms-flex: 0 0 auto; flex: 0 0 auto;
      gap: 2vw;
    }
    .clock {
      font-size: 9.5vmin; font-weight: 700; letter-spacing: -.06em;
      line-height: .85; font-variant-numeric: tabular-nums; min-width: 22vmin;
    }
    .greet-block { -ms-flex: 1; flex: 1; min-width: 0; text-align: center; }
    .greet { font-size: 3.8vmin; font-weight: 650; letter-spacing: -.01em; }
    .date { font-size: 2.4vmin; margin-top: .4vh; font-weight: 600; }
    .accent { color: #b8883e; }
    .muted { color: rgba(44,36,24,0.55); }
    .wx {
      text-align: right; min-width: 22vmin;
      display: -ms-flexbox; display: flex;
      -ms-flex-align: center; align-items: center;
      -ms-flex-pack: end; justify-content: flex-end;
      gap: 1vw;
    }
    .wxicon { font-size: 5.5vmin; line-height: 1; }
    .wxtemp { font-size: 3.6vmin; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
    .wxmeta { font-size: 1.9vmin; font-weight: 600; margin-top: .25vh; }

    .main {
      -ms-flex: 1; flex: 1; min-height: 0;
      display: -ms-flexbox; display: flex;
      gap: 1.4vw;
    }
    .col {
      min-width: 0; min-height: 0;
      display: -ms-flexbox; display: flex;
      -ms-flex-direction: column; flex-direction: column;
    }
    .col-left { -ms-flex: 1.15; flex: 1.15; }
    .col-center { -ms-flex: 1.35; flex: 1.35; }
    .col-right { -ms-flex: 1.1; flex: 1.1; }

    .card {
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(44,36,24,0.1);
      border-radius: 1.4vmin;
      padding: 1.6vh 1.4vw 1.5vh;
      display: -ms-flexbox; display: flex;
      -ms-flex-direction: column; flex-direction: column;
      min-height: 0; -ms-flex: 1; flex: 1;
      overflow: hidden;
    }
    .card + .card { margin-top: 1.2vh; -ms-flex: 0.85; flex: 0.85; }
    .lbl {
      font-size: 1.7vmin; font-weight: 800; letter-spacing: .26em;
      text-transform: uppercase; margin-bottom: 1vh; -ms-flex: 0 0 auto; flex: 0 0 auto;
    }
    .scroll { -ms-flex: 1; flex: 1; min-height: 0; overflow: hidden; }

    .row {
      display: -ms-flexbox; display: flex;
      -ms-flex-pack: justify; justify-content: space-between;
      -ms-flex-align: baseline; align-items: baseline;
      padding: 1.1vh 0; border-bottom: 1px solid rgba(44,36,24,0.08);
    }
    .row:last-child { border-bottom: 0; }
    body.night .row { border-bottom-color: rgba(240,228,212,0.1); }
    .who { font-size: 2.7vmin; font-weight: 700; }
    .hrs { font-size: 2.6vmin; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 1vw; }
    .meta { font-size: 2vmin; font-weight: 600; margin-top: .2vh; }
    .drv { font-size: 2.05vmin; font-weight: 750; margin-top: .25vh; }
    .empty { font-size: 2.3vmin; font-weight: 600; padding: .6vh 0; }

    .photo-wrap {
      -ms-flex: 1; flex: 1; min-height: 0;
      border-radius: 1.6vmin; overflow: hidden;
      border: 1px solid rgba(44,36,24,0.1);
      box-shadow: 0 1.2vh 3vh rgba(80,50,20,0.1);
      background: rgba(44,36,24,0.06);
      position: relative;
    }
    .photo-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .photo-cap {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 1.2vh 1.2vw;
      font-size: 1.8vmin; font-weight: 650;
      background: linear-gradient(transparent, rgba(28,24,20,0.55));
      color: #f6f0e4;
    }

    .countdown {
      font-size: 3.4vmin; font-weight: 750; letter-spacing: -.02em; line-height: 1.15;
    }
    .countdown .big { font-size: 5.2vmin; display: block; margin-top: .3vh; }
    .cal-line { font-size: 2.15vmin; font-weight: 650; padding: .7vh 0; line-height: 1.25; }
    .meal {
      margin-top: auto; padding-top: 1.2vh;
      border-top: 1px solid rgba(44,36,24,0.1);
      font-size: 2.5vmin; font-weight: 700; line-height: 1.25;
    }
    body.night .meal { border-top-color: rgba(240,228,212,0.12); }
    .meal .h { font-size: 1.5vmin; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; margin-bottom: .35vh; }

    .foot {
      -ms-flex: 0 0 auto; flex: 0 0 auto;
      margin-top: 1.3vh;
      display: -ms-flexbox; display: flex;
      -ms-flex-pack: justify; justify-content: space-between;
      -ms-flex-align: center; align-items: center;
      font-size: 1.9vmin; font-weight: 650;
      color: rgba(44,36,24,0.45);
    }
    .foot .brand { letter-spacing: .18em; text-transform: uppercase; font-weight: 800; font-size: 1.7vmin; }
  </style>
</head>
<body>
  <div class="tv" id="app">
    <div class="head">
      <div class="clock" id="clock">––.––</div>
      <div class="greet-block">
        <div class="greet accent" id="greet">Hyvää iltaa</div>
        <div class="date muted" id="dateLine">Räisän perhe</div>
      </div>
      <div class="wx" id="wx"><div class="wxbody"><div class="wxtemp muted">Kuopio</div></div></div>
    </div>
    <div class="main">
      <div class="col col-left">
        <div class="card">
          <div class="lbl accent">Tänään</div>
          <div class="scroll" id="todaySchool"><div class="empty muted">Koulu latautuu…</div></div>
        </div>
        <div class="card">
          <div class="lbl accent">Vielä tänään</div>
          <div class="scroll" id="todayEvents"><div class="empty muted">Treenit latautuvat…</div></div>
        </div>
      </div>
      <div class="col col-center">
        <div class="photo-wrap">
          <img id="photo" src="photos-web/london-01.jpg" alt="">
          <div class="photo-cap" id="photoCap">Muisto</div>
        </div>
      </div>
      <div class="col col-right">
        <div class="card">
          <div class="lbl accent">Odotukset</div>
          <div class="countdown accent" id="countdown">Lontoo<br><span class="big">13.–17.10.</span></div>
          <div class="scroll" id="calNext" style="margin-top:1.2vh"></div>
          <div class="meal" id="mealBox">
            <div class="h accent">Kotona</div>
            <div class="muted" id="mealTxt">—</div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">
      <span id="footLine">Lämpöä kotiin</span>
      <span class="brand">Räisä · Fiilis</span>
    </div>
  </div>
  <script>
(function () {
  var DAYS = [
    { key: "su", full: "Sunnuntai" }, { key: "ma", full: "Maanantai" }, { key: "ti", full: "Tiistai" },
    { key: "ke", full: "Keskiviikko" }, { key: "to", full: "Torstai" }, { key: "pe", full: "Perjantai" }, { key: "la", full: "Lauantai" }
  ];
  var KID_ORDER = ["Ellen", "Samuel", "Milla", "Mea"];
  var KID_COLOR = { Ellen: "#c4785a", Samuel: "#5a8fb0", Milla: "#5f9a72", Mea: "#8a6aaa" };
  var PHOTOS = [
    { src: "photos-web/london-01.jpg", cap: "Lontoo" },
    { src: "photos-web/london-02.jpg", cap: "Lontoo" },
    { src: "photos-web/alicante-01.jpg", cap: "Alicante" },
    { src: "photos-web/alicante-03.jpg", cap: "Alicante" },
    { src: "photos-web/matka-2018-lontoo-cover-001.jpg", cap: "Lontoo 2018" },
    { src: "photos-web/matka-2018-tanska-cover-008.jpg", cap: "Tanska" },
    { src: "photos-web/matka-2019-italia-00-016.jpg", cap: "Italia" },
    { src: "photos-web/matka-2018-2026-kalastus-cover-078.jpg", cap: "Kalassa" }
  ];
  var LONTOO_START = "2026-10-13";
  var LONTOO_END = "2026-10-17";
  var schedule = null;
  var weather = { icon: "", temp: "", phrase: "" };
  var photoIdx = 0;
  var booted = false;
  var FOOT_LINES = [
    "Lämpöä kotiin",
    "Me ollaan tässä yhdessä",
    "Hyvä fiilis riittää",
    "Kotona on kivaa"
  ];

  function pad(n) { n = parseInt(n, 10); return n < 10 ? "0" + n : "" + n; }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function helsinkiNow() {
    var d = new Date();
    var parts = {};
    try {
      var fmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        weekday: "short", hour12: false
      });
      var arr = fmt.formatToParts(d);
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].type !== "literal") parts[arr[i].type] = arr[i].value;
      }
    } catch (e) {
      var hki = new Date(d.getTime() + 3 * 60 * 60 * 1000);
      parts.year = String(hki.getUTCFullYear());
      parts.month = pad(hki.getUTCMonth() + 1);
      parts.day = pad(hki.getUTCDate());
      parts.hour = pad(hki.getUTCHours());
      parts.minute = pad(hki.getUTCMinutes());
      parts.weekday = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][hki.getUTCDay()];
    }
    var wdMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    var wd = wdMap[parts.weekday];
    if (wd == null) wd = new Date().getDay();
    var hour = parseInt(parts.hour, 10);
    if (parts.hour === "24") hour = 0;
    var minute = parseInt(parts.minute, 10) || 0;
    var year = parseInt(parts.year, 10);
    var month = parseInt(parts.month, 10);
    var day = parseInt(parts.day, 10);
    return {
      year: year, month: month, day: day, hour: hour, minute: minute, wd: wd,
      key: DAYS[wd].key, iso: year + "-" + pad(month) + "-" + pad(day),
      minutes: hour * 60 + minute
    };
  }

  function greeting(hour) {
    if (hour >= 5 && hour < 10) return "Hyvää huomenta";
    if (hour >= 10 && hour < 17) return "Hyvää päivää";
    if (hour >= 17 && hour < 22) return "Hyvää iltaa";
    return "Hyvää yötä";
  }

  function applyTheme(hour) {
    var b = document.body;
    b.className = "";
    if (hour >= 22 || hour < 5) b.className = "night";
    else if (hour >= 17) b.className = "evening";
  }

  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function fmtRange(a, b) {
    if (!a && !b) return "";
    if (a && b) return fmtHm(a) + "–" + fmtHm(b);
    return a ? fmtHm(a) : "";
  }

  function daysUntil(iso, now) {
    var a = Date.UTC(now.year, now.month - 1, now.day);
    var p = String(iso).split("-");
    var b = Date.UTC(+p[0], +p[1] - 1, +p[2]);
    return Math.round((b - a) / 86400000);
  }

  function addDaysIso(iso, n) {
    var p = String(iso).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }

  function wmo(code) {
    if (code === 0) return { icon: "☀️", phrase: "selkeää" };
    if (code <= 2) return { icon: "🌤️", phrase: "melkein selkeää" };
    if (code === 3) return { icon: "☁️", phrase: "pilvistä" };
    if (code === 45 || code === 48) return { icon: "🌫️", phrase: "sumua" };
    if (code >= 51 && code <= 57) return { icon: "🌦️", phrase: "tihkua" };
    if (code >= 61 && code <= 67) return { icon: "🌧️", phrase: "sadetta" };
    if (code >= 71 && code <= 77) return { icon: "❄️", phrase: "lunta" };
    if (code >= 80 && code <= 82) return { icon: "🌦️", phrase: "kuuroja" };
    if (code >= 85 && code <= 86) return { icon: "🌨️", phrase: "lumikuuroja" };
    if (code >= 95) return { icon: "⛈️", phrase: "ukkosta" };
    return { icon: "🌡️", phrase: "vaihtelevaa" };
  }

  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else {
            cb(null);
          }
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }

  function schoolForDay(now) {
    var out = [];
    if (!schedule || !schedule.schoolStarts) return out;
    var list = schedule.schoolStarts;
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      var wds = s.weekdays || [];
      var ok = false;
      for (var j = 0; j < wds.length; j++) if (wds[j] === now.wd) ok = true;
      if (ok) out.push(s);
    }
    out.sort(function (a, b) {
      var ia = KID_ORDER.indexOf(a.who); if (ia < 0) ia = 99;
      var ib = KID_ORDER.indexOf(b.who); if (ib < 0) ib = 99;
      if (ia !== ib) return ia - ib;
      return (parseMin(a.time) || 0) - (parseMin(b.time) || 0);
    });
    return out;
  }

  function eventsOn(iso) {
    var out = [];
    if (!schedule || !schedule.events) return out;
    var list = schedule.events;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.date === iso) out.push(e);
    }
    out.sort(function (a, b) {
      return (parseMin(a.time) || 0) - (parseMin(b.time) || 0);
    });
    return out;
  }

  function remainingEvents(now) {
    var list = eventsOn(now.iso);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.kind === "matka") continue;
      var end = parseMin(e.end);
      var start = parseMin(e.time);
      var doneAt = end != null ? end : (start != null ? start + 60 : null);
      if (doneAt != null && doneAt <= now.minutes) continue;
      out.push(e);
    }
    return out;
  }

  function driverOf(e) {
    if (!e) return "";
    if (e.driver) return e.driver;
    if (e.pickup) return e.pickup;
    return "";
  }

  function paintSchool(now) {
    var el = document.getElementById("todaySchool");
    if (!el) return;
    var list = schoolForDay(now);
    if (!list.length) {
      el.innerHTML = "<div class=\"empty muted\">Ei koulua tänään</div>";
      return;
    }
    var html = "";
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      var col = KID_COLOR[s.who] || "#b8883e";
      html += "<div class=\"row\" style=\"border-left:0.4vw solid " + col + ";padding-left:0.8vw\">"
        + "<div><div class=\"who\">" + esc(s.who) + "</div>"
        + "<div class=\"meta muted\">" + esc(s.label || "Koulu") + "</div></div>"
        + "<div class=\"hrs\">" + esc(fmtRange(s.time, s.end)) + "</div></div>";
    }
    el.innerHTML = html;
  }

  function paintEvents(now) {
    var el = document.getElementById("todayEvents");
    if (!el) return;
    var list = remainingEvents(now);
    if (!list.length) {
      el.innerHTML = "<div class=\"empty muted\">Rauhallinen ilta</div>";
      return;
    }
    var html = "";
    var max = Math.min(list.length, 6);
    for (var i = 0; i < max; i++) {
      var e = list[i];
      var who = e.who && e.who !== "perhe" ? e.who + " · " : "";
      var drv = driverOf(e);
      html += "<div class=\"row\" style=\"display:block\">"
        + "<div class=\"hrs accent\" style=\"margin:0\">" + esc(fmtRange(e.time, e.end) || "") + "</div>"
        + "<div class=\"who\">" + esc(who + (e.title || "")) + "</div>"
        + (e.place ? "<div class=\"meta muted\">" + esc(e.place) + "</div>" : "")
        + (drv ? "<div class=\"drv accent\">" + esc(drv) + "</div>" : "")
        + "</div>";
    }
    el.innerHTML = html;
  }

  function paintCountdown(now) {
    var el = document.getElementById("countdown");
    if (!el) return;
    var d = daysUntil(LONTOO_START, now);
    if (d > 1) {
      el.innerHTML = "Lontoo 13.–17.10.<span class=\"big\">" + d + " päivää</span>";
    } else if (d === 1) {
      el.innerHTML = "Lontoo 13.–17.10.<span class=\"big\">huomenna!</span>";
    } else if (d === 0 || (now.iso >= LONTOO_START && now.iso <= LONTOO_END)) {
      el.innerHTML = "Lontoo<span class=\"big\">nyt menossa</span>";
    } else {
      el.innerHTML = "Lontoo<span class=\"big\">kiitos matkasta</span>";
    }
  }

  function paintCal(now) {
    var el = document.getElementById("calNext");
    if (!el) return;
    var bits = [];
    for (var n = 1; n <= 4; n++) {
      var iso = addDaysIso(now.iso, n);
      var wd = (now.wd + n) % 7;
      var list = eventsOn(iso);
      var interesting = [];
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (e.kind === "matka") continue;
        interesting.push(e);
      }
      if (!interesting.length) continue;
      var e0 = interesting[0];
      var more = interesting.length > 1 ? " +" + (interesting.length - 1) : "";
      var who = e0.who && e0.who !== "perhe" ? e0.who + " · " : "";
      bits.push("<div class=\"cal-line\"><span class=\"accent\">" + esc(DAYS[wd].full.slice(0, 2)) + "</span> "
        + esc((fmtHm(e0.time) ? fmtHm(e0.time) + " " : "") + who + (e0.title || "")) + esc(more) + "</div>");
      if (bits.length >= 4) break;
    }
    el.innerHTML = bits.length ? bits.join("") : "<div class=\"empty muted\">Hiljaista lähiviikolla</div>";
  }

  function paintMeal(now) {
    var el = document.getElementById("mealTxt");
    if (!el) return;
    var dish = "";
    if (schedule && schedule.homeMeals && schedule.homeMeals[now.iso]) {
      dish = schedule.homeMeals[now.iso];
    }
    el.textContent = dish || "Ei merkintää";
    if (!dish) el.className = "muted";
    else el.className = "";
  }

  function paintWx() {
    var el = document.getElementById("wx");
    if (!el) return;
    if (!weather.temp) {
      el.innerHTML = "<div class=\"wxbody\"><div class=\"wxtemp muted\">Kuopio</div></div>";
      return;
    }
    el.innerHTML = "<div class=\"wxicon\">" + weather.icon + "</div><div class=\"wxbody\"><div class=\"wxtemp\">"
      + esc(weather.temp) + "</div><div class=\"wxmeta muted\">" + esc(weather.phrase) + "</div></div>";
  }

  function paintPhoto() {
    var img = document.getElementById("photo");
    var cap = document.getElementById("photoCap");
    if (!img || !PHOTOS.length) return;
    var p = PHOTOS[photoIdx % PHOTOS.length];
    img.src = p.src;
    if (cap) cap.textContent = p.cap || "Muisto";
  }

  function clearLoadingHints() {
    /* first successful tick: loading copy already replaced by paint* */
  }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
    var dateEl = document.getElementById("dateLine");
    if (dateEl) dateEl.textContent = DAYS[now.wd].full + " " + now.day + "." + now.month + ".";
    var foot = document.getElementById("footLine");
    if (foot) foot.textContent = FOOT_LINES[now.day % FOOT_LINES.length];
    paintSchool(now);
    paintEvents(now);
    paintCountdown(now);
    paintCal(now);
    paintMeal(now);
    paintWx();
    if (!booted) {
      booted = true;
      clearLoadingHints();
    }
  }

  function tickClock() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
  }

  function loadSchedule() {
    getJSON("schedule.json?v=20260920v30", function (data) {
      if (data) schedule = data;
      paint();
    });
  }

  function loadWeather() {
    getJSON(
      "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FHelsinki&forecast_days=1",
      function (data) {
        if (!data || !data.daily) return;
        try {
          var tmin = Math.round(data.daily.temperature_2m_min[0]);
          var tmax = Math.round(data.daily.temperature_2m_max[0]);
          var w = wmo(data.daily.weathercode[0]);
          weather = { icon: w.icon, temp: tmin + "–" + tmax + "°", phrase: w.phrase };
          paintWx();
        } catch (e) {}
      }
    );
  }

  paint();
  paintPhoto();
  loadSchedule();
  loadWeather();
  setInterval(tickClock, 1000);
  setInterval(function () { paint(); }, 30000);
  setInterval(function () { loadSchedule(); }, 60000);
  setInterval(function () {
    photoIdx = (photoIdx + 1) % PHOTOS.length;
    paintPhoto();
  }, 16000);
  setInterval(loadWeather, 30 * 60 * 1000);
})();
  </script>
</body>
</html>
