  function helsinkiNow() {
    var d = new Date();
    var parts = {};
    try {
      var fmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        weekday: "short", hour12: false
      });
      var arr = fmt.formatToParts(d);
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].type !== "literal") parts[arr[i].type] = arr[i].value;
      }
    } catch (e) {
      var hki = new Date(d.getTime() + 3 * 60 * 60 * 1000);
      parts.year = String(hki.getUTCFullYear());
      parts.month = pad(hki.getUTCMonth() + 1);
      parts.day = pad(hki.getUTCDate());
      parts.hour = pad(hki.getUTCHours());
      parts.minute = pad(hki.getUTCMinutes());
      parts.weekday = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][hki.getUTCDay()];
    }
    var wdMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    var wd = wdMap[parts.weekday];
    if (wd == null) wd = new Date().getDay();
    var hour = parseInt(parts.hour, 10);
    if (parts.hhour === "24") hour = 0;
    var minute = parseInt(parts.minute, 10) || 0;
    var year = parseInt(parts.year, 10);
    var month = parseInt(parts.month, 10);
    var day = parseInt(parts.day, 10);
    return {
      year: year, month: month, day: day, hour: hour, minute: minute, wd: wd,
      key: DAYS[wd].key, iso: year + "-" + pad(month) + "-" + pad(day),
      minutes: hour * 60 + minute
    };
  }

  function greeting(hour) {

  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function fmtRange(a, b) {
    if (!a && !b) return "";
    if (a && b) return fmtHm(a) + "–" + fmtHm(b);
    return a ? fmtHm(a) : "";
  }

  function daysUntil(iso, now) {
    var a = Date.UTC(now.year, now.month - 1, now.day);
    var p = String(iso).split("-");
    var b = Date.UTC(+p[0], +p[1] - 1, +p[2]);
    return Math.round((b - a) / 86400000);
  }

  function addDaysIso(iso, n) {
    var p = String(iso).split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }

  function isoParts(iso) {

  function wmo(code) {
    if (code === 0) return { icon: "☀️", phrase: "selkeää" };
    if (code <= 2) return { icon: "🌤️", phrase: "melkein selkeää" };
    if (code === 3) return { icon: "☁️", phrase: "pilvistä" };
    if (code === 45 || code === 48) return { icon: "🌫️", phrase: "sumua" };
    if (code >= 51 && code <= 57) return { icon: "🌦️", phrase: "tihkua" };
    if (code >= 61 && code <= 67) return { icon: "🌧️", phrase: "sadetta" };
    if (code >= 71 && code <= 77) return { icon: "❄️", phrase: "lunta" };
    if (code >= 80 && code <= 82) return { icon: "🌦️", phrase: "kuuroja" };
    if (code >= 85 && code <= 86) return { icon: "🌨️", phrase: "lumikuuroja" };
    if (code >= 95) return { icon: "⛈️", phrase: "ukkosta" };
    return { icon: "🌡️", phrase: "vaihtelevaa" };
  }

  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else {
            cb(null);
          }
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }

  function isAbsentDriver(name, iso) {
    if (!name || !schedule || !schedule.absences) return false;
    var abs = schedule.absences;
    for (var i = 0; i < abs.length; i++) {
      var a = abs[i];
      if (a.who === name && iso >= a.from && iso <= a.to) return true;

  function driverOf(e, iso) {
    if (!e) return "";
    var d = e.driver || "";
    var p = e.pickup || "";
    if (d && isAbsentDriver(d, iso)) d = "";
    if (p && isAbsentDriver(p, iso)) p = "";
    if (d && p && d === p) return d;
    if (d && p) return d + " / " + p;
    return d || p || "";
  }

  function schoolTarget(now) {
    /* Illalla (klo 17+) näytä seuraava koulupäivä: koulu + treenit + kouluruoka. */
    var wd = now.wd;
    var hour = now.hour;
    var evening = hour >= 17;
    var tomorrow = false;
    var dayIdx = wd;
    var lunchIso = now.iso;
    var focusIso = now.iso;
    var label = "Koulu";
    if (wd === 0) {
      dayIdx = 1; tomorrow = true;
      lunchIso = focusIso = addDaysIso(now.iso, 1);
      label = "Koulu · maanantai";
    } else if (wd === 6) {
      dayIdx = 1; tomorrow = true;
      lunchIso = focusIso = addDaysIso(now.iso, 2);
      label = "Koulu · maanantai";
    } else if (evening && wd === 5) {
      dayIdx = 1; tomorrow = true;
      lunchIso = focusIso = addDaysIso(now.iso, 3);
      label = "Koulu · maanantai";
    } else if (evening && wd >= 1 && wd <= 4) {
      dayIdx = wd + 1; tomorrow = true;
      lunchIso = focusIso = addDaysIso(now.iso, 1);
      label = "Koulu · huomenna";
    }
    return { wd: dayIdx, tomorrow: tomorrow, lunchIso: lunchIso, focusIso: focusIso, label: label };
  }

  function schoolForTarget(tgt) {
    var out = [];
    if (!schedule || !schedule.schoolStarts) return out;
    var list = schedule.schoolStarts;
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      var wds = s.weekdays || [];
      var ok = false;
      for (var j = 0; j < wds.length; j++) if (wds[j] === tgt.wd) ok = true;
      if (ok) out.push(s);
    }
    out.sort(function (a, b) {
      var ia = KID_ORDER.indexOf(a.who); if (ia < 0) ia = 99;
      var ib = KID_ORDER.indexOf(b.who); if (ib < 0) ib = 99;
      if (ia !== ib) return ia - ib;
      return (parseMin(a.time) || 0) - (parseMin(b.time) || 0);

    return out;
  }

  function eventsOn(iso) {
    var out = [];
    if (!schedule || !schedule.events) return out;
    var list = schedule.events;
    for (var i = 0; i < list.length; i++) {
      if (list[i].date === iso) out.push(list[i]);
    }
    out.sort(function (a, b) {
      return (parseMin(a.time) || 0) - (parseMin(b.time) || 0);
    });

  function remainingEvents(now) {
    var list = eventsOn(now.iso);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.kind === "matka") continue;
      var end = parseMin(e.end);
      var start = parseMin(e.time);
      var doneAt = end != null ? end : (start != null ? start + 60 : null);
      if (doneAt != null && doneAt <= now.minutes) continue;
      out.push(e);
    }
    return out;
  }

  function eventsForKid(now, kid, focusIso) {
    /* Näytä treenit sekä tältä päivältä (jäljellä) että focus-päivältä (illalla huomenna). */
    var isoFocus = focusIso || now.iso;
    var seen = {};
    var out = [];
    function addList(list, iso) {
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (e.kind === "matka") continue;
        if ((e.who || "") !== kid) continue;
        var key = (e.date || iso) + "|" + (e.time || "") + "|" + (e.title || "");
        if (seen[key]) continue;
        seen[key] = 1;
        out.push(e);
      }
    }
    if (isoFocus === now.iso) {
      addList(remainingEvents(now), now.iso);
    } else {
      addList(remainingEvents(now), now.iso);
      addList(eventsOn(isoFocus), isoFocus);
    }
    out.sort(function (a, b) {
      var da = a.date || ""; var db = b.date || "";
      if (da !== db) return da < db ? -1 : 1;
      return (parseMin(a.time) || 0) - (parseMin(b.time) || 0);
    });
    return out;
  }

  function nextAnniversaryIso(ann, now) {
    var mmdd = ann.mmdd;
    if (!mmdd && ann.date) {
      var p = String(ann.date).split("-");
      mmdd = p[1] + "-" + p[2];
    }
    if (!mmdd) return null;
    var cand = now.year + "-" + mmdd;

  function paintOdotukset(now) {
    var el = document.getElementById("countdown");
    var listEl = document.getElementById("odoteList");
    if (el) {
      var d = daysUntil(LONTOO_START, now);
      var label = "Lontoo · 13.–17.10.";
      var big = "";
      if (d > 1) {
        big = d + " PÄIVÄÄ";
      } else if (d === 1) {
        big = "HUOMENNA";
      } else if (d === 0 || (now.iso >= LONTOO_START && now.iso <= LONTOO_END)) {
        label = "Lontoo";

        + "<div class=\"cd-big\">" + esc(big) + "</div>";

    if (!listEl) return;
    var items = [];
    var seen = {};
    var exps = (schedule && schedule.expectations) || [];
    for (var xi = 0; xi < exps.length; xi++) {
      var x = exps[xi];
      if (!x || !x.start) continue;
      if (now.iso > (x.end || x.start)) continue;
      var duX = daysUntil(x.start, now);
      if (now.iso >= x.start && x.end && now.iso <= x.end) duX = 0;
      if (duX < 0 || duX > 50) continue;
      if (/lontoo/i.test(String(x.label || ""))) continue;
      var keyX = String(x.label || "").toLowerCase() + "|" + x.start;
      if (seen[keyX]) continue;
      seen[keyX] = 1;
      var whenX = (x.end && x.end !== x.start)
        ? (parseInt(x.start.slice(8), 10) + ".–" + parseInt(x.end.slice(8), 10) + "." + parseInt(x.end.slice(5, 7), 10) + ".")
        : (parseInt(x.start.slice(8), 10) + "." + parseInt(x.start.slice(5, 7), 10) + ".");
      items.push({ label: x.label, days: duX, when: whenX });

    var anns = (schedule && schedule.anniversaries) || FALLBACK.anniversaries;

    var el = document.getElementById("mealBox");
    if (!el) return;
    var map = (schedule && schedule.homeMeals) || {};
    var html = "";
    var shown = 0;
    for (var n = 0; n < 5 && shown < 3; n++) {
      var iso = addDaysIso(now.iso, n);
      var dish = map[iso];
      if (!dish && n > 0) continue;
      var wd = (now.wd + n) % 7;
      var dayLbl = n === 0 ? "Tänään" : DAYS[wd].short;
      html += "<div class=\"meal-line\"><span class=\"d accent\">" + esc(dayLbl) + "</span>"
        + "<span class=\"t\">" + esc(dish || "Ei merkintää") + "</span></div>";
      shown++;
    }
    el.innerHTML = html || "<div class=\"empty muted\">Ei merkintää</div>";
  }

  function monthShortFi(m) {
    return ["tammi","helmi","maalis","huhti","touko","kesä","heinä","elo","syys","loka","marras","joulu"][m - 1] || "";
  }

  function shortWho(who) {
    var w = String(who || "");
    if (w === "Ellen") return "Ell";
    if (w === "Samuel") return "Sam";
    if (w === "Milla") return "Mil";
    if (w === "Mea") return "Mea";
    if (w === "Jussi") return "Jus";
    if (w === "Riikka") return "Rik";
    if (w === "perhe" || w === "Perhe") return "";
    return w.length > 3 ? w.slice(0, 3) : w;
  }
  function colorForWho(who) {
    if (!who) return "#c4a574";
    if (WHO_COLOR[who]) return WHO_COLOR[who];
    if (who === "perhe") return "#c4a574";
    return "#b8a090";
  }

  function dayBucketEvents(iso, now) {
    var out = [];
    var seen = {};
    function push(ev) {
      if (!ev) return;
      var key = eventDedupeKey(ev, iso);
      if (seen[key]) return;
      seen[key] = 1;
      out.push(ev);
    }
    var list = eventsOn(iso);
    for (var i = 0; i < list.length; i++) push(list[i]);
    var p = isoParts(iso);
    var dt = new Date(Date.UTC(p.y, p.m - 1, p.d));
    var wd = dt.getUTCDay();
    if (wd >= 1 && wd <= 5 && schedule && schedule.schoolStarts) {
      var ss = schedule.schoolStarts;
      var kids = {};
      for (var s = 0; s < ss.length; s++) {
        var row = ss[s];
        var wds = row.weekdays || [];
        var ok = false;
        for (var j = 0; j < wds.length; j++) if (wds[j] === wd) ok = true;
        if (ok && row.who && !kids[row.who]) {
          kids[row.who] = 1;
          push({ who: row.who, title: "Koulu", kind: "koulu", _soft: 1 });
        }
      }
    }
    var anns = (schedule && schedule.anniversaries) || [];
    var mmdd = pad(p.m) + "-" + pad(p.d);
    for (var a = 0; a < anns.length; a++) {
      var ann = anns[a];
      var raw = String(ann.date || ann.mmdd || "");
      var aMmdd = ann.mmdd && String(ann.mmdd).length === 5 ? String(ann.mmdd) : (raw.length >= 5 ? raw.slice(-5) : "");
      if (aMmdd !== mmdd) continue;
      var title = ann.label || "";
      if (!title) {
        if (ann.kind === "birthday") title = "Syntymäpäivä";
        else if (ann.kind === "wedding") title = "Hääpäivä";
        else title = "Merkkipäivä";
      }
      push({ who: ann.who || "perhe", title: title, kind: "juhla" });
    }
    if (iso >= LONTOO_START && iso <= LONTOO_END) {
      push({ who: "perhe", title: "Lontoo", kind: "matka" });
    }
    return out;
  }

  function paintMonthCal(now) {
    var grid = document.getElementById("monthCalGrid");
    var lbl = document.getElementById("monthCalLbl");
    if (!grid) return;
    try {
      var startIso = now.iso;
      var endIso = addDaysIso(now.iso, 30);
      var sp = isoParts(startIso);
      var ep = isoParts(endIso);
      if (lbl) {
        lbl.textContent = "Kalenteri · " + sp.d + "." + sp.m + ".–" + ep.d + "." + ep.m + ".";
      }
      var cells = [];
      var dows = ["ma","ti","ke","to","pe","la","su"];
      var sdt = new Date(Date.UTC(sp.y, sp.m - 1, sp.d));
      var swd = sdt.getUTCDay();
      var monIdx = swd === 0 ? 6 : swd - 1;
      for (var padI = 0; padI < monIdx; padI++) {
        cells.push("<div class=\"mday pad\"></div>");
      }
      for (var n = 0; n <= 30; n++) {
        var iso = addDaysIso(startIso, n);
        var ip = isoParts(iso);
        var evs = dayBucketEvents(iso, now);
        var cls = "mday";
        if (iso === now.iso) cls += " is-today";
        if (iso >= LONTOO_START && iso <= LONTOO_END) cls += " is-lontoo";
        var hasSchool = false;
        for (var k = 0; k < evs.length; k++) if (evs[k].kind === "koulu") hasSchool = true;
        if (hasSchool && iso !== now.iso) cls += " is-school";
        var num = String(ip.d);
        if (n === 0 || ip.d === 1) {
          num += "<span class=\"mo\">" + monthShortFi(ip.m) + "</span>";
        }
        var dots = "";
        var label = "";
        var shownWho = {};
        var realEvs = [];
        for (var e = 0; e < evs.length; e++) {
          if (evs[e].kind === "koulu") continue;
          realEvs.push(evs[e]);
        }
        for (var r = 0; r < realEvs.length && r < 5; r++) {
          var who = realEvs[r].who || "perhe";
          if (shownWho[who]) continue;
          shownWho[who] = 1;
          dots += "<span class=\"mdot\" style=\"background:" + colorForWho(who) + "\"></span>";
        }
        if (realEvs.length) {
          realEvs.sort(function (a, b) {
            function score(ev) {
              var k = ev.kind || "", t = (ev.title || "").toLowerCase();
              if (k === "kisa" || t.indexOf("turnaus") >= 0) return 0;
              if (k === "juhla" || k === "matka") return 1;
              if (k === "treeni") return 2;
              return 3;
            }
            return score(a) - score(b);
          });
          var parts = [];
          var used = {};
          for (var ri = 0; ri < realEvs.length && parts.length < 3; ri++) {
            var evx = realEvs[ri];
            var who = evx.who || "perhe";
            var rt = evx.title || "";
            if (!rt) rt = who;
            var sw = shortWho(who);
            var line = sw ? (sw + " · " + rt) : rt;
            /* Almost never truncate short titles like Pentutreffit */
            if (line.length > 40) line = line.slice(0, 39) + "…";
            var uk = line;
            if (used[uk]) continue;
            used[uk] = 1;
            parts.push({ t: line, who: who });
          }
          if (!parts.length && iso >= LONTOO_START && iso <= LONTOO_END) {
            parts.push({ t: "Lontoo", who: "perhe" });
          }
          for (var pi = 0; pi < parts.length; pi++) {
            label += "<div class=\"mlabel\"><span class=\"mdot\" style=\"background:"
              + colorForWho(parts[pi].who) + "\"></span>" + esc(parts[pi].t) + "</div>";
          }
        } else if (iso >= LONTOO_START && iso <= LONTOO_END) {
          label = "<div class=\"mlabel\">Lontoo</div>";
        }
        cells.push("<div class=\"" + cls + "\"><div class=\"dn\">" + num + "</div>"
          + label
          + "</div>");
      }
      while (cells.length % 7 !== 0) {
        cells.push("<div class=\"mday pad\"></div>");
      }
      var html = "<div class=\"month-row month-head\">";
      for (var d = 0; d < 7; d++) {
        html += "<div class=\"mdow\">" + dows[d] + "</div>";
      }
      html += "</div>";
      for (var i = 0; i < cells.length; i += 7) {
        html += "<div class=\"month-row\">";
        for (var j = 0; j < 7; j++) html += cells[i + j];
        html += "</div>";
      }
      grid.innerHTML = html;
    } catch (err) {
      grid.textContent = "Kalenteri ei ladannut";
    }
  }

  function paintWx() {
    var el = document.getElementById("wx");
    if (!el) return;
    if (!weather.temp) {
      el.innerHTML = "<div class=\"wxbody\"><div class=\"wxtemp muted\">Kuopio</div></div>";
      return;
    }
    var meta = weather.phrase || "";
    if (weather.feels != null && weather.feels !== "") meta += (meta ? " · " : "") + "tuntuu " + weather.feels + "°";
    if (weather.wind != null && weather.wind !== "") meta += (meta ? " · " : "") + "tuuli " + weather.wind + " m/s";
    el.innerHTML = "<div class=\"wxicon\">" + weather.icon + "</div><div class=\"wxbody\"><div class=\"wxtemp\">"
      + esc(weather.temp) + "</div><div class=\"wxmeta muted\">" + esc(meta) + "</div></div>";
  }

  function paintWeekWx(now) {
    var el = document.getElementById("weekWx");
    if (!el) return;
    if (!weekWx.length) {
      el.innerHTML = "<div class=\"empty muted\">Sää latautuu…</div>";
      return;
    }
    var html = "";
    for (var i = 0; i < weekWx.length && i < 7; i++) {
      var d = weekWx[i];
      var cls = d.iso === now.iso ? "wxday is-today" : "wxday";
      var extraBits = [];
      if (d.iso === now.iso && weather && weather.feels != null && weather.feels !== "") {
        extraBits.push("≈" + weather.feels + "°");
      }
      if (d.wind != null && d.wind !== "") extraBits.push(d.wind + "m/s");
      else if (d.iso === now.iso && weather && weather.wind != null && weather.wind !== "") {
        extraBits.push(weather.wind + "m/s");
      }
      var extra = extraBits.length
        ? "<div class=\"extra\">" + esc(extraBits.join(" · ")) + "</div>"
        : "";
      html += "<div class=\"" + cls + "\"><div class=\"dn\">" + esc(d.dn) + "</div>"
        + "<div class=\"ic\">" + d.icon + "</div>"
        + "<div class=\"tm\">" + esc(d.tmin + "–" + d.tmax + "°") + "</div>"
        + extra + "</div>";
    }
    el.innerHTML = html;
  }

  function paintPhoto() {
    var img = document.getElementById("photo");
    var cap = document.getElementById("photoCap");
    if (!img || !photos.length) return;
    var p = photos[photoIdx % photos.length];
    img.src = p.src;
    var place = p.place || "Muisto";
    var year = p.year || "";
    var line = year ? (place + " · " + year) : place;
    if (cap) cap.innerHTML = "<div class=\"wh\">Muistatko…</div>" + esc(line);
  }

  function paintChips() {
    var el = document.getElementById("chips");
    if (!el) return;
    var html = "";
    for (var i = 0; i < FAMILY.length; i++) {
      var f = FAMILY[i];
      html += "<span class=\"chip\" style=\"background:" + f.color + "\">" + esc(f.name) + "</span>";
    }
    el.innerHTML = html;
  }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
    var dateEl = document.getElementById("dateLine");
    if (dateEl) dateEl.textContent = DAYS[now.wd].full + " " + now.day + "." + now.month + ".";
    paintKidsDay(now);
    paintParents(now);
    paintOdotukset(now);
    paintTomorrow(now);
    paintMeals(now);
    paintMonthCal(now);
    paintWx();
    paintWeekWx(now);
  }

  function tickClock() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
  }

  function loadSchedule() {
    getJSON("schedule.json?v=20260923v97mea26", function (data) {
      if (data) schedule = data;
      paint();
    });
  }

  function loadPhotos() {
    getJSON("photos-from-matkat.json?v=20260923v97mea26", function (data) {
      if (data && data.length) {
        var out = [];
        for (var i = 0; i < data.length; i++) {
          var m = data[i];
          if (m && m.src && String(m.src).indexOf("matka-") >= 0) {
            out.push({ src: m.src, place: m.place || "Muisto", year: m.year || "" });
          }
        }
        out = filterPhotos(out);
        if (out.length >= 8) photos = out;
      }
      paintPhoto();
    });
  }

  function loadWeather() {
    getJSON(
      "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=weathercode,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,apparent_temperature_max,apparent_temperature_min&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=7",
      function (data) {
        if (!data || !data.daily) return;
        try {
          var tmin = Math.round(data.daily.temperature_2m_min[0]);
          var tmax = Math.round(data.daily.temperature_2m_max[0]);
          var code0 = (data.daily.weathercode || data.daily.weather_code)[0];
          var w = wmo(code0);
          var feels = null;
          var wind = null;
          if (data.current) {
            if (data.current.apparent_temperature != null) feels = Math.round(data.current.apparent_temperature);
            if (data.current.wind_speed_10m != null) wind = Math.round(data.current.wind_speed_10m);
            if (data.current.weather_code != null) w = wmo(data.current.weather_code);
            if (data.current.temperature_2m != null) {
              weather = {
                icon: w.icon,
                temp: Math.round(data.current.temperature_2m) + "°",
                phrase: w.phrase,
                feels: feels,
                wind: wind
              };
            } else {
              weather = { icon: w.icon, temp: tmin + "–" + tmax + "°", phrase: w.phrase, feels: feels, wind: wind };
            }
          } else {
            if (data.daily.apparent_temperature_max) feels = Math.round(data.daily.apparent_temperature_max[0]);
            if (data.daily.wind_speed_10m_max) wind = Math.round(data.daily.wind_speed_10m_max[0]);
            weather = { icon: w.icon, temp: tmin + "–" + tmax + "°", phrase: w.phrase, feels: feels, wind: wind };
          }
          var arr = [];
          var times = data.daily.time || [];
          for (var i = 0; i < times.length && i < 7; i++) {
            var iso = times[i];
            var p = isoParts(iso);
            var dt = new Date(Date.UTC(p.y, p.m - 1, p.d));
            var wd = dt.getUTCDay();
            var ww = wmo((data.daily.weathercode || data.daily.weather_code)[i]);
            var windMax = null;
            if (data.daily.wind_speed_10m_max && data.daily.wind_speed_10m_max[i] != null) {
              windMax = Math.round(data.daily.wind_speed_10m_max[i]);
            }
            arr.push({
              iso: iso,
              dn: DAYS[wd].short,
              icon: ww.icon,
              tmin: Math.round(data.daily.temperature_2m_min[i]),
              tmax: Math.round(data.daily.temperature_2m_max[i]),
              wind: windMax
            });
          }
          weekWx = arr;
          paintWx();
          paintWeekWx(helsinkiNow());
        } catch (e) {}
      }
    );
  }

  paintChips();
  paint();
  paintPhoto();
  loadSchedule();
  loadPhotos();
  loadWeather();
  setInterval(tickClock, 1000);
  setInterval(function () { paint(); }, 30000);
  setInterval(function () { loadSchedule(); }, 60000);
  setInterval(function () {
    if (!photos.length) return;
    photoIdx = (photoIdx + 1) % photos.length;
    paintPhoto();
  }, 16000);
  setInterval(loadWeather, 30 * 60 * 1000);
})();
  </script>
