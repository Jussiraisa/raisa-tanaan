<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="fiilis-build" content="20260922-v94">
  <meta name="theme-color" content="#EFD6B0">
  <title>Räisä · Fiilis · Muistot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&display=swap">
  <style>
html, body { height: 100%; margin: 0; overflow: hidden; background: #EFD6B0; }
* { box-sizing: border-box; }
.stage {
  position: absolute; top: 1.8vmin; left: 2vmin; right: 2vmin; bottom: 8vmin;
  border-radius: 1.8vmin; overflow: hidden; background: #e2c9a4;
  box-shadow: 0 .6vmin 2.2vmin rgba(60,40,18,.12);
}
.stage img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: opacity .9s ease;
}
.veil {
  position: absolute; left: 0; right: 0; bottom: 0; height: 32%;
  background: linear-gradient(180deg, transparent, rgba(20,16,10,.7));
  pointer-events: none;
}
.cap {
  position: absolute; left: 2.8vmin; right: 2.8vmin; bottom: 2.4vmin;
  color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.4);
}
.cap .wh {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 1.4vmin; font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase; opacity: .85; margin-bottom: .4vmin;
}
.cap .place {
  font-family: Newsreader, Georgia, serif;
  font-size: 4.6vmin; font-weight: 400; font-style: italic;
}
.cap .year { font-size: 1.8vmin; opacity: .9; margin-top: .35vmin; font-weight: 600; }
.cap .tag {
  margin-top: .7vmin; font-size: 1.55vmin; opacity: .85;
  font-family: Newsreader, Georgia, serif; font-style: italic;
}
.brand {
  position: absolute; top: 2.2vmin; right: 2.8vmin;
  font-size: .95vmin; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(255,255,255,.7);
  text-shadow: 0 1px 4px rgba(0,0,0,.35);
}
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; height: 6.6vmin;
  background: #EFD6B0; color: #5a4a34; border-top: 1px solid rgba(120,90,40,.16);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 4vmin; z-index: 30;
}
.nav a {
  color: inherit; text-decoration: none; text-align: center;
  font-size: 1.35vmin; font-weight: 600; min-width: 12vmin;
  padding: .6vmin 1.2vmin; opacity: .68; border-radius: .6vmin;
}
.nav a .ic { display: block; font-size: 2.4vmin; line-height: 1.15; margin-bottom: .15vmin; }
.nav a.on { opacity: 1; color: #3a2c18; background: rgba(201,148,58,.22);
  box-shadow: inset 0 -.28vmin 0 #c9943a; }
@media (max-width: 900px) {
  .stage { bottom: 5.2rem; }
  .nav { height: calc(3.8rem + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav a { font-size: .75rem; min-width: 4.5rem; }
  .nav a .ic { font-size: 1.25rem; }
}
  
.chips {
  position: absolute; top: 2vmin; left: 2vmin; right: 14vmin; z-index: 5;
  display: flex; flex-wrap: wrap; gap: .55vmin; align-items: center;
  pointer-events: auto;
}
.chip {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 1.25vmin; font-weight: 600; letter-spacing: .04em;
  padding: .55vmin 1.15vmin; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(20,16,10,.38); color: rgba(255,255,255,.88);
  backdrop-filter: blur(8px); cursor: pointer;
  transition: background .2s, border-color .2s, color .2s;
}
.chip:hover { background: rgba(20,16,10,.55); }
.chip.on {
  background: rgba(201,148,58,.92); border-color: rgba(255,230,180,.65);
  color: #1a140c;
}
@media (max-width: 900px) {
  .chips { right: 2vmin; top: 1.2rem; gap: .35rem; }
  .chip { font-size: .7rem; padding: .35rem .7rem; }
}

  </style>
</head>
<body>
<div class="stage" id="stage">
  <div class="chips" id="chips" aria-label="Albumivalinta"></div>
  <img id="photo" alt="">
  <div class="veil"></div>
  <div class="brand">v94 vaaka</div>
  <div class="cap">
    <div class="wh">Muistatko…</div>
    <div class="place" id="place">Muistot</div>
    <div class="year" id="year"></div>
    <div class="tag">Sama matka. Enemmän yhdessä.</div>
  </div>
</div>
<nav class="nav">
  <a href="tvr-vaaka.html"><span class="ic">◎</span>Tänään</a>
  <a href="tvr-vaaka-kalenteri.html"><span class="ic">▦</span>Kalenteri</a>
  <a class="on" href="tvr-vaaka-muistot.html"><span class="ic">♡</span>Muistot</a>
</nav>
<script>
(function () {
  var BUILD = "20260922-v94";
  var LS_KEY = "fiilisMemAlbum";
  var PHOTO_DENY = {
    "matka-2018-lontoo-00-002.jpg": 1,
    "matka-2018-lontoo-05-007.jpg": 1,
    "matka-2022-eurooppa-01-031.jpg": 1,
    "matka-2025-costa-brava-02-053.jpg": 1,
    "matka-2025-lontoo-04-062.jpg": 1,
    "matka-2026-brasilia-00-065.jpg": 1,
    "matka-2026-brasilia-03-068.jpg": 1
  };
  var FALLBACK = [
    { src: "photos-web/matka-2018-lontoo-cover-001.jpg", place: "Lontoo", year: "2018" },
    { src: "photos-web/matka-2019-italia-cover-015.jpg", place: "Italia", year: "2019" },
    { src: "photos-web/matka-2020-norja-cover-022.jpg", place: "Norja", year: "2020" },
    { src: "photos-web/matka-2024-riviera-cover-043.jpg", place: "Riviera", year: "2024" },
    { src: "photos-web/matka-2025-lontoo-cover-057.jpg", place: "Lontoo", year: "2025" },
    { src: "photos-web/matka-2026-alicante-cover-071.jpg", place: "Alicante", year: "2026" }
  ];
  var albums = [];
  var albumId = "kaikki";
  var photos = FALLBACK.slice(0);
  var idx = 0;
  var timer = null;

  function photoDenied(src) {
    if (!src) return true;
    var base = String(src).split("/").pop();
    return !!PHOTO_DENY[base];
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4) {
          if (x.status >= 200 && x.status < 300) {
            try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); }
          } else cb(null);
        }
      };
      x.send();
    } catch (e) { cb(null); }
  }
  function loadAlbumPref() {
    try {
      var v = localStorage.getItem(LS_KEY);
      if (v) albumId = v;
    } catch (e) {}
  }
  function saveAlbumPref() {
    try { localStorage.setItem(LS_KEY, albumId); } catch (e) {}
  }
  function buildPool() {
    var out = [];
    if (!albums.length) { photos = FALLBACK.slice(0); return; }
    if (albumId === "kaikki") {
      for (var i = 0; i < albums.length; i++) {
        var ph = albums[i].photos || [];
        for (var j = 0; j < ph.length; j++) {
          var m = ph[j];
          if (m && m.src && !photoDenied(m.src)) {
            out.push({ src: m.src, place: m.place || albums[i].title || "Muisto", year: m.year || "" });
          }
        }
      }
    } else {
      for (var a = 0; a < albums.length; a++) {
        if (albums[a].id === albumId) {
          var list = albums[a].photos || [];
          for (var k = 0; k < list.length; k++) {
            var p = list[k];
            if (p && p.src && !photoDenied(p.src)) {
              out.push({ src: p.src, place: p.place || albums[a].title || "Muisto", year: p.year || "" });
            }
          }
          break;
        }
      }
    }
    photos = out.length ? out : FALLBACK.slice(0);
    idx = 0;
  }
  function renderChips() {
    var el = document.getElementById("chips");
    if (!el) return;
    var items = [{ id: "kaikki", title: "Kaikki" }];
    for (var i = 0; i < albums.length; i++) {
      items.push({ id: albums[i].id, title: albums[i].title });
    }
    el.innerHTML = "";
    for (var c = 0; c < items.length; c++) {
      (function (it) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (it.id === albumId ? " on" : "");
        b.textContent = it.title;
        b.setAttribute("aria-pressed", it.id === albumId ? "true" : "false");
        b.onclick = function () {
          albumId = it.id;
          saveAlbumPref();
          buildPool();
          renderChips();
          show();
          restartTimer();
        };
        el.appendChild(b);
      })(items[c]);
    }
  }
  function show() {
    if (!photos.length) return;
    var p = photos[idx % photos.length];
    var img = document.getElementById("photo");
    var place = document.getElementById("place");
    var year = document.getElementById("year");
    if (img) {
      img.style.opacity = "0";
      setTimeout(function () {
        img.src = p.src;
        img.onload = function () { img.style.opacity = "1"; };
      }, 220);
    }
    if (place) place.textContent = p.place || "Muisto";
    if (year) year.textContent = p.year || "";
  }
  function restartTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () {
      idx = (idx + 1) % photos.length;
      show();
    }, 12000);
  }
  loadAlbumPref();
  getJSON("photos-albums.json?v=" + BUILD, function (data) {
    if (data && data.albums && data.albums.length) {
      albums = data.albums;
      var ok = false;
      for (var i = 0; i < albums.length; i++) if (albums[i].id === albumId) ok = true;
      if (albumId !== "kaikki" && !ok) albumId = "kaikki";
      buildPool();
      renderChips();
      show();
      restartTimer();
      return;
    }
    // fallback flat list
    getJSON("photos-from-matkat.json?v=" + BUILD, function (flat) {
      if (flat && flat.length) {
        var out = [];
        for (var i = 0; i < flat.length; i++) {
          var m = flat[i];
          if (m && m.src && !photoDenied(m.src)) {
            out.push({ src: m.src, place: m.place || "Muisto", year: m.year || "" });
          }
        }
        if (out.length >= 6) photos = out;
      }
      renderChips();
      show();
      restartTimer();
    });
  });
  show();
})();
</script>
</body>
</html>
