}
.clock {

.greet-block { flex: 1; min-width: 0; margin-left: 2.4vmin; padding-bottom: .6vmin; }
.greet {

  font-size: 3.4vmin; line-height: 1.15; font-weight: 400;
  color: #8f6524; letter-spacing: -.01em;
}
.next-line {
  margin-top: .55vmin; font-size: 1.65vmin; line-height: 1.35;
  font-weight: 550; color: #5c4e3a; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.next-line .badge {
  display: inline-block; margin-right: .5vmin;

  font-size: 1.2vmin; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
}
.date-soft { margin-top: .35vmin; font-size: 1.35vmin; color: #8a7a62; font-weight: 500; }
.wx {
  flex: 0 0 auto; text-align: right; padding-bottom: .8vmin; max-width: 28vmin;

.wx .row { display: flex; align-items: center; justify-content: flex-end; }
.wx .ic { font-size: 3.2vmin; margin-right: .6vmin; }
.wx .temp {
  font-size: 3.2vmin; font-weight: 650; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; color: #2c2418;
}
.wx .meta { font-size: 1.25vmin; color: #6c5c44; margin-top: .2vmin; }

/* —— Main: hero photo + side —— */
.main {
  flex: 1 1 auto; min-height: 0;
  display: flex; align-items: stretch;
}
.hero {
  flex: 1.55 1 0; min-width: 0; min-height: 0;
  position: relative; border-radius: 1.8vmin; overflow: hidden;
  background: #efe6d4;
  box-shadow: 0 .6vmin 2.2vmin rgba(60,40,18,.1);
}
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 5vmin 2.2vmin 1.8vmin;
  color: #f7f1e3;
  background: linear-gradient(to bottom, rgba(40,30,20,0), rgba(40,30,20,.82));
  font-family: Newsreader, Georgia, serif;
  font-size: 2.4vmin; line-height: 1.25; font-weight: 400;
}
.hero .cap .wh {
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 1.35vmin; font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; opacity: .82; margin-bottom: .35vmin;
}

.side {
  flex: 1 1 0; min-width: 0; min-height: 0;
  margin-left: 2.2vmin;
  display: flex; flex-direction: column;
}
.side > * + * { margin-top: 1.4vmin; }

.block {
  background: rgba(255,252,246,.55);
  border-radius: 1.4vmin;
  padding: 1.3vmin 1.6vmin 1.4vmin;
  min-height: 0;
}
.block.grow { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; }
.block.soft { background: transparent; padding-left: .2vmin; padding-right: .2vmin; }
.lbl {
  font-size: 1.2vmin; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #8f6524; margin-bottom: .7vmin;
}

/* Tänään list — crystal clear */
.today-list { flex: 1; min-height: 0; overflow: hidden; }
.ev-row {
  display: flex; align-items: flex-start;
  padding: .55vmin 0;
  font-size: 1.85vmin; line-height: 1.35; font-weight: 500;
  color: #2c2418;
  border-bottom: 1px solid rgba(44,36,24,.06);
}
.ev-row:last-child { border-bottom: 0; }
.ev-row.past { opacity: .4; }
.ev-row.live { font-weight: 650; }
.ev-row .when {

}
.ev-row.live .when { color: #8f6524; }
.ev-row .dot {

.ev-row .txt { flex: 1; min-width: 0; }
.ev-row .who { font-weight: 700; }
.ev-row .meta { font-size: 1.45vmin; color: #7a6a55; margin-top: .1vmin; font-weight: 500; }
.today-empty { font-size: 1.7vmin; color: #9a8b74; padding: .4vmin 0; font-style: italic;

.odot-hero {
  display: flex; align-items: baseline; flex-wrap: wrap;
}
.odot-hero .cd-big {
  font-family: Newsreader, Georgia, serif;

.odot-hero .cd-label {

.odot-list { margin-top: .55vmin; }
.odote {

.odote .d { font-weight: 650; color: #8f6524; flex: 0 0 auto; margin-left: .8vmin; }

.duo {

}
.duo > * + * { margin-left: 1.2vmin; }
.duo .block { flex: 1; }
.tmw-line, .meal-line {

.tmw-line:last-child, .meal-line:last-child { border-bottom: 0; }
.tmw-line .who { font-weight: 700; margin-right: .45vmin; }

.tmw-line .meta { color: #7a6a55; font-weight: 500; font-size: 1.35vmin; }
.meal-line .d { font-weight: 700; color: #8f6524; margin-right: .55vmin; }

  }

  function paintTomorrow(now) {
    var el = document.getElementById("tomorrowBox");
    if (!el) return;
    var iso = addDaysIso(now.iso, 1);
    var out = dayEventsClean(iso);
    if (!out.length) {
      el.innerHTML = "<div class=\"empty\">Ei merkintöjä</div>";
      return;
    }
    var html = "";
    var max = Math.min(out.length, 5);
    for (var i = 0; i < max; i++) {
      var e = out[i];
      var who = shortWho(e.who || "");
      var time = fmtRange(e.time, e.end) || "";
      var bits = [];
      if (e.driver) bits.push(e.driver);
      if (e.place) bits.push(e.place);
      html += "<div class=\"tmw-line\">"
        + (who ? "<span class=\"who\">" + esc(who) + "</span>" : "")
        + (time ? "<span class=\"t\">" + esc(time) + "</span>" : "")
        + "<span>" + esc(e.title || "")
        + (bits.length ? "<span class=\"meta\"> · " + esc(bits.join(" · ")) + "</span>" : "")
        + "</span></div>";
    }
    el.innerHTML = html;
  }

  function paintMeals(now) {
    var el = document.getElementById("mealBox");
    if (!el) return;
    var map = (schedule && schedule.homeMeals) || {};
    var html = "";
    var shown = 0;
    for (var n = 0; n < 4 && shown < 3; n++) {
      var iso = addDaysIso(now.iso, n);
      var dish = map[iso];
      if (!dish && n > 0) continue;
      var wd = (now.wd + n) % 7;
      var dayLbl = n === 0 ? "Tänään" : (n === 1 ? "Huom" : DAYS[wd].short);
      html += "<div class=\"meal-line\"><span class=\"d\">" + esc(dayLbl) + "</span>"
        + "<span>" + esc(dish || "Ei merkintää") + "</span></div>";
      shown++;
    }
    el.innerHTML = html || "<div class=\"empty\">Ei merkintää</div>";
  }

  function paintWx() {
    var el = document.getElementById("wx");
    if (!el) return;
    if (!weather.temp) {
      el.innerHTML = "<div class=\"meta muted\">Kuopio</div>";
      return;
    }
    var meta = weather.phrase || "Kuopio";
    el.innerHTML = "<div class=\"row\"><span class=\"ic\">" + weather.icon
      + "</span><span class=\"temp\">" + esc(weather.temp) + "</span></div>"
      + "<div class=\"meta muted\">" + esc(meta) + "</div>";
  }

  function paintPhoto() {
    var img = document.getElementById("photo");
    var cap = document.getElementById("photoCap");
    if (!img || !photos.length) return;
    var p = photos[photoIdx % photos.length];
    img.src = p.src;
    var place = p.place || "Muisto";
    var year = p.year || "";
    var line = year ? (place + " · " + year) : place;
    if (cap) cap.innerHTML = "<div class=\"wh\">Muistatko…</div>" + esc(line);
  }

  function paintChips() {
    var el = document.getElementById("chips");
    if (!el) return;
    var html = "";
    for (var i = 0; i < FAMILY.length; i++) {
      var f = FAMILY[i];
      html += "<span class=\"chip\" style=\"background:" + f.color + "\">" + esc(f.name) + "</span>";
    }
    el.innerHTML = html;
  }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
    var dateEl = document.getElementById("dateLine");
    if (dateEl) dateEl.textContent = DAYS[now.wd].full + " " + now.day + "." + now.month + ". · Kuopio";
    paintNextLine(now);
    paintTodayList(now);
    paintOdotukset(now);
    paintTomorrow(now);
    paintMeals(now);
    paintWx();
  }

  function tickClock() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
    paintNextLine(now);
  }

  function loadSchedule() {
    getJSON("schedule.json?v=" + BUILD, function (data) {
      if (data) schedule = data;
      paint();
    });
  }
  function loadPhotos() {
    getJSON("photos-from-matkat.json?v=" + BUILD, function (data) {
      if (data && data.length) {
        var out = [];
        for (var i = 0; i < data.length; i++) {
          var m = data[i];
          if (m && m.src && String(m.src).indexOf("matka-") >= 0) {
            out.push({ src: m.src, place: m.place || "Muisto", year: m.year || "" });
          }
        }
        out = filterPhotos(out);
        if (out.length >= 8) photos = out;
      }
      paintPhoto();
    });
  }
  function loadWeather() {
    getJSON(
      "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=weathercode,temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=3",
      function (data) {
        if (!data) return;
        try {
          var w = { icon: "🌡️", phrase: "" };
          if (data.current) {
            w = wmo(data.current.weather_code);
            weather = {
              icon: w.icon,
              temp: Math.round(data.current.temperature_2m) + "°",
              phrase: w.phrase
            };
          }
          paintWx();
        } catch (e) {}
      }
    );
  }

  paintChips();
  paint();
  paintPhoto();
  loadSchedule();
  loadPhotos();
  loadWeather();
  setInterval(tickClock, 1000);
  setInterval(function () { paint(); }, 30000);
  setInterval(function () { loadSchedule(); }, 60000);
  setInterval(function () {
    if (!photos.length) return;
    photoIdx = (photoIdx + 1) % photos.length;
    paintPhoto();
  }, 16000);
  setInterval(loadWeather, 30 * 60 * 1000);
})();
</script>
</body>
</html>
