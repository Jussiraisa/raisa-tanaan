.nav {

          + "<span>" + esc(labelS) + "</span></div>";
        shown++;
      }
    }
    var maxEv = Math.min(out.length, MAX_HOBBY);
    for (i = 0; i < maxEv; i++) {
      var e = out[i];
      var who = shortWho(e.who || "");
      var time = fmtRange(e.time, e.end) || "";
      var bits = [];
      if (e.driver) bits.push(e.driver);
      if (e.place) bits.push(e.place);
      html += "<div class=\"tmw-line\">"
        + (who ? "<span class=\"who\">" + esc(who) + "</span>" : "")
        + (time ? "<span class=\"t\">" + esc(time) + "</span>" : "")
        + "<span>" + esc(e.title || "")
        + (bits.length ? "<span class=\"meta\"> · " + esc(bits.join(" · ")) + "</span>" : "")
        + "</span></div>";
    }
    el.innerHTML = html;
  }

  function paintMeals(now) {
    var el = document.getElementById("mealBox");
    if (!el) return;
    var map = (schedule && schedule.homeMeals) || {};
    var html = "";
    var shown = 0;
    for (var n = 0; n < 4 && shown < 2; n++) {
      var iso = addDaysIso(now.iso, n);
      var dish = map[iso];
      if (!dish && n > 0) continue;
      var wd = (now.wd + n) % 7;
      var dayLbl = n === 0 ? "Tänään" : (n === 1 ? "Huom" : DAYS[wd].short);
      html += "<div class=\"meal-line\"><span class=\"d\">" + esc(dayLbl) + "</span>"
        + "<span>" + esc(dish || "Ei merkintää") + "</span></div>";
      shown++;
    }
    el.innerHTML = html || "<div class=\"empty\">Ei merkintää</div>";
  }

  function paintWx() {
    var el = document.getElementById("wx");
    if (!el) return;
    if (!weather.temp) {
      el.innerHTML = "<div class=\"meta muted\">Kuopio</div>";
      return;
    }
    var meta = weather.phrase || "Kuopio";
    el.innerHTML = "<div class=\"row\"><span class=\"ic\">" + weather.icon
      + "</span><span class=\"temp\">" + esc(weather.temp) + "</span></div>"
      + "<div class=\"meta muted\">" + esc(meta) + "</div>";
  }

  function paintPhoto() {
    var img = document.getElementById("photo");
    var cap = document.getElementById("photoCap");
    if (!img || !photos.length) return;
    var p = photos[photoIdx % photos.length];
    img.src = p.src;
    var place = p.place || "Muisto";
    var year = p.year || "";
    var line = year ? (place + " · " + year) : place;
    if (cap) cap.innerHTML = "<div class=\"wh\">Muistatko…</div>" + esc(line);
  }

  function paintChips() { /* removed — foot shows action alerts */ }

  function paint() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
    var dateEl = document.getElementById("dateLine");
    if (dateEl) dateEl.textContent = DAYS[now.wd].full + " " + now.day + "." + now.month + ". · Kuopio";
    paintNextLine(now);
    paintWilmaAlerts(now);
    paintTodayList(now);
    paintOdotukset(now);
    paintTomorrow(now);
    paintMeals(now);
    paintWx();
  }

  function tickClock() {
    var now = helsinkiNow();
    applyTheme(now.hour);
    var clockEl = document.getElementById("clock");
    if (clockEl) clockEl.textContent = pad(now.hour) + "." + pad(now.minute);
    var greetEl = document.getElementById("greet");
    if (greetEl) greetEl.textContent = greeting(now.hour);
    paintNextLine(now);
  }

  function loadSchedule() {
    getJSON("schedule.json?v=" + BUILD, function (data) {
      if (data) schedule = data;
      paint();
    });
  }
  function loadPhotos() {
    getJSON("photos-from-matkat.json?v=" + BUILD, function (data) {
      if (data && data.length) {
        var out = [];
        for (var i = 0; i < data.length; i++) {
          var m = data[i];
          if (!m || !m.src) continue;
          var src = String(m.src);
          if (src.indexOf("photos-web/") < 0 && src.indexOf("matka-") < 0 && src.indexOf("kb-") < 0 && src.indexOf("london") < 0 && src.indexOf("alicante") < 0) continue;
          out.push({
            src: m.src,
            place: m.place || "Muisto",
            year: m.year || "",
            vibe: m.vibe || "",
            tags: m.tags || [],
            slot: m.slot || []
          });
        }
        out = filterPhotos(out);
        if (out.length >= 8) {
          photoCatalog = out;
          photos = out;
          ensurePhotoDeck(helsinkiNow(), true);
        }
      }
      paintPhoto();
    });
  }
  function loadWeather() {
    getJSON(
      "https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=weathercode,temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=3",
      function (data) {
        if (!data) return;
        try {
          var w = { icon: "🌡️", phrase: "" };
          if (data.current) {
            w = wmo(data.current.weather_code);
            weather = {
              icon: w.icon,
              temp: Math.round(data.current.temperature_2m) + "°",
              phrase: w.phrase
            };
          }
          paintWx();
        } catch (e) {}
      }
    );
  }

  paintChips();
  paint();
  paintPhoto();
  loadSchedule();
  loadPhotos();
  loadWeather();
  setInterval(tickClock, 1000);
  setInterval(function () { paint(); }, 30000);
  setInterval(function () { loadSchedule(); }, 60000);
  var photoTimer = null;
  function schedulePhotoRotate() {
    if (photoTimer) clearTimeout(photoTimer);
    var now = helsinkiNow();
    var ms = photoRotateMs(now);
    photoTimer = setTimeout(function () {
      ensurePhotoDeck(helsinkiNow(), false);
      var list = (photoDeck && photoDeck.length) ? photoDeck : photos;
      if (!list.length) { schedulePhotoRotate(); return; }
      photoIdx = (photoIdx + 1) % list.length;
      paintPhoto();
      schedulePhotoRotate();
    }, ms);
  }
  schedulePhotoRotate();
  setInterval(loadWeather, 30 * 60 * 1000);
})();
</script>



<script>
(function () {
  function paintTsla(d) {
    var el = document.getElementById("navTsla");
    if (!el || !d || d.price == null) return;
    var p = Number(d.price);
    var pct = Number(d.changePct);
    if (isNaN(p)) return;
    var priceStr = p.toFixed(2);
    var cls = "flat";
    var pctStr = "0.0%";
    if (!isNaN(pct)) {
      if (pct > 0.005) cls = "up";
      else if (pct < -0.005) cls = "dn";
      var sign = pct > 0 ? "+" : "";
      pctStr = sign + pct.toFixed(1) + "%";
    }
    el.innerHTML = priceStr + " <span class=\"" + cls + "\">" + pctStr + "</span>";
  }
  function fromYahoo(raw) {
    try {
      var j = typeof raw === "string" ? JSON.parse(raw) : raw;
      var meta = j && j.chart && j.chart.result && j.chart.result[0] && j.chart.result[0].meta;
      if (!meta) return null;
      var price = Number(meta.regularMarketPrice);
      var pct = Number(meta.regularMarketChangePercent);
      if (pct == null || isNaN(pct)) pct = Number(meta.fulldayChangePercent);
      if (isNaN(price)) return null;
      return { price: price, changePct: pct };
    } catch (e) { return null; }
  }
  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) cb(null, xhr.responseText);
      else cb("status");
    };
    xhr.onerror = function () { cb("net"); };
    xhr.ontimeout = function () { cb("timeout"); };
    xhr.send();
  }
  function loadLive() {
    var v = Math.floor(Date.now() / 60000);
    // 1) same-origin cache first — shows immediately on phone
    xhrGet("tsla.json?v=" + v, function (err0, text0) {
      if (!err0 && text0) {
        try { paintTsla(JSON.parse(text0)); } catch (e) {}
      }
      // 2) then try live Yahoo via proxy (non-blocking upgrade)
      var yahooUrl = "https://api.allorigins.win/raw?url=" +
        encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/TSLA?interval=1d&range=5d");
      xhrGet(yahooUrl, function (err, text) {
        var d = (!err && text) ? fromYahoo(text) : null;
        if (d) paintTsla(d);
      });
    });
  }
  loadLive();
  setInterval(loadLive, 60000);
})();
</script>
