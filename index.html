  <style>
:root {
  --paper: #f4f1e8;
  --panel: #fbfaf5;
  --ink: #1c1b16;
  --ink2: #5b584d;
  --ink3: #94907f;
  --line: #e4e0d3;
  --hair: #d6d1c1;
  --accent: #0e6a61;
  --accent-soft: #e2ede9;
  --gold: #a8791f;
  --ellen: #bd5f3c;
  --samuel: #3c6a8a;
  --mea: #7a58a0;
  --milla: #3f7d55;
  --serif: "Instrument Serif", ui-serif, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15161a;
    --panel: #1c1e23;
    --ink: #f1efe6;
    --ink2: #b4b1a6;
    --ink3: #82806f;
    --line: #2b2d34;
    --hair: #33353d;
    --accent: #3bb6a6;
    --accent-soft: #17322e;
    --gold: #cba64f;
  }
}

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; color-scheme: light dark }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.5;
}
.wrap { max-width: 600px; margin: 0 auto; padding: 34px 22px 70px }

.rv { opacity: 0; transform: translateY(10px); animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards }
@keyframes rise { to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) {
  .rv { animation: none; opacity: 1; transform: none }
}

.eyebrow {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold);
}
.date {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(40px, 12vw, 58px);
  line-height: .96;
  letter-spacing: .005em;
  margin: 6px 0 0;
  text-wrap: balance;
}
.weather {
  font-size: 15.5px;
  color: var(--ink2);
  margin: 14px 0 0;
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}
.weather .t { font-weight: 700; color: var(--ink) }
.rule { height: 1px; background: var(--hair); margin: 22px 0 0 }
.rule.g { background: linear-gradient(90deg, var(--gold), transparent 70%); height: 2px; opacity: .5 }

.hero {
  margin: 26px 0 8px;
  padding: 24px 24px 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  position: relative;
  overflow: hidden;
}
.hero:before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: var(--accent);
}
.hero .lbl {
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--accent);
}
.hero .ev {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(30px, 8vw, 42px);
  line-height: 1.02;
  margin: 9px 0 0;
  letter-spacing: .005em;
}
.hero .place { font-size: 15.5px; color: var(--ink2); margin: 8px 0 0 }
.hero .who {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0 0;
  font-size: 16px;
  font-weight: 600;
}
.hero .drive { font-weight: 800; color: var(--accent) }
.hero .open { font-weight: 800; color: var(--gold) }
.hero .note { color: var(--ink3); font-weight: 500 }
.hero .cd {
  margin: 18px 0 0;
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 9px;
}
.hero .cd .dotpulse {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1) }
  50% { opacity: .35; transform: scale(.8) }
}
@media (prefers-reduced-motion: reduce) {
  .hero .cd .dotpulse { animation: none }
}
.hero .cd .num { font-variant-numeric: tabular-nums }
.hero.done .lbl { color: var(--ink3) }
.hero.done:before { background: var(--hair) }

.dayhead { display: flex; align-items: baseline; gap: 12px; margin: 38px 0 4px }
.dayhead h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 26px;
  margin: 0;
  letter-spacing: .01em;
}
.dayhead .ln { flex: 1; height: 1px; background: var(--hair) }

.lbl2 {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink3);
  margin: 22px 0 4px;
}

.school .sr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 16.5px;
}
.school .sr:last-child { border-bottom: 0 }
.school .nm { display: flex; align-items: center; gap: 11px; font-weight: 600 }
.school .hrs {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink2);
  letter-spacing: .01em;
}
.school .hrs.empty { font-weight: 500; color: var(--ink3) }

a.school-link { display: block; color: inherit; text-decoration: none }

.school a.sr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 16.5px;
  color: inherit;
  text-decoration: none;
}
.school a.sr:last-child { border-bottom: 0 }
.school a.sr:active, .school a.sr:hover { opacity: .85 }
.period {
  display: flex;
  gap: 14px;
  align-items: baseline;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.period:last-child { border-bottom: 0 }
.period .pt {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--ink3);
  min-width: 4.5em;
}
.period .pn {
  font-size: 22px;
  font-weight: 700;
}
.period .ps { font-size: 14px; color: var(--ink2); margin-top: 2px }

a.school-link .lbl2 { color: var(--accent) }
.dayrow.dayprog { grid-template-columns: 40px 1fr; align-items: start; padding: 10px 0 }
.dayrow.today.dayprog { padding: 10px }
.prog .hrs { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink2) }
.aineet { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px }
.aine {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 800;
  font-size: 13px;
  padding: 5px 9px;
  border-radius: 10px;
}
.dayrow.today .aine { background: var(--accent); color: #fff }
.huom { font-size: 13px; color: var(--ink2); margin-top: 4px }
.kh .ks { font-weight: 500; font-size: 13px; color: var(--ink3); margin-left: 8px }


.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.item {
  display: flex;
  gap: 15px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.item:last-child { border-bottom: 0 }
.item .tm {
  font-size: 14.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--ink3);
  min-width: 74px;
  padding-top: 2px;
}
.item .bd { flex: 1; min-width: 0 }
.item .h { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px }
.item .s { font-size: 14px; color: var(--ink2); margin-top: 2px }
.item.is-cancel { opacity: .72 }
.item.is-cancel .h { font-weight: 600; color: var(--ink2) }

.pill {
  display: inline-block;
  font-size: 12px;
  font-weight: 800;
  padding: 4px 11px;
  border-radius: 999px;
  margin-top: 8px;
  margin-right: 6px;
}
.pill.us { background: var(--accent-soft); color: var(--accent) }
.pill.other { background: color-mix(in srgb, var(--ink3) 16%, transparent); color: var(--ink2) }
.pill.warn { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold) }

.tom {
  margin: 16px 0 0;
  padding: 8px 22px 14px;
  border-radius: 22px;
  background: color-mix(in srgb, var(--accent) 7%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--line));
}
.tom .th {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 25px;
  margin: 16px 0 0;
  color: var(--accent);
}
.tom .tw { font-size: 12.5px; color: var(--ink3); margin: 5px 0 0 }
.tom .lbl2 { color: color-mix(in srgb, var(--accent) 55%, var(--ink3)) }
.tom .sr, .tom .item { border-color: color-mix(in srgb, var(--accent) 15%, transparent) }

.foot {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--hair);
  font-size: 12.5px;
  color: var(--ink3);
  text-align: center;
  line-height: 1.6;
}
.foot a { color: var(--accent); text-decoration: none; font-weight: 700 }
.foot a:hover { text-decoration: underline }
.foot .nav { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px }

.back {
  display: inline-block;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
  text-decoration: none;
  margin-bottom: 10px;
}
.back:hover { text-decoration: underline }

.vtitle {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(32px, 9vw, 44px);
  line-height: 1.05;
  margin: 4px 0 6px;
}
.lede { font-size: 15px; color: var(--ink2); margin: 0 0 18px }

.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  border: 0;
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  background: var(--accent-soft);
  color: var(--accent);
}
.btn:hover { filter: brightness(0.97) }
.btn.gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold) }
.btn.quiet { background: transparent; color: var(--ink2); padding-left: 8px; padding-right: 8px }
.btn.danger { background: color-mix(in srgb, var(--ellen) 14%, transparent); color: var(--ellen) }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px }

.inp, select.inp, textarea.inp {
  font: inherit;
  font-size: 15px;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 11px;
  width: 100%;
}
textarea.inp { min-height: 64px; resize: vertical }
.inp:focus, select.inp:focus, textarea.inp:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
  border-color: var(--accent);
}
label.f {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink3);
  margin: 12px 0 5px;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px }

.kidblock { margin: 22px 0 8px }
.kidblock .kh {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 4px;
}
.dayrow {
  display: grid;
  grid-template-columns: 36px 1fr 10px 1fr;
  gap: 8px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
}
.dayrow .da { font-weight: 800; font-size: 13px; color: var(--ink3); letter-spacing: .06em }
.dayrow .dash { color: var(--ink3); text-align: center }
.dayrow.today {
  background: var(--accent-soft);
  margin: 0 -10px;
  padding: 8px 10px;
  border-radius: 12px;
  border-bottom-color: transparent;
}
.dayrow.today .da { color: var(--accent) }
.status { font-size: 13px; color: var(--accent); font-weight: 700; min-height: 1.2em; margin-top: 10px }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px 16px 14px;
  margin: 12px 0;
}
.card .meta { font-size: 12.5px; color: var(--ink3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase }
.card .ct { font-size: 18px; font-weight: 700; margin: 4px 0 0 }
.card .cs { font-size: 14px; color: var(--ink2); margin-top: 3px }
.xlist { font-size: 13.5px; color: var(--ink2); margin: 8px 0 0 }
.xlist div { margin-top: 3px }

.shop { list-style: none; margin: 8px 0 0; padding: 0 }
.shop li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  font-size: 16.5px;
}
.shop li.done span { color: var(--ink3); text-decoration: line-through }
.shop input[type=checkbox] {
  margin-top: 4px;
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  flex: 0 0 auto;
}
.addrow { display: flex; gap: 8px; margin-top: 14px }
.addrow .inp { flex: 1 }

.empty { color: var(--ink3); font-size: 15px; padding: 8px 0 4px }

@media (max-width: 400px) {
  .wrap { padding: 28px 16px 64px }
  .item .tm { min-width: 58px }
  .hero { padding: 20px 18px 18px }
  .tom { padding: 6px 16px 12px }
  .row3 { grid-template-columns: 1fr 1fr }
}

  </style>
</head>

  function deepMerge(a, b) {
    if (b === null) return null;
    if (b === undefined) return a;
    if (Array.isArray(b)) return b;
    if (typeof b === "object" && typeof a === "object" && a && b) {
      const out = Object.assign({}, a);
      Object.keys(b).forEach(k => { out[k] = deepMerge(a[k], b[k]); });
      return out;
    }
    return b;
  }

  function helsinkiNow(date) {
    const instant = date || new Date();
    const parts = {};
    const dtf = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      weekday: "short",
      hourCycle: "h23"
    });
    dtf.formatToParts(instant).forEach(p => {
      if (p.type !== "literal") parts[p.type] = p.value;
    });
    const wd = EN_WD[parts.weekday];
    const year = +parts.year;
    const month = +parts.month;
    const day = +parts.day;
    const hour = +parts.hour;
    const minute = +parts.minute;
    const second = +parts.second;
    return {
      year, month, day, hour, minute, second, wd,
      key: DAYS[wd].key,
      iso: pad(year, 4) + "-" + pad(month, 2) + "-" + pad(day, 2),
      minutes: hour * 60 + minute
    };
  }

  function pad(n, w) {
    return String(n).padStart(w, "0");
  }

  function addCalendarDays(year, month, day, n) {
    const dt = new Date(Date.UTC(year, month - 1, day + n));
    return { year: dt.getUTCFullYear(), month: dt.getUTCMonth() + 1, day: dt.getUTCDate() };
  }

  function weekdayOf(year, month, day) {
    return new Date(Date.UTC(year, month - 1, day)).getUTCDay();
  }

  function isoWeek(year, month, day) {
    const date = new Date(Date.UTC(year, month - 1, day));
    const utcDay = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - utcDay);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
  }

  function parseMin(hhmm) {
    if (!hhmm) return null;
    const p = String(hhmm).split(":");
    const h = +p[0], m = +(p[1] || 0);
    if (Number.isNaN(h)) return null;
    return h * 60 + m;
  }

  function fmtHm(hhmm) {
    if (!hhmm) return "";
    const p = String(hhmm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00", 2);
  }

  function fmtCompact(hhmm) {
    if (!hhmm) return "";
    const p = String(hhmm).split(":");
    const h = Number(p[0]);
    const m = +(p[1] || 0);
    return m === 0 ? String(h) : h + "." + pad(m, 2);
  }

  function fmtRange(start, end) {
    if (!start && !end) return "—";
    if (start && end) return fmtCompact(start) + "–" + fmtHm(end);
    if (start) return fmtCompact(start);
    return "–" + fmtHm(end);
  }

  function fmtSchool(hours) {
    if (!hours || (!hours.start && !hours.end)) return "ei merkattu";
    if (hours.start && hours.end) return fmtHm(hours.start) + "–" + fmtHm(hours.end);
    return hours.start ? fmtHm(hours.start) : "–" + fmtHm(hours.end);
  }

  function wmoInfo(code) {

  function precip(code) {
    if (code == null) return false;
    return (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95;
  }

  function snow(code) {
    return (code >= 71 && code <= 77) || (code >= 85 && code <= 86);
  }

  function clothes(tmin, tmax, code) {
    const hi = tmax;
    const wet = precip(code);
    const sn = snow(code);
    if (sn && hi <= 5) return "lämmin takki ja pipo";
    if (sn) return "lämmin takki";
    if (wet && hi <= 8) return "lämmin takki ja sadevaraus";
    if (wet) return "sadevaraus";
    if (hi <= 2) return "lämmin talvitakki";
    if (hi <= 8) return "lämmin takki";
    if (hi <= 14) return "takki riittää, ei sadetta";
    if (hi <= 19) return "ohut takki riittää";
    return "ohut kerros riittää";
  }

  async function loadWeather(todayIso, tomIso) {
    try {
      const cached = sessionStorage.getItem(WEATHER_KEY);
      if (cached) {
        const c = JSON.parse(cached);
        if (c.date === todayIso && c.today) {
          weather = { today: c.today, tomorrow: c.tomorrow, error: false, loading: false };
          return;
        }
      }
    } catch (e) { /* ignore */ }

    const url = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + LAT
      + "&longitude=" + LON
      + "&daily=weathercode,temperature_2m_max,temperature_2m_min"
      + "&timezone=Europe%2FHelsinki"
      + "&forecast_days=3";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("http");
      const data = await res.json();
      const times = data.daily.time;
      const codes = data.daily.weathercode;
      const maxs = data.daily.temperature_2m_max;
      const mins = data.daily.temperature_2m_min;
      const pick = iso => {
        const i = times.indexOf(iso);
        if (i < 0) return null;
        return { code: codes[i], tmax: maxs[i], tmin: mins[i] };
      };
      weather = {
        today: pick(todayIso),
        tomorrow: pick(tomIso),
        error: false,
        loading: false
      };
      if (!weather.today) weather.error = true;
      sessionStorage.setItem(WEATHER_KEY, JSON.stringify({
        date: todayIso,
        today: weather.today,
        tomorrow: weather.tomorrow
      }));
    } catch (e) {
      weather = { today: null, tomorrow: null, error: true, loading: false };
    }
  }

  function pickHero(now, list) {
    const iso = now.iso;
    const active = list.filter(ev => !cancelledReason(ev, iso));
    const remaining = active.filter(ev => endTime(ev) > now.minutes)
      .sort((a, b) => keyTime(a) - keyTime(b));
    if (remaining.length) return { type: "event", event: remaining[0] };
    if (active.length) return { type: "done" };

    const pickups = KIDS.map(k => {
      const h = (store.school[k.id] || {})[now.key];
      if (!h || !h.end) return null;
      const end = parseMin(h.end);
      if (end == null) return null;
      return { kid: k, hours: h, end };
    }).filter(Boolean).sort((a, b) => a.end - b.end);

    const next = pickups.find(p => p.end > now.minutes);
    if (next) return { type: "pickup", pickup: next };
    return { type: "none" };
  }

  function parseHmToMin(hm) {
    if (!hm) return null;
    const m = String(hm).match(/^(\d{1,2}):(\d{2})$/);

    return (+m[1]) * 60 + (+m[2]);

  function minToHm(mins) {

  function periodPlan(start, end, aineet) {
    const list = aineet && aineet.length ? aineet.slice() : [];
    if (!list.length) return [];
    const s = parseHmToMin(start);
    const e = parseHmToMin(end);
    if (s == null || e == null || e <= s) {
      return list.map(function(a, i) {
        return { start: "", end: "", name: a, n: i + 1 };
      });
    }
    const n = list.length;
    const slot = Math.floor((e - s) / n);
    return list.map(function(a, i) {
      const a0 = s + i * slot;
      const a1 = (i === n - 1) ? e : s + (i + 1) * slot;
      return { start: minToHm(a0), end: minToHm(a1), name: a, n: i + 1 };
    });
  }

      const placeBits = [ev.title, ev.place, fmtRange(ev.start, ev.end)].filter(Boolean);

      const noteHtml = note ? " <span class=\"note\">· " + esc(note) + "</span>" : "";
      if (!pill) {
        who = note ? "<div class=\"who\"><span class=\"note\">" + esc(note) + "</span></div>" : "";
      } else if (pill.cls === "warn") {
        who = "<div class=\"who\"><span class=\"open\">Sovi kyyti erikseen</span>" + noteHtml + "</div>";
      } else if (pill.cls === "us") {
        who = "<div class=\"who\">🚗 <span class=\"drive\">" + esc(ev.driver) + "</span> "
          + esc(rideLabel(ev) || "") + noteHtml + "</div>";
      } else {
        who = "<div class=\"who\">" + esc(pill.text) + noteHtml + "</div>";
      }
      const cd = countdownHtml(ev, now.minutes);
      const live = cd !== "Illan menot hoidettu";
      return "<section class=\"hero rv\" style=\"animation-delay:.09s\">"
        + "<div class=\"lbl\">Seuraavaksi</div>"
        + "<div class=\"ev\">" + esc(heroTitle(ev)) + "</div>"
        + "<div class=\"place\">" + esc(placeBits.join(" · ")) + "</div>"
        + who
        + "<div class=\"cd\" id=\"cd\">"
        + (live ? "<span class=\"dotpulse\"></span>" : "")
        + "<span id=\"cdtext\">" + cd + "</span></div></section>";
    }
    if (hero.type === "pickup") {
      const p = hero.pickup;
      const left = p.end - now.minutes;
      const cd = "Haku <span class=\"num\">" + durPhrase(left) + "</span> päästä · klo " + fmtHm(p.hours.end);
      return "<section class=\"hero rv\" style=\"animation-delay:.09s\">"
        + "<div class=\"lbl\">Seuraavaksi</div>"
        + "<div class=\"ev\">" + esc(p.kid.name) + " kotiin</div>"
        + "<div class=\"place\">Koulu päättyy · " + esc(fmtSchool(p.hours)) + "</div>"
        + "<div class=\"cd\" id=\"cd\"><span class=\"dotpulse\"></span><span id=\"cdtext\">" + cd + "</span></div></section>";
    }
    if (hero.type === "done") {
      return "<section class=\"hero done rv\" style=\"animation-delay:.09s\">"
        + "<div class=\"lbl\">Seuraavaksi</div>"
        + "<div class=\"ev\">Illan menot hoidettu</div>"
        + "<div class=\"place\">Ei enää kyytejä tälle illalle</div></section>";
    }
    return "<section class=\"hero done rv\" style=\"animation-delay:.09s\">"
      + "<div class=\"lbl\">Seuraavaksi</div>"
      + "<div class=\"ev\">Ei merkittyjä menoja</div>"
      + "<div class=\"place\">Rauhallinen päivä — tai merkitse meno Treenit-näkymässä</div></section>";
  }

  function renderWeather(target) {
    if (weather.loading) return "haetaan säätä…";
    if (weather.error || !weather[target]) return "sää ei saatavilla";
    return target === "today" ? weatherLine(weather.today) : weatherShort(weather.tomorrow);
  }

  function footer() {
    return "<div class=\"foot rv\" style=\"animation-delay:.3s\">"
      + "Päivä, sää ja lähtölaskenta päivittyvät automaattisesti.<br>"
      + "<div class=\"nav\">"
      + "<a href=\"#/\">Tänään</a>"
      + "<a href=\"#/lukujarjestys\">Lukujärjestykset</a>"
      + "<a href=\"#/treenit\">Treenit &amp; kyydit</a>"
      + "<a href=\"#/ruoka\">Ruoka</a>"
      + "<a href=\"#/kauppa\">Kauppalista</a>"
      + "</div></div>";
  }

  function backLink() {
    return "<a class=\"back\" href=\"#/\">← Tänään</a>";
  }

  function renderToday() {
    const now = helsinkiNow();
    lastIso = now.iso;
    const tom = addCalendarDays(now.year, now.month, now.day, 1);
    const tomWd = weekdayOf(tom.year, tom.month, tom.day);
    const tomDay = dayByI(tomWd);
    const week = isoWeek(now.year, now.month, now.day);
    const todayEvents = eventsOn(now.iso, now.key);
    lastHeroSig = heroSig(pickHero(now, todayEvents));
    const tomIso = pad(tom.year, 4) + "-" + pad(tom.month, 2) + "-" + pad(tom.day, 2);
    const tomEvents = eventsOn(tomIso, tomDay.key);
    const todayMeal = store.meals[now.key];
    const tomMeal = store.meals[tomDay.key];

    const wToday = renderWeather("today");
    const wTom = renderWeather("tomorrow");

    let kyydit = todayEvents.map(ev => eventItem(ev, now.iso)).join("");
    let ruoka = mealItem(todayMeal);
    let tomMenot = tomEvents.map(ev => eventItem(ev, tomIso)).join("") + mealItem(tomMeal);

    return "<header class=\"rv\" style=\"animation-delay:.02s\">"
      + "<div class=\"eyebrow\">Räisän perhe · Viikko " + week + "</div>"
      + "<h1 class=\"date\">" + DAYS[now.wd].full + "<br>" + fmtDot(now.year, now.month, now.day) + "</h1>"
      + "<div class=\"weather\" id=\"wx\">" + wToday + "</div>"
      + "<div class=\"rule g\"></div></header>"
      + renderHero(now, todayEvents)
      + "<div class=\"dayhead rv\" style=\"animation-delay:.15s\"><h2>Tänään</h2><span class=\"ln\"></span></div>"
      + "<div class=\"rv\" style=\"animation-delay:.18s\">"
      + "<div class=\"lbl2\">Koulu · tunnit</div>"
      + "<div class=\"school\">" + schoolRows(now.key) + "</div>"
      + (kyydit ? "<div class=\"lbl2\">Kyydit</div>" + kyydit : "")
      + (ruoka ? "<div class=\"lbl2\">Ruoka</div>" + ruoka : "")
      + "</div>"
      + "<section class=\"tom rv\" style=\"animation-delay:.24s\">"
      + "<div class=\"th\">Huomenna · " + tomDay.abbr + " " + fmtDot(tom.year, tom.month, tom.day) + "</div>"
      + "<div class=\"tw\" id=\"wx2\">" + wTom + "</div>"
      + "<div class=\"lbl2\">Koulu · tunnit</div>"
      + "<div class=\"school\">" + schoolRows(tomDay.key) + "</div>"
      + (tomMenot ? "<div class=\"lbl2\">Menot &amp; ruoka</div>" + tomMenot : "")
      + "</section>"
      + footer();
  }

  function renderKidDay(kidId, dayKey) {
    const k = kidById(kidId) || KIDS[0];
    const day = dayByKey(dayKey) || dayByKey(helsinkiNow().key);
    const meta = HOURS[k.id] || {};
    const times = (store.school[k.id] || {})[day.key] || {};
    const tunti = ((meta.tunnit) || {})[day.key] || {};
    const start = times.start || tunti.alku || "";
    const end = times.end || tunti.loppu || "";
    const huom = tunti.huom || "";
    const plans = (tunti.tunnit && tunti.tunnit.length)
      ? tunti.tunnit.map(function(p, i) {
          return { start: p.alku, end: p.loppu, name: p.aine, n: i + 1 };
        })
      : periodPlan(start, end, tunti.aineet || []);
    const range = (start || end) ? fmtSchool({ start: start, end: end }) : "ei merkattu";
    let body = "";
    if (plans.length) {
      body = plans.map(function(p) {
        const tm = p.start ? (fmtHm(p.start) + (p.end ? "–" + fmtHm(p.end) : "")) : "—";
        return "<div class=\"period\"><div class=\"pt\">" + esc(tm) + "</div>"
          + "<div><div class=\"pn\">" + p.n + ". " + esc(p.name) + "</div></div></div>";
      }).join("");
    } else {
      body = "<div class=\"period\"><div class=\"pt\">" + esc(range) + "</div>"
        + "<div><div class=\"pn\">Koulupäivä</div>"
        + "<div class=\"ps\">Tuntikohtaisia aineita ei ole vielä merkitty.</div></div></div>";
    }
    const sub = [meta.luokka, meta.koulu].filter(Boolean).join(" · ");
    return backLink()
      + "<h1 class=\"vtitle\"><span class=\"dot\" style=\"background:" + k.color + ";display:inline-block;margin-right:10px;vertical-align:middle\"></span>"
      + esc(k.name) + "</h1>"
      + "<p class=\"lede\">" + esc(day.full) + " · " + esc(range)
      + (sub ? "<br>" + esc(sub) : "") + "</p>"
      + (huom ? "<p class=\"huom\">" + esc(huom) + "</p>" : "")
      + body
      + "<div class=\"btn-row\"><a class=\"btn quiet\" href=\"#/lukujarjestys\">Kaikki lapset</a></div>"
      + footer();
  }

  function renderSchool() {
    const todayKey = helsinkiNow().key;
    const blocks = KIDS.map(k => {
      const meta = HOURS[k.id] || {};
      const days = SCHOOL_DAYS.map(dk => {
        const times = (store.school[k.id] || {})[dk] || {};
        const tunti = ((meta.tunnit) || {})[dk] || {};
        const start = times.start || tunti.alku || "";
        const end = times.end || tunti.loppu || "";
        const aineet = tunti.aineet || [];
        const huom = tunti.huom || "";
        const todayCls = dk === todayKey ? " today" : "";
        const time = (start || end) ? fmtSchool({ start: start, end: end }) : "—";
        const aineHtml = aineet.length
          ? "<div class=\"aineet\">" + aineet.map(function(a, i) {
              return "<span class=\"aine\">" + (i + 1) + ". " + esc(a) + "</span>";
            }).join("") + "</div>"
          : "";
        const huomHtml = huom ? "<div class=\"huom\">" + esc(huom) + "</div>" : "";
        return "<div class=\"dayrow dayprog" + todayCls + "\"><span class=\"da\">" + dayByKey(dk).abbr + "</span>"
          + "<div class=\"prog\"><div class=\"hrs\">" + esc(time) + "</div>" + aineHtml + huomHtml + "</div></div>";
      }).join("");
      const sub = [meta.luokka, meta.koulu].filter(Boolean).join(" · ");
      return "<div class=\"kidblock\"><div class=\"kh\"><span class=\"dot\" style=\"background:" + k.color + "\"></span>"
        + esc(k.name)
        + (sub ? "<span class=\"ks\">" + esc(sub) + "</span>" : "")
        + "</div>" + days + "</div>";
    }).join("");
    return backLink()
      + "<h1 class=\"vtitle\">Lukujärjestykset</h1>"
      + "<p class=\"lede\">Tuntiohjelma Wilmasta. Tämä päivä on korostettu.</p>"
      + blocks
      + footer();
  }

        + "</div>" : "")

  function renderTreenit() {

        ? (+ev.date.slice(8)) + "." + (+ev.date.slice(5, 7)) + "." + ev.date.slice(0, 4)
        : (dayByKey(ev.weekday) || {}).full;
      const pill = driverPill(ev);
      const bits = [ev.place, ev.note, fmtRange(ev.start, ev.end), ev.depart ? "lähtö " + fmtHm(ev.depart) : ""].filter(Boolean);
      const editing = ui.editingId === ev.id;
      return "<div class=\"card\">"
        + "<div class=\"meta\">" + (kid ? esc(kid.name) + " · " : "") + esc(whenNice || "") + "</div>"
        + "<div class=\"ct\">" + (kid ? "<span class=\"dot\" style=\"background:" + kid.color + ";display:inline-block;margin-right:8px;vertical-align:middle\"></span>" : "")
        + esc(ev.title || "Meno") + "</div>"
        + "<div class=\"cs\">" + esc(bits.join(" · ")) + "</div>"
        + (pill ? "<span class=\"pill " + pill.cls + "\">" + esc(pill.text) + "</span>" : "")
        + "<div class=\"btn-row\">"
        + "<button class=\"btn\" type=\"button\" data-act=\"edit-event\" data-id=\"" + esc(ev.id) + "\">Muokkaa</button>"
        + "<button class=\"btn gold\" type=\"button\" data-act=\"show-cancel\" data-id=\"" + esc(ev.id) + "\">Peru päivältä</button>"

        + (ui.cancelFor === ev.id ? "<form data-cancel-form=\"" + esc(ev.id) + "\" style=\"margin-top:10px\">"
          + "<label class=\"f\">Päivä</label><input class=\"inp\" type=\"date\" name=\"date\" value=\"" + helsinkiNow().iso + "\">"
          + "<label class=\"f\">Syy</label><input class=\"inp\" name=\"reason\" placeholder=\"ilmoitettu kyytirinkiin\">"
          + "<div class=\"btn-row\"><button class=\"btn gold\" type=\"submit\">Peru tältä päivältä</button>"
          + "<button class=\"btn quiet\" type=\"button\" data-act=\"show-cancel\" data-id=\"\">Sulje</button></div></form>" : "")
        + (editing ? eventForm(ev, false) : "")

  function setStatus(msg) {
    const el = document.getElementById("status");
    if (el) el.textContent = msg || "";
  }

  function readEventForm(form) {
    const g = name => (form.elements[name] && form.elements[name].value) || "";
    const date = g("date");
    const weekday = g("weekday");
    return {
      who: g("who"),
      title: g("title").trim(),
      weekday: date ? "" : weekday,
      date: date || "",
      start: g("start"),
      end: g("end"),
      depart: g("depart"),
      place: g("place").trim(),
      driver: g("driver").trim(),
      ride: g("ride"),
      status: g("status") || "open",
      kind: g("kind") || "treeni"
    };

  function paint() {
    const root = document.getElementById("app");
    const r = route();
    let html;
    if (r.name === "lukujarjestys") {
      if (r.kid && kidById(r.kid)) {
        const day = r.day || helsinkiNow().key;
        html = renderKidDay(r.kid, day);
      } else html = renderSchool();
    }
    else if (r.name === "treenit") html = renderTreenit();
    else if (r.name === "ruoka") html = renderRuoka();
    else if (r.name === "kauppa") html = renderKauppa();
    else html = renderToday();
    root.innerHTML = html;
  }

  function tickToday() {
    if (route().name !== "tanaan") return;
    const now = helsinkiNow();
    if (now.iso !== lastIso) {
      paint();
      return;
    }
    const list = eventsOn(now.iso, now.key);
    const hero = pickHero(now, list);
    const sig = heroSig(hero);
    if (sig !== lastHeroSig) {
      paint();
      return;
    }
    const cd = document.getElementById("cdtext");
    if (!cd) return;
    if (hero.type === "event") cd.innerHTML = countdownHtml(hero.event, now.minutes);
    else if (hero.type === "pickup") {
      const left = hero.pickup.end - now.minutes;
      cd.innerHTML = "Haku <span class=\"num\">" + durPhrase(left) + "</span> päästä · klo " + fmtHm(hero.pickup.hours.end);
    }
  }

  function onClick(e) {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.getAttribute("data-act");
    const id = t.getAttribute("data-id") || "";

    if (act === "save-school") {
      const next = clone(store.school);
      document.querySelectorAll("[data-kid][data-day][data-which]").forEach(inp => {
        const kid = inp.getAttribute("data-kid");
        const day = inp.getAttribute("data-day");
        const which = inp.getAttribute("data-which");
        if (!next[kid]) next[kid] = {};
        if (!next[kid][day]) next[kid][day] = {};
        next[kid][day][which] = inp.value || "";
      });
      Object.keys(next).forEach(kid => {
        Object.keys(next[kid]).forEach(day => {
          const h = next[kid][day];
          if (!h.start && !h.end) delete next[kid][day];
        });
      });
      store.school = next;
      saveStore();
      setStatus("Tallennettu");
      return;
    }

    if (act === "save-meals") {
      const next = clone(store.meals);
      document.querySelectorAll("[data-meal][data-field]").forEach(inp => {
        const day = inp.getAttribute("data-meal");
        const field = inp.getAttribute("data-field");
        if (!next[day]) next[day] = { emoji: "", dish: "", note: "", cook: "" };
        next[day][field] = inp.value;
      });
      store.meals = next;
      saveStore();
      setStatus("Tallennettu");
      return;
    }

    if (act === "edit-event") {
      ui.editingId = ui.editingId === id ? null : id;
      ui.adding = false;
      paint();
      return;
    }
    if (act === "add-event") {
      ui.adding = true;
      ui.editingId = null;
      paint();
      return;
    }
    if (act === "edit-cancel") {
      ui.adding = false;
      ui.editingId = null;
      paint();
      return;
    }
    if (act === "show-cancel") {
      ui.cancelFor = id || null;
      paint();
      return;
    }
    if (act === "delete-event") {
      if (!confirm("Poistetaanko tämä meno?")) return;
      store.events = store.events.filter(ev => ev.id !== id);
      saveStore();
      ui.editingId = null;
      paint();
      return;
    }
    if (act === "uncancel") {
      const date = t.getAttribute("data-date");
      const ev = store.events.find(x => x.id === id);
      if (ev && ev.cancelledByDate) {
        delete ev.cancelledByDate[date];
        saveStore();
        paint();
      }
      return;
    }
    if (act === "unnote") {
      const date = t.getAttribute("data-date");
      const ev = store.events.find(x => x.id === id);
      if (ev && ev.notesByDate) {
        delete ev.notesByDate[date];
        saveStore();
        paint();
      }
      return;
    }
    if (act === "toggle-g") {
      const g = store.groceries.find(x => x.id === id);
      if (g) {
        g.done = !g.done;
        saveStore();
        paint();
      }
      return;
    }
    if (act === "clear-g") {
      store.groceries = store.groceries.filter(x => !x.done);
      saveStore();
      paint();
    }
  }

  function onSubmit(e) {
    const form = e.target;
    if (!(form instanceof HTMLFormElement)) return;

    if (form.hasAttribute("data-add-g")) {
      e.preventDefault();
      const text = (form.elements.text.value || "").trim();
      if (!text) return;
      store.groceries.push({ id: nid(), text: text, done: false });
      saveStore();
      paint();
      return;
    }

    if (form.hasAttribute("data-cancel-form")) {
      e.preventDefault();
      const id = form.getAttribute("data-cancel-form");
      const date = form.elements.date.value;
      const reason = (form.elements.reason.value || "").trim();
      const ev = store.events.find(x => x.id === id);
      if (ev && date) {
        if (!ev.cancelledByDate) ev.cancelledByDate = {};
        ev.cancelledByDate[date] = reason || "peruttu";
        saveStore();
        ui.cancelFor = null;
        paint();
      }
      return;
    }

    if (form.hasAttribute("data-event-form")) {
      e.preventDefault();
      const id = form.getAttribute("data-event-form");
      const isNew = form.getAttribute("data-new") === "1";
      const fields = readEventForm(form);
      if (isNew) {
        store.events.push(Object.assign({
          id: nid(),
          notesByDate: {},
          cancelledByDate: {}
        }, fields));
      } else {
        const ev = store.events.find(x => x.id === id);
        if (ev) Object.assign(ev, fields);
      }
      saveStore();
      ui.adding = false;
      ui.editingId = null;
      paint();
    }
  }

  async function init() {
    const root = document.getElementById("app");
    root.addEventListener("click", onClick);
    root.addEventListener("submit", onSubmit);
    window.addEventListener("hashchange", paint);
    paint();
    const now = helsinkiNow();
    const tom = addCalendarDays(now.year, now.month, now.day, 1);
    const tomIso = pad(tom.year, 4) + "-" + pad(tom.month, 2) + "-" + pad(tom.day, 2);
    await loadWeather(now.iso, tomIso);
    if (route().name === "tanaan") {
      const wx = document.getElementById("wx");
      const wx2 = document.getElementById("wx2");
      if (wx) wx.innerHTML = renderWeather("today");
      if (wx2) wx2.innerHTML = renderWeather("tomorrow");
    }
    setInterval(tickToday, 30000);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

  </script>
</body>
