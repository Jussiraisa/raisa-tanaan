<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#0a0b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Räisä · Mökki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0e;
      --surface: #12141a;
      --surface-2: #171a21;
      --line: rgba(255,255,255,.06);
      --text: #f4f0e8;
      --muted: #8a8478;
      --dim: #5c574e;
      --teal: #4ecdc4;
      --teal-dim: rgba(78,205,196,.12);
      --teal-line: rgba(78,205,196,.22);
      --gold: #c6a15a;
      --warm: #e3c36a;
      --warm-dim: rgba(227,195,106,.12);
      --blue: #7eb8e0;
      --blue-dim: rgba(126,184,224,.12);
      --danger: #ff8a80;
      --serif: "Instrument Serif", ui-serif, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --pad: clamp(16px, 2.4vw, 36px);
      --gap: clamp(10px, 1.4vw, 18px);
      --r: clamp(14px, 1.6vw, 22px);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      background: var(--bg); color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(90% 70% at 8% -10%, rgba(30,58,52,.35) 0%, transparent 55%),
        radial-gradient(70% 50% at 100% 0%, rgba(30,40,58,.22) 0%, transparent 45%),
        var(--bg);
    }
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .when {
      margin-top: 6px;
      font-size: clamp(18px, 2.4vw, 26px);
      font-weight: 650;
      letter-spacing: -.02em;
    }
    .live {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--teal);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px var(--teal-dim);
    }
    .live.off { color: var(--danger); }
    .live.off .dot { background: var(--danger); box-shadow: 0 0 0 4px rgba(255,138,128,.15); }
    .clock-wrap { text-align: right; }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: -.06em;
      line-height: .85;
      color: #fff;
    }
    .temps {
      margin-top: 8px;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 700;
      color: var(--muted);
    }
    .temps b { color: var(--text); font-weight: 800; }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%),
        radial-gradient(120% 140% at 0% 0%, #16352f 0%, var(--surface) 58%);
      border: 1px solid var(--teal-line);
      border-radius: calc(var(--r) + 4px);
      padding: clamp(20px, 3vw, 36px);
    }
    .hero.ev {
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%),
        radial-gradient(120% 140% at 0% 0%, #12283a 0%, var(--surface) 58%);
      border-color: rgba(126,184,224,.22);
    }
    .hero.hot {
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%),
        radial-gradient(120% 140% at 0% 0%, #3a2e12 0%, var(--surface) 58%);
      border-color: rgba(227,195,106,.22);
    }
    .hero-lbl {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--teal);
    }
    .hero.ev .hero-lbl { color: var(--blue); }
    .hero.hot .hero-lbl { color: var(--warm); }
    .hero-kw {
      font-family: var(--serif);
      font-size: clamp(64px, 14vw, 120px);
      font-weight: 400;
      letter-spacing: -.05em;
      line-height: .9;
      margin-top: 4px;
      color: #fff;
    }
    .hero-kw span {
      font-size: .38em;
      letter-spacing: 0;
      color: var(--muted);
      margin-left: .12em;
    }
    .hero-say {
      margin-top: 10px;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 650;
      color: var(--muted);
      max-width: 28ch;
    }
    .badge {
      position: absolute;
      top: clamp(16px, 2vw, 24px);
      right: clamp(16px, 2vw, 24px);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      background: var(--teal-dim);
      color: var(--teal);
      border: 1px solid var(--teal-line);
    }
    .hero.ev .badge { background: var(--blue-dim); color: var(--blue); border-color: rgba(126,184,224,.22); }
    .hero.hot .badge { background: var(--warm-dim); color: var(--warm); border-color: rgba(227,195,106,.22); }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: var(--gap);
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .ilp-card { grid-column: 1 / -1; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: clamp(16px, 2vw, 22px);
      min-height: 120px;
    }
    .card-lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 10px;
    }
    .card-val {
      font-family: var(--serif);
      font-size: clamp(36px, 6vw, 52px);
      line-height: .95;
      letter-spacing: -.03em;
    }
    .card-sub {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 650;
      color: var(--muted);
      line-height: 1.35;
    }

    .ilp-card {
      background:
        linear-gradient(180deg, rgba(255,255,255,.02), transparent),
        var(--surface);
      border-color: var(--teal-line);
    }
    .ilp-card.on { border-color: rgba(78,205,196,.35); }
    .ilp-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .ilp-state {
      font-size: 13px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      color: var(--muted);
    }
    .ilp-card.on .ilp-state {
      background: var(--teal-dim);
      color: var(--teal);
    }
    .ilp-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .metric {
      background: rgba(0,0,0,.22);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .metric .m-lbl {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .metric .m-val {
      margin-top: 4px;
      font-family: var(--serif);
      font-size: clamp(22px, 3.5vw, 28px);
      line-height: 1;
    }

    .flags {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
    }
    .flag {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: clamp(16px, 2vw, 20px);
      transition: border-color .2s, background .2s;
    }
    .flag.on {
      background: #0e1a24;
      border-color: rgba(126,184,224,.28);
    }
    .flag.hot.on {
      background: #1a1508;
      border-color: rgba(227,195,106,.28);
    }
    .flag .name {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .flag.on .name { color: var(--blue); }
    .flag.hot.on .name { color: var(--warm); }
    .flag .state {
      font-family: var(--serif);
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1;
      margin-top: 6px;
    }

    .lights {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: clamp(14px, 1.8vw, 18px) clamp(16px, 2vw, 22px);
    }
    .lights-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .lights .card-lbl { margin-bottom: 0; flex: 0 0 auto; }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
    }
    .pill {
      font-size: 14px;
      font-weight: 800;
      color: var(--teal);
      background: var(--teal-dim);
      border: 1px solid var(--teal-line);
      border-radius: 999px;
      padding: 8px 14px;
    }
    .empty {
      color: var(--dim);
      font-size: 14px;
      font-weight: 650;
    }

    .foot {
      margin-top: auto;
      padding-top: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      font-weight: 650;
      color: var(--dim);
    }
    .foot .stale { color: var(--danger); }
    .foot a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 800;
      padding: 10px 16px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--teal-line);
      background: var(--teal-dim);
    }
    .foot a:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
    }

    /* TV / large screens: fill viewport like a dashboard */
    @media (min-width: 900px) and (min-height: 700px) {
      .shell {
        max-width: none;
        height: 100vh;
        height: 100dvh;
        padding: 2.2vh 3vw 1.8vh;
        gap: 1.4vh;
      }
      .hero-kw { font-size: 14vh; }
      .clock { font-size: 9vh; }
      .card-val { font-size: 6vh; }
      .flag .state { font-size: 4.5vh; }
      .metric .m-val { font-size: 3.4vh; }
      .card, .flag, .lights, .hero { min-height: 0; }
      .grid { flex: 1; align-content: stretch; }
      .ilp-card, .card { display: flex; flex-direction: column; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app" role="main">Räisä · Mökki</div>
  <script>
(function () {
  var DAYS = ["Sunnuntai","Maanantai","Tiistai","Keskiviikko","Torstai","Perjantai","Lauantai"];
  var DATA = null;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function helsinkiNow() {
    var d = new Date(new Date().getTime() + 3 * 3600 * 1000);
    return { wd: d.getUTCDay(), day: d.getUTCDate(), month: d.getUTCMonth() + 1, hour: d.getUTCHours(), minute: d.getUTCMinutes() };
  }
  function num(n, d) {
    if (n == null || isNaN(Number(n))) return "—";
    return Number(n).toFixed(d == null ? 0 : d).replace(".", ",");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }
  function getJSON(url, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { cb(JSON.parse(x.responseText)); } catch (e) {}
      }
    };
    x.send();
  }
  function ageLabel(updated) {
    if (!updated) return "ei päivitystä";
    var mins = Math.round((Date.now() - Number(updated)) / 60000);
    if (mins < 1) return "juuri nyt";
    if (mins < 60) return mins + " min sitten";
    var h = Math.round(mins / 60);
    if (h < 48) return h + " h sitten";
    return Math.round(h / 24) + " pv sitten";
  }

  function paint() {
    var now = helsinkiNow();
    var d = DATA || {};
    var power = Number(d.powerW) || 0;
    var kw = power / 1000;
    var ev = !!d.evCharge;
    var sauna = !!d.sauna;
    var heroClass = sauna ? "hot" : (ev ? "ev" : "");
    var heroLbl = sauna ? "Sauna päällä" : (ev ? "Lataus + kulutus" : "Sähköä nyt");
    var heroVal = kw >= 0.1
      ? (num(kw, kw >= 10 ? 1 : 2) + "<span>kW</span>")
      : (Math.round(power) + "<span>W</span>");
    var lightNames = d.lightsOn || [];
    var watts = d.lightWatts || {};
    var lightSay = lightNames.length
      ? (lightNames.length + " valo" + (lightNames.length === 1 ? "" : "a") + " päällä")
      : "Ei valoja päällä";
    var badgeTxt = d.online === false
      ? "Offline"
      : ((d.deviceCount || "?") + " laitetta");

    var pills = "";
    var i;
    if (!lightNames.length) {
      pills = "<span class=\"empty\">Ei valoja päällä</span>";
    } else {
      for (i = 0; i < lightNames.length; i++) {
        var n = lightNames[i];
        var w = watts[n];
        var label = n + (w != null && Number(w) > 0 ? " · " + num(w, w < 10 ? 0 : 1) + " W" : "");
        pills += "<span class=\"pill\">" + esc(label) + "</span>";
      }
    }

    var ilp = d.ilp || null;
    var ilpOn = ilp && !!ilp.on;
    var ilpMode = ilp && ilp.mode ? ilp.mode : "—";
    var modeFi = ({ Heat: "Lämmitys", Cool: "Jäähdytys", Auto: "Auto", Fan: "Puhallus", Dry: "Kuivaus" })[ilpMode] || ilpMode;

    var age = ageLabel(d.updated);
    var stale = d.updated && (Date.now() - Number(d.updated) > 30 * 60 * 1000);

    document.getElementById("app").innerHTML =
      "<header class=\"top\">"
      + "<div><div class=\"brand\">Räisä · Mökki</div>"
      + "<div class=\"when\">" + DAYS[now.wd] + " " + now.day + "." + now.month + ".</div>"
      + "<div class=\"live" + (d.online === false ? " off" : "") + "\"><span class=\"dot\" aria-hidden=\"true\"></span>"
      + (d.online === false ? "Offline" : "Verkossa") + "</div></div>"
      + "<div class=\"clock-wrap\"><div class=\"clock\" id=\"clock\">" + pad(now.hour) + "." + pad(now.minute) + "</div>"
      + "<div class=\"temps\">sisä <b>" + num(d.indoorC, 1) + "°</b> · ulko <b>" + num(d.outdoorC, 1) + "°</b></div></div>"
      + "</header>"

      + "<section class=\"hero " + heroClass + "\" aria-label=\"Teho\">"
      + "<div class=\"hero-lbl\">" + heroLbl + "</div>"
      + "<div class=\"hero-kw\">" + heroVal + "</div>"
      + "<div class=\"badge\">" + esc(badgeTxt) + "</div>"
      + "<div class=\"hero-say\">" + esc(lightSay)
      + (ev ? " · auto lataa" : "")
      + (sauna ? " · sauna" : "")
      + "</div></section>"

      + "<section class=\"grid\" aria-label=\"Tila\">"
      + "<article class=\"card ilp-card" + (ilpOn ? " on" : "") + "\">"
      + "<div class=\"ilp-head\"><div class=\"card-lbl\">ILP</div>"
      + "<div class=\"ilp-state\">" + (ilp ? (ilpOn ? "Päällä" : "Pois") : "—") + "</div></div>"
      + "<div class=\"card-val\">" + (ilpOn ? esc(modeFi) : "Pois") + "</div>"
      + "<div class=\"ilp-metrics\">"
      + "<div class=\"metric\"><div class=\"m-lbl\">Tila</div><div class=\"m-val\">" + esc(modeFi) + "</div></div>"
      + "<div class=\"metric\"><div class=\"m-lbl\">Tavoite</div><div class=\"m-val\">" + (ilp && ilp.setC != null ? num(ilp.setC, 0) + "°" : "—") + "</div></div>"
      + "<div class=\"metric\"><div class=\"m-lbl\">Sisä</div><div class=\"m-val\">" + (ilp && ilp.indoorC != null ? num(ilp.indoorC, 0) + "°" : "—") + "</div></div>"
      + "</div></article>"

      + "<article class=\"card\"><div class=\"card-lbl\">Sisällä</div>"
      + "<div class=\"card-val\">" + num(d.indoorC, 1) + "°</div>"
      + "<div class=\"card-sub\">ulko " + num(d.outdoorC, 1) + "°</div></article>"

      + "<article class=\"card\"><div class=\"card-lbl\">Ulkona</div>"
      + "<div class=\"card-val\">" + num(d.outdoorC, 1) + "°</div>"
      + "<div class=\"card-sub\">" + Math.round(power) + " W nyt</div></article>"
      + "</section>"

      + "<section class=\"flags\" aria-label=\"EV ja sauna\">"
      + "<div class=\"flag" + (ev ? " on" : "") + "\"><div class=\"name\">EV-lataus</div>"
      + "<div class=\"state\">" + (ev ? "Päällä" : "Pois") + "</div></div>"
      + "<div class=\"flag hot" + (sauna ? " on" : "") + "\"><div class=\"name\">Sauna</div>"
      + "<div class=\"state\">" + (sauna ? "Päällä" : "Pois") + "</div></div>"
      + "</section>"

      + "<section class=\"lights\" aria-label=\"Valot\">"
      + "<div class=\"lights-row\"><div class=\"card-lbl\">Valot</div>"
      + "<div class=\"pills\">" + pills + "</div></div></section>"

      + "<footer class=\"foot\">"
      + "<span class=\"" + (stale ? "stale" : "") + "\">Päivitetty " + esc(age)
      + (d.capturedAt ? " · " + esc(String(d.capturedAt).replace("T", " ").substr(0, 16)) : "")
      + "</span>"
      + "<a href=\"mokki-ohjaus.html\">Ohjaa</a>"
      + "</footer>";
  }

  function tickClock() {
    var el = document.getElementById("clock");
    if (!el) return;
    var now = helsinkiNow();
    el.textContent = pad(now.hour) + "." + pad(now.minute);
  }
  function pull() {
    getJSON("https://raw.githubusercontent.com/Jussiraisa/raisa-tanaan/main/mokki.json?t=" + new Date().getTime(), function (data) {
      DATA = data;
      paint();
    });
  }
  paint();
  pull();
  setInterval(tickClock, 1000);
  setInterval(pull, 5000);
})();
  </script>
</body>
</html>
