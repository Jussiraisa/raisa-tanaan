<script>(function(){
var stage=document.getElementById('stage'),slides=[].slice.call(document.querySelectorAll('.slide'));
var n=slides.length,cur=-1,timer=null,paused=false,t0=0,remain=0;
var q=new URLSearchParams(location.search);
var rq=(q.get('rotate')||'auto').toLowerCase();function fit(){var W=innerWidth,H=innerHeight,rot=0;if(rq==='cw'||rq==='1')rot=90;else if(rq==='ccw')rot=-90;else if(rq==='auto'&&H>W*1.05)rot=90;var s=rot?Math.min(H/1920,W/1080):Math.min(W/1920,H/1080);stage.style.transform=(rot?'rotate('+rot+'deg) ':'')+'scale('+s+')';document.body.setAttribute('data-rot',rot);}
addEventListener('resize',fit);fit();
function load(i){i=(i+n)%n;[].forEach.call(slides[i].querySelectorAll('img[data-src]'),function(im){if(!im.getAttribute('src'))im.src=im.dataset.src;});}
function unload(i){i=(i+n)%n;[].forEach.call(slides[i].querySelectorAll('img[data-src]'),function(im){if(im.getAttribute('src'))im.removeAttribute('src');});}
function show(i){
  i=(i+n)%n;if(i===cur)return;
  var prev=cur;cur=i;load(i);load(i+1);load(i+2);
  slides.forEach(function(s,k){if(k!==i&&k!==prev)s.classList.remove('on','off');});
  if(prev>=0){slides[prev].classList.remove('on');slides[prev].classList.add('off');
    setTimeout(function(){if(cur!==prev)slides[prev].classList.remove('off');},2200);}
  void slides[i].offsetWidth;slides[i].classList.add('on');
  for(var k=3;k<n-3;k++)unload(i-k);
  remain=+slides[i].dataset.dur||6500;start();
}
function start(){clearTimeout(timer);if(paused)return;t0=Date.now();timer=setTimeout(function(){show(cur+1);},remain);}
function setPause(p){paused=p;document.body.classList.toggle('paused',p);if(p){clearTimeout(timer);remain-=Date.now()-t0;}else start();}
addEventListener('keydown',function(e){var k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'){e.preventDefault();if(paused)setPause(false);show(cur+1);}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();if(paused)setPause(false);show(cur-1);}
  else if(k===' '||k==='Spacebar'||k==='MediaPlayPause'||k==='Enter'){e.preventDefault();setPause(!paused);}
  else if(k==='Home'){show(0);}
  else if(k==='f'||k==='F'){if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen();}
});

})();
