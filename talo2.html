<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Räisä · Talo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #08090c; color: #f3efe6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    * { box-sizing: border-box }
    .tv { height: 100vh; width: 100vw; padding: 1.8vh 2.2vw 1.6vh; display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column; }
    .head { display: -ms-flexbox; display: flex; -ms-flex-pack: justify; justify-content: space-between; -ms-flex-align: start; align-items: flex-start; margin-bottom: 1.4vh; }
    .kicker { font-size: 1.7vmin; font-weight: 800; letter-spacing: .34em; text-transform: uppercase; color: #c6a15a; }
    .date { font-size: 3.4vmin; margin-top: .35vh; font-weight: 650; }
    .chip { margin-top: .5vh; font-size: 2.1vmin; font-weight: 800; color: #3ec4b2; }
    .right { text-align: right; }
    .clock { font-size: 9vmin; font-weight: 700; letter-spacing: -.08em; line-height: .8; font-variant-numeric: tabular-nums; color: #fff; }
    .wx { margin-top: .7vh; font-size: 2.6vmin; font-weight: 700; color: #d9d3c6; }
    .wx b { font-size: 3.4vmin; }
    .hero {
      -ms-flex: 0 0 auto; flex: 0 0 auto;
      background: radial-gradient(120% 140% at 0% 0%, #16352f 0%, #101318 55%);
      border: 1px solid #1e2a28; border-radius: 1.6vmin;
      padding: 2vh 2.2vw 1.8vh; position: relative; overflow: hidden;
    }
    .hero.sun { background: radial-gradient(120% 140% at 0% 0%, #3a2e12 0%, #101318 58%); border-color: #4a3a18; }
    .hero.bad { background: radial-gradient(120% 140% at 0% 0%, #3a1518 0%, #101318 58%); border-color: #5a2228; }
    .hero .lbl { font-size: 1.8vmin; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: #3ec4b2; }
    .hero.sun .lbl { color: #e3c36a; }
    .hero.bad .lbl { color: #ff8a80; }
    .hero .w {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 13.5vmin; font-weight: 400; letter-spacing: -.05em; line-height: .88; margin-top: .3vh;
    }
    .hero .say { font-size: 3vmin; font-weight: 700; color: #c9c3b5; margin-top: .6vh; }
    .badge {
      position: absolute; top: 2vh; right: 2vw;
      padding: .7vh 1.3vw; border-radius: 999px; font-size: 2.2vmin; font-weight: 800;
    }
    .badge.ok { background: #123028; color: #7ee0d0; }
    .badge.sun { background: #3a2e12; color: #e3c36a; }
    .badge.bad { background: #3a1515; color: #ff8a80; }
    .mid { display: -ms-flexbox; display: flex; gap: 1.2vw; margin-top: 1.4vh; -ms-flex: 1; flex: 1; min-height: 0; }
    .cars { -ms-flex: 1.15; flex: 1.15; display: -ms-flexbox; display: flex; gap: 1.2vw; }
    .car {
      -ms-flex: 1; flex: 1; min-width: 0;
      background: #12141a; border: 1px solid #22252e; border-radius: 1.4vmin;
      padding: 1.6vh 1.4vw 1.5vh; display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column;
    }
    .car.home { border-color: #1e5c50; box-shadow: inset 0 0 0 1px rgba(62,196,178,.18); }
    .plate {
      display: -ms-flexbox; display: flex; -ms-flex-align: stretch; align-items: stretch;
      height: 7.2vmin; border-radius: .55vmin; overflow: hidden; background: #f4f1e8; color: #111;
    }
    .eu { width: 3.1vw; background: #003399; color: #fc0; display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column; -ms-flex-pack: center; justify-content: center; -ms-flex-align: center; align-items: center; font-weight: 800; font-size: 1.3vmin; letter-spacing: .04em; }
    .eu span { font-size: 2.4vmin; color: #fff; line-height: 1; }
    .reg { -ms-flex: 1; flex: 1; display: -ms-flexbox; display: flex; -ms-flex-align: center; align-items: center; -ms-flex-pack: center; justify-content: center; font-size: 4.4vmin; font-weight: 800; letter-spacing: .14em; }
    .cname { margin-top: 1.1vh; font-size: 2.1vmin; color: #9a9486; font-weight: 700; }
    .where { margin-top: auto; padding-top: 1vh; font-size: 2.8vmin; font-weight: 800; color: #3ec4b2; }
    .where.off { color: #c6a15a; }
    .side { -ms-flex: 1; flex: 1; min-width: 0; display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column; gap: 1.1vh; }
    .grid { display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap; gap: 1.1vh; }
    .stat {
      width: calc(50% - .55vh); background: #12141a; border: 1px solid #22252e; border-radius: 1.2vmin;
      padding: 1.3vh 1.3vw 1.2vh;
    }
    .stat .lbl { font-size: 1.45vmin; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: #3ec4b2; }
    .stat .v { font-family: "Instrument Serif", Georgia, serif; font-size: 4.8vmin; line-height: .95; margin-top: .25vh; }
    .stat .s { font-size: 1.85vmin; color: #9a9486; font-weight: 650; margin-top: .2vh; }
    .onbox { background: #12141a; border: 1px solid #22252e; border-radius: 1.2vmin; padding: 1.3vh 1.3vw; -ms-flex: 1; flex: 1; }
    .onbox .lbl { font-size: 1.45vmin; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: #3ec4b2; margin-bottom: .6vh; }
    .pills { display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap; gap: .7vh .8vw; }
    .pill { font-size: 2.4vmin; font-weight: 800; color: #7ee0d0; background: #123028; border-radius: 999px; padding: .55vh 1.1vw; }
    .empty { color: #6d685c; font-size: 2.3vmin; font-weight: 650; }
    .alert { margin-top: 1.2vh; padding: 1.3vh 1.7vw; background: #16120c; border: 2px solid #c6a15a; border-radius: 1.2vmin; font-size: 2.5vmin; font-weight: 800; }
  </style>
</head>
<body>
  <div class="tv" id="app">Räisä · Talo</div>
  <script>
(function () {
  var DAYS = ["Sunnuntai","Maanantai","Tiistai","Keskiviikko","Torstai","Perjantai","Lauantai"];
  var DATA = null;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function helsinkiNow() {
    var d = new Date(new Date().getTime() + 3 * 3600 * 1000);
    return { wd: d.getUTCDay(), day: d.getUTCDate(), month: d.getUTCMonth() + 1, hour: d.getUTCHours(), minute: d.getUTCMinutes() };
  }
  function num(n, d) {
    if (n == null || isNaN(Number(n))) return "—";
    return Number(n).toFixed(d == null ? 0 : d).replace(".", ",");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }
  function getJSON(url, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { cb(JSON.parse(x.responseText)); } catch (e) {}
      }
    };
    x.send();
  }

  function paint() {
    var now = helsinkiNow();
    var d = DATA || {};
    var solar = Number(d.solarW) || 0;
    var power = Number(d.powerW) || 0;
    var surplus = solar > power + 50;
    var heroClass = surplus ? "sun" : (d.priceLevel === "kallis" ? "bad" : "");
    var heroLbl = surplus ? "Aurinko myy" : (d.priceLevel === "kallis" ? "Sähkö kallista" : "Sähköä nyt");
    var heroVal = surplus ? (Math.round(solar) + " W") : (Math.round(power) + " W");
    var heroSay = surplus
      ? "Talo " + Math.round(power) + " W · myyntiä tänään " + num(d.soldToday, 2) + " €"
      : "Tänään " + num(d.costToday, 2) + " €" + (d.kwhToday ? " · " + num(d.kwhToday, 1) + " kWh" : "");
    var badgeClass = surplus ? "sun" : (d.priceLevel === "kallis" ? "bad" : "ok");
    var badgeTxt = surplus
      ? "Omavaraisuus " + Math.round(d.selfPct || 0) + " %"
      : (d.priceLevel === "kallis" ? "Sähkö kallista · " : "Sähkö ok · ") + num(d.priceSnt, 1) + " snt/kWh";

    var cars = d.cars || [];
    var carHtml = "";
    var i;
    for (i = 0; i < cars.length; i++) {
      var c = cars[i];
      var home = c.known && String(c.where || "").toLowerCase().indexOf("koto") >= 0;
      carHtml += "<div class=\"car" + (home ? " home" : "") + "\">"
        + "<div class=\"plate\"><div class=\"eu\">FIN<span>FIN</span></div><div class=\"reg\">" + esc(c.plate) + "</div></div>"
        + "<div class=\"cname\">" + esc(c.name || "Auto") + "</div>"
        + "<div class=\"where" + (c.known ? "" : " off") + "\">" + esc(c.where || "") + "</div></div>";
    }

    var lights = (d.lightsOn || []).slice();
    if (d.saunaOn) lights.unshift("Sauna");
    var pills = "";
    if (!lights.length) pills = "<div class=\"empty\">Ei kuormia päällä</div>";
    for (i = 0; i < lights.length; i++) {
      pills += "<span class=\"pill\">" + esc(lights[i]) + "</span>";
    }

    var alerts = d.alerts || [];
    var alertOne = "";
    if (surplus) alertOne = "Aurinkoylijäämää — käytä se itse";
    else if (d.priceLevel === "kallis") alertOne = "Sähkö kallista — vältä isoja kuormia";
    else if (alerts.length) alertOne = alerts[0];

    document.getElementById("app").innerHTML =
      "<div class=\"head\"><div><div class=\"kicker\">Räisä · Talo</div>"
      + "<div class=\"date\">" + DAYS[now.wd] + " " + now.day + "." + now.month + ".</div>"
      + "<div class=\"chip\">" + (d.home ? "Perhe kotona" : "Poissa") + (d.online ? " · koti verkossa" : "") + "</div></div>"
      + "<div class=\"right\"><div class=\"clock\" id=\"clock\">" + pad(now.hour) + "." + pad(now.minute) + "</div>"
      + "<div class=\"wx\">" + esc(d.weatherIcon || "") + " <b>" + num(d.outC, 1) + "°</b> ulkona · " + esc(d.weather || "") + "</div></div></div>"
      + "<div class=\"hero " + heroClass + "\"><div class=\"lbl\">" + heroLbl + "</div>"
      + "<div class=\"w\">" + heroVal + "</div>"
      + "<div class=\"badge " + badgeClass + "\">" + badgeTxt + "</div>"
      + "<div class=\"say\">" + heroSay + "</div></div>"
      + "<div class=\"mid\"><div class=\"cars\">" + carHtml + "</div>"
      + "<div class=\"side\"><div class=\"grid\">"
      + "<div class=\"stat\"><div class=\"lbl\">Sisällä</div><div class=\"v\">" + num(d.inC, 1) + "°</div><div class=\"s\">tavoite " + num(d.targetC, 1) + "°</div></div>"
      + "<div class=\"stat\"><div class=\"lbl\">Aurinko</div><div class=\"v\">" + Math.round(solar) + " W</div><div class=\"s\">pörssi " + num(d.spotSnt, 1) + " snt</div></div>"
      + "<div class=\"stat\"><div class=\"lbl\">Lämpövarasto</div><div class=\"v\">" + Math.round(d.heatStoreH || 0) + " h</div><div class=\"s\">" + Math.round(d.heatStorePct || 0) + " % · vesi " + num(d.dhwC, 0) + "°</div></div>"
      + "<div class=\"stat\"><div class=\"lbl\">Tänään</div><div class=\"v\">" + num(d.costToday, 2) + " €</div><div class=\"s\">myynti " + num(d.soldToday, 2) + " €</div></div>"
      + "</div><div class=\"onbox\"><div class=\"lbl\">Päällä</div><div class=\"pills\">" + pills + "</div></div></div></div>"
      + (alertOne ? "<div class=\"alert\">" + esc(alertOne) + "</div>" : "");
  }

  function tickClock() {
    var el = document.getElementById("clock");
    if (!el) return;
    var now = helsinkiNow();
    el.innerHTML = pad(now.hour) + "." + pad(now.minute);
  }
  function pull() {
    getJSON("https://raw.githubusercontent.com/Jussiraisa/raisa-tanaan/main/ha.json?t=" + new Date().getTime(), function (data) {
      DATA = data;
      paint();
    });
  }
  paint();
  pull();
  setInterval(tickClock, 1000);
  setInterval(pull, 5000);
})();
  </script>
</body>
</html>
