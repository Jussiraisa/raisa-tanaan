<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Räisä · Tänään</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #070707; color: #f2eee4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    * { box-sizing: border-box }
    .tv {
      height: 100vh; width: 100vw;
      padding: 3.2vh 3.4vw 2.6vh;
      display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column;
    }
    .head { display: -ms-flexbox; display: flex; -ms-flex-pack: justify; justify-content: space-between; -ms-flex-align: start; align-items: flex-start; }
    .kicker { font-size: 1.4vmin; font-weight: 800; letter-spacing: .32em; text-transform: uppercase; color: #c6a15a; }
    .date { font-size: 2.6vmin; margin-top: .5vh; color: #c9c3b5; font-weight: 600; }
    .ticker { margin-top: .8vh; font-size: 1.55vmin; color: #7d786c; font-weight: 600; }
    .clock { font-size: 10.5vmin; font-weight: 650; letter-spacing: -.07em; line-height: .8; font-variant-numeric: tabular-nums; color: #fff; text-align: right; }
    .wx { margin-top: .8vh; font-size: 1.6vmin; color: #8a8578; font-weight: 600; text-align: right; }
    .main { -ms-flex: 1; flex: 1; min-height: 0; margin: 2.4vh 0 2vh; display: -ms-flexbox; display: flex; gap: 1.8vw; }
    .now, .next {
      background: #111; border: 1px solid #1d1d1d; border-radius: 1.3vmin; min-height: 0;
    }
    .now { -ms-flex: 1.15; flex: 1.15; padding: 2.4vh 2vw 2.2vh; display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column; }
    .next { -ms-flex: .85; flex: .85; padding: 2.6vh 2.3vw; display: -ms-flexbox; display: flex; -ms-flex-direction: column; flex-direction: column; -ms-flex-pack: center; justify-content: center; }
    .lbl { font-size: 1.35vmin; font-weight: 800; letter-spacing: .28em; text-transform: uppercase; color: #3ec4b2; margin-bottom: 1.3vh; }
    .word { font-family: Georgia, "Times New Roman", serif; font-size: 6.4vmin; line-height: .95; letter-spacing: -.03em; }
    .kids { -ms-flex: 1; flex: 1; display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap; gap: 1.1vh 1.1vw; margin-top: 2vh; }
    .kid {
      width: 48%; -ms-flex: 1 1 40%; flex: 1 1 40%;
      background: #0b0b0b; border-radius: .9vmin; padding: 1.5vh 1.3vw 1.4vh;
      border-left: .45vw solid #555;
    }
    .kid .nm { font-size: 1.7vmin; font-weight: 800; color: #aea89b; }
    .kid .hrs { font-size: 3.3vmin; font-weight: 650; margin-top: .4vh; letter-spacing: -.03em; }
    .when { font-size: 7.2vmin; font-weight: 650; color: #c6a15a; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
    .who { font-family: Georgia, "Times New Roman", serif; font-size: 4.6vmin; line-height: 1.05; margin-top: 1.2vh; }
    .place { font-size: 2.1vmin; color: #b7b1a3; margin-top: 1.3vh; font-weight: 600; }
    .drive { font-size: 2.3vmin; font-weight: 800; color: #3ec4b2; margin-top: 1.1vh; }
    .drive.warn { color: #c6a15a; }
    .cd { margin-top: 1.6vh; font-size: 2vmin; font-weight: 700; color: #8a8578; }
    .cd b { color: #c6a15a; }
    .foot { display: -ms-flexbox; display: flex; gap: 2vw; -ms-flex-align: end; align-items: flex-end; }
    .later { -ms-flex: 1.3; flex: 1.3; }
    .food { -ms-flex: .8; flex: .8; }
    .row { display: -ms-flexbox; display: flex; -ms-flex-align: baseline; align-items: baseline; gap: 1.3vw; padding: .55vh 0; font-size: 2.05vmin; }
    .tm { width: 12.5vmin; -ms-flex: none; flex: none; font-weight: 800; color: #c6a15a; font-variant-numeric: tabular-nums; }
    .what { font-weight: 700; }
    .meta { color: #8a8578; font-weight: 600; }
    .dish { font-family: Georgia, "Times New Roman", serif; font-size: 3.3vmin; }
    .cook { margin-top: .6vh; font-size: 1.8vmin; font-weight: 800; color: #3ec4b2; }
    .note { margin-top: 1vh; font-size: 1.8vmin; color: #c9c3b5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="tv" id="app">Räisän perhe</div>
  <script>
(function () {
  var DAYS = [
    { key: "su", full: "Sunnuntai" }, { key: "ma", full: "Maanantai" }, { key: "ti", full: "Tiistai" },
    { key: "ke", full: "Keskiviikko" }, { key: "to", full: "Torstai" }, { key: "pe", full: "Perjantai" }, { key: "la", full: "Lauantai" }
  ];
  var KIDS = [
    { id: "ellen", name: "Ellen", color: "#e07a55" },
    { id: "samuel", name: "Samuel", color: "#6aa3c4" },
    { id: "milla", name: "Milla", color: "#6fba86" },
    { id: "mea", name: "Mea", color: "#a07cc8" }
  ];
  var SCHOOL = {
    ellen:  { ma: ["10:00","13:00"], ti: ["08:00","13:00"], ke: ["08:45","15:00"], to: ["10:00","15:00"], pe: ["08:00","13:00"] },
    samuel: { ma: ["08:45","13:00"], ti: ["08:45","13:00"], ke: ["08:45","13:00"], to: ["08:00","12:00"], pe: ["08:00","13:00"] },
    milla:  { ma: ["09:40","15:50"], ti: ["09:40","14:20"], ke: ["09:40","14:20"], to: ["08:10","15:50"], pe: ["09:40","14:20"] },
    mea:    { ma: ["08:00","13:00"], ti: ["08:00","13:00"], ke: ["10:00","14:50"], to: ["08:00","14:45"], pe: ["08:00","14:45"] }
  };
  var EVENTS = [
    { id: "ellen-ambrosia", who: "ellen", title: "Ambrosia", weekday: "ke", start: "18:00", end: "20:30", depart: "17:40", place: "Kuopiohalli", driver: "Jussi", ride: "vie+hakee", status: "us", kind: "treeni" },
    { id: "milla-vivida", who: "milla", title: "Vivida", weekday: "ke", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "mea-lianna", who: "mea", title: "Lianna", weekday: "ke", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "ellen-ambrosia-pe", who: "ellen", title: "Ambrosia", weekday: "pe", start: "16:00", end: "18:30", place: "Luola", driver: "Riikka", ride: "vie", status: "us", kind: "treeni" },
    { id: "mea-lianna-pe", who: "mea", title: "Lianna", weekday: "pe", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "samuel-sahly-ma", who: "samuel", title: "sähly", weekday: "ma", start: "17:00", end: "18:00", place: "Ylä-Pyörö", driver: "Sini/Topias", status: "other", kind: "treeni" },
    { id: "samuel-sahly-ti", who: "samuel", title: "sähly", weekday: "ti", start: "16:30", end: "18:00", depart: "16:15", place: "Lippumäki", driver: "Räisä", ride: "vie+hakee", status: "us", kind: "treeni" },
    { id: "samuel-sahly", who: "samuel", title: "sähly", weekday: "to", start: "17:00", end: "19:00", depart: "16:30", place: "Puijonsarvi", driver: "Manen äiti / Topias", status: "other", kind: "treeni" },
    { id: "jussi-kalakisat", who: "", title: "Jussi kalassa, kyydit Riikka", date: "2026-08-28", dateEnd: "2026-08-30", start: "15:00", kind: "info" },
    { id: "ellen-samuel-syyskirkko", who: "ellen", title: "syyskirkko", date: "2026-08-28", place: "Kallaveden kirkko", kind: "info" }
  ];
  var MEALS = {
    ma: { dish: "Lihapullat + muusi", cook: "" },
    ti: { dish: "Kana + kasvikset", cook: "" },
    ke: { dish: "Pizzailta", cook: "" },
    to: { dish: "Lohikeitto", cook: "" },
    pe: { dish: "Pizza", cook: "" },
    la: { dish: "Bolognese", cook: "" },
    su: { dish: "Sushi", cook: "" }
  };
  var note = "";
  var weatherLine = "";

  function pad(n) { n = parseInt(n, 10); return n < 10 ? "0" + n : "" + n; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function helsinkiNow() {
    var hki = new Date((new Date()).getTime() + 3 * 60 * 60 * 1000);
    var y = hki.getUTCFullYear(), mo = hki.getUTCMonth() + 1, da = hki.getUTCDate();
    var h = hki.getUTCHours(), mi = hki.getUTCMinutes(), wd = hki.getUTCDay();
    return { year: y, month: mo, day: da, hour: h, minute: mi, wd: wd, key: DAYS[wd].key, iso: y + "-" + pad(mo) + "-" + pad(da), minutes: h * 60 + mi };
  }
  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function fmtRange(a, b) {
    if (!a && !b) return "";
    if (a && b) return fmtHm(a) + "–" + fmtHm(b);
    return a ? fmtHm(a) : "";
  }
  function kidById(id) {
    for (var i = 0; i < KIDS.length; i++) if (KIDS[i].id === id) return KIDS[i];
    return null;
  }
  function rideLabel(ev) {
    var a = ev.ride || "";
    if (a === "vie+hakee") return "vie + hakee";
    return a;
  }
  function driverText(ev) {
    if (!ev || ev.kind === "info") return null;
    if (ev.driver) {
      var act = rideLabel(ev);
      return { warn: false, text: act ? ev.driver + " " + act : ev.driver };
    }
    if (ev.kind === "treeni") return { warn: true, text: "Sovi kyyti" };
    return null;
  }
  function eventsOn(iso, key) {
    var out = [];
    for (var i = 0; i < EVENTS.length; i++) {
      var ev = EVENTS[i];
      if (ev.date) {
        if (ev.dateEnd) { if (iso >= ev.date && iso <= ev.dateEnd) out.push(ev); }
        else if (ev.date === iso) out.push(ev);
      } else if (ev.weekday === key) out.push(ev);
    }
    return out;
  }
  function keyTime(ev) {
    var m = parseMin(ev.depart);
    if (m == null) m = parseMin(ev.start);
    return m == null ? 24 * 60 : m;
  }
  function endTime(ev) {
    var e = parseMin(ev.end);
    if (e != null) return e;
    var s = parseMin(ev.start);
    return s == null ? 24 * 60 : s;
  }
  function durPhrase(diff) {
    if (diff < 0) diff = 0;
    var h = Math.floor(diff / 60), m = diff % 60;
    if (h > 0) return h + " h " + m + " min";
    return m + " min";
  }
  function applyShared(remote) {
    if (!remote) return;
    if (remote.drivers) {
      for (var id in remote.drivers) {
        if (!remote.drivers.hasOwnProperty(id)) continue;
        for (var i = 0; i < EVENTS.length; i++) {
          if (EVENTS[i].id !== id) continue;
          var d = remote.drivers[id] || {};
          if (d.driver != null) EVENTS[i].driver = d.driver;
          if (d.ride != null) EVENTS[i].ride = d.ride;
          if (d.status) EVENTS[i].status = d.status;
        }
      }
    }
    if (remote.cooks) {
      for (var day in remote.cooks) {
        if (!remote.cooks.hasOwnProperty(day)) continue;
        if (!MEALS[day]) MEALS[day] = { dish: "", cook: "" };
        MEALS[day].cook = remote.cooks[day] || "";
      }
    }
    if (typeof remote.note === "string") note = remote.note;
  }
  function readLocal() {
    try {
      var raw = localStorage.getItem("raisa-tanaan-v7");
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && saved.events) {
        applyShared({ drivers: (function () {
          var o = {};
          for (var i = 0; i < saved.events.length; i++) {
            var e = saved.events[i];
            if (e && e.id) o[e.id] = { driver: e.driver || "", ride: e.ride || "", status: e.status || "" };
          }
          return o;
        })(), cooks: (function () {
          var o = {};
          if (!saved.meals) return o;
          for (var k in saved.meals) if (saved.meals.hasOwnProperty(k)) o[k] = saved.meals[k].cook || "";
          return o;
        })(), note: saved.note || "" });
      }
    } catch (e) {}
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4 && x.status === 200) {
          try { cb(JSON.parse(x.responseText)); } catch (e) {}
        }
      };
      x.send();
    } catch (e) {}
  }
  function nextRides(now, list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var ev = list[i];
      if (ev.kind === "info") continue;
      if (endTime(ev) <= now.minutes) continue;
      out.push(ev);
    }
    out.sort(function (a, b) { return keyTime(a) - keyTime(b); });
    return out;
  }
  function infoTicker(list) {
    var bits = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].kind === "info") bits.push(list[i].title + (list[i].place ? " · " + list[i].place : ""));
    }
    return bits.join("  ·  ");
  }

  function paint() {
    var now = helsinkiNow();
    var list = eventsOn(now.iso, now.key);
    var rides = nextRides(now, list);
    var meal = MEALS[now.key] || {};
    var clock = pad(now.hour) + "." + pad(now.minute);
    var tick = infoTicker(list);

    var kidsHtml = "";
    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var h = SCHOOL[kid.id][now.key];
      kidsHtml += "<div class=\"kid\" style=\"border-left-color:" + kid.color + "\"><div class=\"nm\">" + esc(kid.name) + "</div><div class=\"hrs\">"
        + esc(h ? fmtRange(h[0], h[1]) : "—") + "</div></div>";
    }

    var ev = rides[0];
    var nextHtml = "<div class=\"lbl\">Seuraava kyyti</div><div class=\"word\">Ei kyytejä</div>";
    if (ev) {
      var k = kidById(ev.who);
      var dt = driverText(ev);
      var start = parseMin(ev.start);
      var leave = parseMin(ev.depart);
      var cd = "";
      if (leave != null && now.minutes < leave) cd = "Lähtö <b>" + durPhrase(leave - now.minutes) + "</b>";
      else if (start != null && now.minutes < start) cd = "Alkaa <b>" + durPhrase(start - now.minutes) + "</b>";
      else cd = "Käynnissä";
      nextHtml = "<div class=\"lbl\">Seuraava kyyti</div>"
        + "<div class=\"when\">" + esc(fmtHm(ev.start) || "") + "</div>"
        + "<div class=\"who\">" + esc(k ? k.name : (ev.title || "")) + "</div>"
        + "<div class=\"place\">" + esc([ev.title, ev.place, fmtRange(ev.start, ev.end)].join(" · ").replace(/^ · | · $/g, "")) + "</div>"
        + (dt ? "<div class=\"drive" + (dt.warn ? " warn" : "") + "\">" + esc(dt.text) + "</div>" : "")
        + "<div class=\"cd\">" + cd + "</div>";
    }

    var rest = rides.slice(1);
    var rideRows = "";
    for (var r = 0; r < rest.length && r < 3; r++) {
      var e = rest[r];
      var kk = kidById(e.who);
      var dtt = driverText(e);
      var meta = [];
      if (e.place) meta.push(e.place);
      if (dtt) meta.push(dtt.text);
      rideRows += "<div class=\"row\"><div class=\"tm\">" + esc(fmtHm(e.start) || "") + "</div><div><span class=\"what\">"
        + esc((kk ? kk.name : "") + (e.title ? " · " + e.title : "")) + "</span>"
        + (meta.length ? " <span class=\"meta\">· " + esc(meta.join(" · ")) + "</span>" : "")
        + "</div></div>";
    }

    var cook = meal.cook ? "<div class=\"cook\">" + esc(meal.cook) + "</div>" : "";
    var noteHtml = (note && String(note).replace(/^\s+|\s+$/g, "")) ? "<div class=\"note\">" + esc(note) + "</div>" : "";

    document.getElementById("app").innerHTML =
      "<div class=\"head\"><div><div class=\"kicker\">Räisän perhe</div><div class=\"date\">" + DAYS[now.wd].full + " " + now.day + "." + now.month + ".</div>"
      + (tick ? "<div class=\"ticker\">" + esc(tick) + "</div>" : "") + "</div>"
      + "<div><div class=\"clock\" id=\"clock\">" + clock + "</div><div class=\"wx\" id=\"wx\">" + esc(weatherLine) + "</div></div></div>"
      + "<div class=\"main\"><div class=\"now\"><div class=\"lbl\">Nyt</div><div class=\"word\">Koulu</div><div class=\"kids\">" + kidsHtml + "</div></div>"
      + "<div class=\"next\">" + nextHtml + "</div></div>"
      + "<div class=\"foot\"><div class=\"later\"><div class=\"lbl\">Myöhemmin</div>" + (rideRows || "<div class=\"meta\">Ei muuta tänään</div>") + "</div>"
      + "<div class=\"food\"><div class=\"lbl\">Ruoka</div><div class=\"dish\">" + esc(meal.dish || "") + "</div>" + cook + noteHtml + "</div></div>";
  }

  function tickClock() {
    var el = document.getElementById("clock");
    if (!el) return;
    var now = helsinkiNow();
    el.innerHTML = pad(now.hour) + "." + pad(now.minute);
  }
  function pullShared() {
    getJSON("https://raw.githubusercontent.com/Jussiraisa/raisa-tanaan/main/shared.json?t=" + new Date().getTime(), function (data) {
      applyShared(data);
      paint();
    });
    getJSON("shared.json?t=" + new Date().getTime(), function (data) {
      applyShared(data);
      paint();
    });
  }

  readLocal();
  paint();
  setInterval(tickClock, 1000);
  setInterval(function () { pullShared(); }, 15000);
  pullShared();
  getJSON("https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FHelsinki&forecast_days=1", function (data) {
    try {
      var tmin = Math.round(data.daily.temperature_2m_min[0]);
      var tmax = Math.round(data.daily.temperature_2m_max[0]);
      var code = data.daily.weathercode[0];
      var phrase = code === 0 ? "selkeää" : (code <= 2 ? "melkein selkeää" : (code === 3 ? "pilvistä" : (code >= 51 ? "sadetta" : "vaihtelevaa")));
      var clothes = tmax <= 8 ? "lämmin takki" : (tmax <= 14 ? "takki" : "ohut kerros");
      weatherLine = tmin + "–" + tmax + "° · " + phrase + " · " + clothes;
      var wx = document.getElementById("wx");
      if (wx) wx.innerHTML = esc(weatherLine);
    } catch (e) {}
  });
})();
  </script>
</body>
</html>
