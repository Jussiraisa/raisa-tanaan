<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="theme-color" content="#0e1110">
  <title>Tänään · TV</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0e1110;
      color: #f3efe4;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box }
    .tv {
      height: 100vh;
      width: 100vw;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      padding: 3vh 3.4vw 2.4vh;
      gap: 0;
    }
    .top {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: baseline;
      align-items: baseline;
      -ms-flex-pack: justify;
      justify-content: space-between;
      gap: 2vw;
      margin-bottom: 2.2vh;
    }
    .brand {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.5vmin;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #d4a84a;
    }
    .day {
      font-size: 3.4vmin;
      font-weight: 400;
      margin: .3vh 0 0;
      letter-spacing: -.02em;
    }
    .clock {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 8vmin;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
      line-height: .9;
      color: #fff;
    }
    .wx {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.8vmin;
      color: #b7b1a3;
      text-align: right;
      margin-top: .6vh;
      max-width: 36vw;
    }
    .hero {
      -ms-flex: 1 1 auto;
      flex: 1 1 auto;
      background: #171c1a;
      border: 1px solid #2a322f;
      border-radius: 1.6vmin;
      padding: 3vh 3vw 2.6vh;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
      -ms-flex-pack: center;
      justify-content: center;
      min-height: 0;
      box-shadow: inset 0 0 0 1px rgba(62,196,178,.12);
    }
    .lbl {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.55vmin;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #3ec4b2;
      margin-bottom: 1.2vh;
    }
    .ev {
      font-size: 7.2vmin;
      line-height: .95;
      letter-spacing: -.03em;
      font-weight: 400;
      max-width: 18ch;
    }
    .place {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 2.4vmin;
      color: #c5bfb0;
      margin-top: 1.6vh;
    }
    .who {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 2.6vmin;
      font-weight: 700;
      color: #3ec4b2;
      margin-top: 1vh;
    }
    .who.warn { color: #d4a84a }
    .cd {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 2.3vmin;
      font-weight: 700;
      margin-top: 2vh;
      color: #f3efe4;
    }
    .cd .num { color: #d4a84a; font-size: 1.15em }
    .kids {
      display: -ms-flexbox;
      display: flex;
      gap: 1.2vw;
      margin: 2vh 0;
    }
    .kid {
      -ms-flex: 1;
      flex: 1;
      background: #171c1a;
      border-radius: 1.2vmin;
      padding: 1.4vh 1.3vw 1.5vh;
      border: 1px solid #2a322f;
      min-width: 0;
    }
    .kid .nm {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.7vmin;
      font-weight: 800;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
      gap: .6vw;
    }
    .dot {
      width: 1.1vmin;
      height: 1.1vmin;
      border-radius: 50%;
      display: inline-block;
    }
    .hrs {
      font-size: 2.8vmin;
      margin-top: .5vh;
      letter-spacing: -.02em;
    }
    .bottom {
      display: -ms-flexbox;
      display: flex;
      gap: 1.2vw;
      height: 26vh;
      min-height: 0;
    }
    .card {
      background: #171c1a;
      border-radius: 1.2vmin;
      border: 1px solid #2a322f;
      padding: 1.6vh 1.5vw;
      min-width: 0;
      overflow: hidden;
    }
    .card.rides { -ms-flex: 1.25; flex: 1.25 }
    .card.food { -ms-flex: 1; flex: 1 }
    .card.note { -ms-flex: 1; flex: 1 }
    .row {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.85vmin;
      padding: .55vh 0;
      border-bottom: 1px solid #2a322f;
      line-height: 1.25;
    }
    .row:last-child { border-bottom: 0 }
    .row .t { color: #8e887a; font-weight: 700; margin-right: .6vw }
    .dish {
      font-size: 3.1vmin;
      line-height: 1.15;
      margin-top: .4vh;
    }
    .cook {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 2.1vmin;
      font-weight: 700;
      color: #3ec4b2;
      margin-top: 1vh;
    }
    .cook.warn { color: #d4a84a }
    .notetxt {
      font-size: 2.6vmin;
      line-height: 1.25;
      margin-top: .4vh;
    }
    .notetxt.empty { color: #8e887a; font-size: 2vmin }
    .boot {
      font-family: sans-serif;
      padding: 8vh 8vw;
      font-size: 4vmin;
    }
  </style>
</head>
<body>
  <div class="tv" id="app">
    <div class="boot">Räisän perhe · Tänään</div>
  </div>
  <script>
(function () {
  var DAYS = [
    { key: "su", full: "Sunnuntai" },
    { key: "ma", full: "Maanantai" },
    { key: "ti", full: "Tiistai" },
    { key: "ke", full: "Keskiviikko" },
    { key: "to", full: "Torstai" },
    { key: "pe", full: "Perjantai" },
    { key: "la", full: "Lauantai" }
  ];
  var KIDS = [
    { id: "ellen", name: "Ellen", color: "#e07a55" },
    { id: "samuel", name: "Samuel", color: "#6aa3c4" },
    { id: "milla", name: "Milla", color: "#6fba86" },
    { id: "mea", name: "Mea", color: "#a07cc8" }
  ];
  var SCHOOL = {
    ellen:  { ma: ["10:00","13:00"], ti: ["08:00","13:00"], ke: ["08:45","15:00"], to: ["10:00","15:00"], pe: ["08:00","13:00"] },
    samuel: { ma: ["08:45","13:00"], ti: ["08:45","13:00"], ke: ["08:45","13:00"], to: ["08:00","12:00"], pe: ["08:00","13:00"] },
    milla:  { ma: ["09:40","15:50"], ti: ["09:40","14:20"], ke: ["09:40","14:20"], to: ["08:10","15:50"], pe: ["09:40","14:20"] },
    mea:    { ma: ["08:00","13:00"], ti: ["08:00","13:00"], ke: ["10:00","14:50"], to: ["08:00","14:45"], pe: ["08:00","14:45"] }
  };
  var EVENTS = [
    { id: "ellen-ambrosia", who: "ellen", title: "Ambrosia", weekday: "ke", start: "18:00", end: "20:30", depart: "17:40", place: "Kuopiohalli", driver: "Jussi", ride: "vie+hakee", status: "us", kind: "treeni" },
    { id: "milla-vivida", who: "milla", title: "Vivida", weekday: "ke", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "mea-lianna", who: "mea", title: "Lianna", weekday: "ke", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "other", kind: "treeni" },
    { id: "ellen-ambrosia-pe", who: "ellen", title: "Ambrosia", weekday: "pe", start: "16:00", end: "18:30", place: "Luola", driver: "Riikka", ride: "vie", status: "us", kind: "treeni" },
    { id: "milla-vivida-la", who: "milla", title: "Vivida", weekday: "la", start: "12:30", end: "15:00", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "milla-vivida-su", who: "milla", title: "Vivida", weekday: "su", start: "11:30", end: "14:00", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "mea-lianna-pe", who: "mea", title: "Lianna", weekday: "pe", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "mea-lianna-su", who: "mea", title: "Lianna", weekday: "su", start: "15:30", end: "18:00", place: "BellaCenter", driver: "Räisä", ride: "hakee", status: "us", kind: "treeni" },
    { id: "samuel-sahly-ma", who: "samuel", title: "sähly", weekday: "ma", start: "17:00", end: "18:00", place: "Ylä-Pyörö", driver: "Sini/Topias", status: "other", kind: "treeni" },
    { id: "samuel-sahly-ti", who: "samuel", title: "sähly", weekday: "ti", start: "16:30", end: "18:00", depart: "16:15", place: "Lippumäki", driver: "Räisä", ride: "vie+hakee", status: "us", kind: "treeni" },
    { id: "samuel-sahly", who: "samuel", title: "sähly", weekday: "to", start: "17:00", end: "19:00", depart: "16:30", place: "Puijonsarvi", driver: "Manen äiti / Topias", status: "other", kind: "treeni" },
    { id: "jussi-kalakisat", who: "", title: "Jussi kalassa, kyydit Riikka", date: "2026-08-28", dateEnd: "2026-08-30", start: "15:00", kind: "info", note: "pe 15 – su 12" },
    { id: "ellen-samuel-syyskirkko", who: "ellen", title: "syyskirkko", date: "2026-08-28", place: "Kallaveden kirkko", kind: "info" },
    { id: "mea-teatteripolku", who: "mea", title: "Teatteripolku", date: "2026-08-31", start: "11:30", kind: "info" },
    { id: "mea-laakari", who: "mea", title: "lääkäri", date: "2026-09-02", start: "09:45", kind: "info" },
    { id: "riikka-oulu", who: "", title: "Riikka Oulussa", date: "2026-09-02", dateEnd: "2026-09-04", place: "Oulu", kind: "info" }
  ];
  var MEALS = {
    ma: { emoji: "🍖", dish: "Lihapullat + muusi", cook: "" },
    ti: { emoji: "🍗", dish: "Kana + kasvikset", cook: "" },
    ke: { emoji: "🍕", dish: "Pizzailta", cook: "" },
    to: { emoji: "🐟", dish: "Lohikeitto", cook: "" },
    pe: { emoji: "🍕", dish: "Pizza", cook: "" },
    la: { emoji: "🍝", dish: "Bolognese", cook: "" },
    su: { emoji: "🍣", dish: "Sushi", cook: "" }
  };
  var note = "";
  var weatherLine = "";

  function pad(n) {
    n = parseInt(n, 10);
    return n < 10 ? "0" + n : "" + n;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function helsinkiNow() {
    var d = new Date();
    var y, mo, da, h, mi, wd;
    try {
      var parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Helsinki",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", weekday: "short",
        hourCycle: "h23"
      }).formatToParts(d);
      var map = {};
      for (var i = 0; i < parts.length; i++) map[parts[i].type] = parts[i].value;
      y = +map.year; mo = +map.month; da = +map.day; h = +map.hour; mi = +map.minute;
      wd = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[map.weekday];
    } catch (e) {
      var utc = d.getTime() + d.getTimezoneOffset() * 60000;
      var hki = new Date(utc + 3 * 3600000);
      y = hki.getUTCFullYear(); mo = hki.getUTCMonth() + 1; da = hki.getUTCDate();
      h = hki.getUTCHours(); mi = hki.getUTCMinutes(); wd = hki.getUTCDay();
    }
    return {
      year: y, month: mo, day: da, hour: h, minute: mi, wd: wd,
      key: DAYS[wd].key,
      iso: y + "-" + pad(mo) + "-" + pad(da),
      minutes: h * 60 + mi
    };
  }
  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function fmtRange(a, b) {
    if (!a && !b) return "";
    if (a && b) return fmtHm(a) + "–" + fmtHm(b);
    return a ? fmtHm(a) : "–" + fmtHm(b);
  }
  function fmtSchool(arr) {
    if (!arr || (!arr[0] && !arr[1])) return "—";
    return fmtRange(arr[0], arr[1]);
  }
  function kidById(id) {
    for (var i = 0; i < KIDS.length; i++) if (KIDS[i].id === id) return KIDS[i];
    return null;
  }
  function rideLabel(ev) {
    var a = ev.ride || "";
    if (a === "vie+hakee") return "vie + hakee";
    return a;
  }
  function driverText(ev) {
    if (ev.status === "open" || (!ev.driver && ev.status !== "us")) return { warn: true, text: "Sovi kyyti" };
    if (!ev.driver) return null;
    var act = rideLabel(ev);
    if (act) return { warn: false, text: ev.driver + " " + act };
    return { warn: false, text: ev.driver };
  }
  function eventsOn(iso, key) {
    var out = [];
    for (var i = 0; i < EVENTS.length; i++) {
      var ev = EVENTS[i];
      if (ev.date) {
        if (ev.dateEnd) {
          if (iso >= ev.date && iso <= ev.dateEnd) out.push(ev);
        } else if (ev.date === iso) out.push(ev);
      } else if (ev.weekday === key) out.push(ev);
    }
    return out;
  }
  function keyTime(ev) {
    var m = parseMin(ev.depart);
    if (m == null) m = parseMin(ev.start);
    return m == null ? 24 * 60 : m;
  }
  function endTime(ev) {
    var e = parseMin(ev.end);
    if (e != null) return e;
    var s = parseMin(ev.start);
    return s == null ? 24 * 60 : s;
  }
  function durPhrase(diff) {
    var h = Math.floor(diff / 60);
    var m = diff % 60;
    if (h > 0) return h + " h " + m + " min";
    return m + " min";
  }
  function countdown(ev, nowMin) {
    var leave = parseMin(ev.depart);
    var start = parseMin(ev.start);
    var end = parseMin(ev.end);
    if (leave != null && nowMin < leave) return "Lähtö <span class=\"num\">" + durPhrase(leave - nowMin) + "</span> · klo " + fmtHm(ev.depart);
    if (start != null && nowMin < start) return "Alkaa <span class=\"num\">" + durPhrase(start - nowMin) + "</span> · klo " + fmtHm(ev.start);
    if (end != null && nowMin < end) return "Käynnissä · haku " + fmtHm(ev.end);
    if (end == null && start != null && nowMin >= start) return "Käynnissä";
    return "";
  }
  function heroTitle(ev) {
    var k = kidById(ev.who);
    var name = k ? k.name : "";
    if (ev.kind === "treeni" && name) return name + " treeneihin";
    if (name && ev.title) return name + " · " + ev.title;
    return ev.title || name || "Meno";
  }
  function pickHero(now, list) {
    var remaining = [];
    for (var i = 0; i < list.length; i++) {
      if (endTime(list[i]) > now.minutes) remaining.push(list[i]);
    }
    remaining.sort(function (a, b) { return keyTime(a) - keyTime(b); });
    if (remaining.length) return { type: "event", event: remaining[0] };
    if (list.length) return { type: "done" };
    var pickups = [];
    for (var j = 0; j < KIDS.length; j++) {
      var h = SCHOOL[KIDS[j].id][now.key];
      if (!h || !h[1]) continue;
      var end = parseMin(h[1]);
      if (end == null) continue;
      pickups.push({ kid: KIDS[j], hours: h, end: end });
    }
    pickups.sort(function (a, b) { return a.end - b.end; });
    for (var p = 0; p < pickups.length; p++) {
      if (pickups[p].end > now.minutes) return { type: "pickup", pickup: pickups[p] };
    }
    return { type: "none" };
  }
  function applyShared(remote) {
    if (!remote) return;
    if (remote.drivers) {
      for (var id in remote.drivers) {
        if (!remote.drivers.hasOwnProperty(id)) continue;
        for (var i = 0; i < EVENTS.length; i++) {
          if (EVENTS[i].id !== id) continue;
          var d = remote.drivers[id] || {};
          if (d.driver != null) EVENTS[i].driver = d.driver;
          if (d.ride != null) EVENTS[i].ride = d.ride;
          if (d.status) EVENTS[i].status = d.status;
        }
      }
    }
    if (remote.cooks) {
      for (var day in remote.cooks) {
        if (!remote.cooks.hasOwnProperty(day)) continue;
        if (!MEALS[day]) MEALS[day] = { emoji: "", dish: "", cook: "" };
        MEALS[day].cook = remote.cooks[day] || "";
      }
    }
    if (typeof remote.note === "string") note = remote.note;
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4 && x.status === 200) {
          try { cb(JSON.parse(x.responseText)); } catch (e) {}
        }
      };
      x.send();
    } catch (e) {}
  }

  function paint() {
    var now = helsinkiNow();
    var list = eventsOn(now.iso, now.key);
    var hero = pickHero(now, list);
    var meal = MEALS[now.key] || {};
    var clock = pad(now.hour) + "." + pad(now.minute);

    var heroHtml = "";
    if (hero.type === "event") {
      var ev = hero.event;
      var bits = [];
      if (ev.title && ev.kind !== "treeni") bits.push(ev.title);
      if (ev.place) bits.push(ev.place);
      var tm = fmtRange(ev.start, ev.end);
      if (tm) bits.push(tm);
      if (ev.note) bits.push(ev.note);
      var dt = driverText(ev);
      var who = "";
      if (dt) who = "<div class=\"who" + (dt.warn ? " warn" : "") + "\">" + esc(dt.text) + "</div>";
      var cd = countdown(ev, now.minutes);
      heroHtml = "<div class=\"lbl\">Seuraavaksi</div><div class=\"ev\">" + esc(heroTitle(ev)) + "</div>"
        + (bits.length ? "<div class=\"place\">" + esc(bits.join(" · ")) + "</div>" : "")
        + who
        + (cd ? "<div class=\"cd\">" + cd + "</div>" : "");
    } else if (hero.type === "pickup") {
      var p = hero.pickup;
      heroHtml = "<div class=\"lbl\">Seuraavaksi</div><div class=\"ev\">" + esc(p.kid.name) + " kotiin</div>"
        + "<div class=\"place\">Koulu päättyy · " + esc(fmtSchool(p.hours)) + "</div>"
        + "<div class=\"cd\">Haku <span class=\"num\">" + durPhrase(p.end - now.minutes) + "</span> · klo " + fmtHm(p.hours[1]) + "</div>";
    } else if (hero.type === "done") {
      heroHtml = "<div class=\"lbl\">Seuraavaksi</div><div class=\"ev\">Illan menot hoidettu</div>";
    } else {
      heroHtml = "<div class=\"lbl\">Seuraavaksi</div><div class=\"ev\">Rauhallinen päivä</div>";
    }

    var kids = "";
    for (var k = 0; k < KIDS.length; k++) {
      var kid = KIDS[k];
      var h = SCHOOL[kid.id][now.key];
      kids += "<div class=\"kid\"><div class=\"nm\"><span class=\"dot\" style=\"background:" + kid.color + "\"></span>"
        + esc(kid.name) + "</div><div class=\"hrs\">" + esc(fmtSchool(h)) + "</div></div>";
    }

    var rides = "";
    for (var r = 0; r < list.length; r++) {
      var e = list[r];
      var kk = kidById(e.who);
      var title = (kk ? kk.name + " · " : "") + (e.title || "Meno");
      var sub = [];
      var tmm = fmtRange(e.start, e.end);
      if (tmm) sub.push(tmm);
      if (e.place) sub.push(e.place);
      var extra = [];
      if (e.place) extra.push(e.place);
      var drv = driverText(e);
      if (drv) extra.push(drv.text);
      rides += "<div class=\"row\"><span class=\"t\">" + esc(tmm || "·") + "</span>" + esc(title)
        + (extra.length ? " · " + esc(extra.join(" · ")) : "")
        + "</div>";
    }
    if (!rides) rides = "<div class=\"row\">Ei kyytejä</div>";

    var cook = meal.cook
      ? "<div class=\"cook\">" + esc(meal.cook) + " tekee</div>"
      : "<div class=\"cook warn\">Sovi kuka tekee</div>";
    var dish = (meal.emoji ? meal.emoji + " " : "") + (meal.dish || "—");
    var noteHtml = (note && String(note).replace(/^\s+|\s+$/g, ""))
      ? esc(note)
      : "Ei viestiä";
    var noteEmpty = !(note && String(note).replace(/^\s+|\s+$/g, ""));

    document.getElementById("app").innerHTML =
      "<div class=\"top\">"
      + "<div><div class=\"brand\">Räisän perhe</div><div class=\"day\">" + DAYS[now.wd].full + " " + now.day + "." + now.month + ".</div></div>"
      + "<div><div class=\"clock\" id=\"clock\">" + clock + "</div><div class=\"wx\" id=\"wx\">" + esc(weatherLine || "sää haetaan") + "</div></div>"
      + "</div>"
      + "<div class=\"hero\">" + heroHtml + "</div>"
      + "<div class=\"kids\">" + kids + "</div>"
      + "<div class=\"bottom\">"
      + "<div class=\"card rides\"><div class=\"lbl\">Kyydit</div>" + rides + "</div>"
      + "<div class=\"card food\"><div class=\"lbl\">Ruoka</div><div class=\"dish\">" + esc(dish) + "</div>" + cook + "</div>"
      + "<div class=\"card note\"><div class=\"lbl\">Viesti</div><div class=\"notetxt" + (noteEmpty ? " empty" : "") + "\">" + noteHtml + "</div></div>"
      + "</div>";
  }

  function tickClock() {
    var el = document.getElementById("clock");
    if (!el) return;
    var now = helsinkiNow();
    el.innerHTML = pad(now.hour) + "." + pad(now.minute);
  }

  paint();
  setInterval(tickClock, 1000);
  setInterval(paint, 30000);

  getJSON("shared.json?t=" + new Date().getTime(), function (data) {
    applyShared(data);
    paint();
  });
  getJSON("https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FHelsinki&forecast_days=1", function (data) {
    try {
      var tmin = Math.round(data.daily.temperature_2m_min[0]);
      var tmax = Math.round(data.daily.temperature_2m_max[0]);
      var code = data.daily.weathercode[0];
      var phrase = "vaihtelevaa";
      if (code === 0) phrase = "selkeää";
      else if (code <= 2) phrase = "melkein selkeää";
      else if (code === 3) phrase = "pilvistä";
      else if (code >= 51 && code <= 67) phrase = "sadetta";
      else if (code >= 80) phrase = "sadekuuroja";
      var clothes = tmax <= 8 ? "lämmin takki" : (tmax <= 14 ? "takki" : "ohut kerros");
      if (code >= 51) clothes = clothes + " · sadevaraus";
      weatherLine = tmin + "–" + tmax + "° · " + phrase + " · " + clothes;
      var wx = document.getElementById("wx");
      if (wx) wx.innerHTML = esc(weatherLine);
    } catch (e) {}
  });
})();
  </script>
</body>
</html>
