<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Tänään · TV</title>
  <style>
    html, body {
      height: 100%; margin: 0; overflow: hidden;
      background: #050505; color: #f4f0e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box }
    .tv {
      height: 100vh; width: 100vw;
      padding: 4vh 4.2vw 3.4vh;
      display: flex; flex-direction: column;
    }
    .head {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .kicker {
      font-size: 1.45vmin; font-weight: 700; letter-spacing: .28em;
      text-transform: uppercase; color: #c6a15a;
    }
    .date {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.8vmin; margin-top: .6vh; color: #cfc8b8; font-weight: 400;
    }
    .ticker {
      margin-top: 1.1vh; font-size: 1.7vmin; color: #8f8a7c; font-weight: 600;
    }
    .clockwrap { text-align: right; }
    .clock {
      font-size: 11vmin; font-weight: 600; letter-spacing: -.06em;
      line-height: .82; font-variant-numeric: tabular-nums; color: #fff;
    }
    .wx { margin-top: 1vh; font-size: 1.7vmin; color: #8f8a7c; font-weight: 600; }
    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding: 2.5vh 0 2vh; }
    .lbl {
      font-size: 1.5vmin; font-weight: 700; letter-spacing: .26em;
      text-transform: uppercase; color: #3ec4b2; margin-bottom: 1.4vh;
    }
    .word {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10vmin; line-height: .92; letter-spacing: -.04em; font-weight: 400;
      max-width: 14ch;
    }
    .sub {
      margin-top: 2.2vh; font-size: 2.5vmin; color: #d8d2c4; font-weight: 500; line-height: 1.35;
      max-width: 70vw;
    }
    .drive {
      margin-top: 1.4vh; font-size: 2.6vmin; font-weight: 700; color: #3ec4b2;
    }
    .drive.warn { color: #c6a15a; }
    .cd { margin-top: 1.8vh; font-size: 2.2vmin; font-weight: 700; color: #9a9486; }
    .cd b { color: #c6a15a; font-size: 1.15em; font-weight: 700; }
    .rule { height: 1px; background: #222; margin: 0 0 2.6vh; border: 0; }
    .foot {
      display: flex; gap: 4vw; align-items: flex-end;
    }
    .col { min-width: 0; }
    .col.later { flex: 1.4; }
    .col.food { flex: .9; }
    .row {
      display: flex; align-items: baseline; gap: 1.6vw;
      padding: .7vh 0; font-size: 2.15vmin;
    }
    .tm {
      width: 11vmin; flex: none; font-weight: 700; color: #c6a15a;
      font-variant-numeric: tabular-nums;
    }
    .row .what { color: #f4f0e6; font-weight: 600; }
    .row .meta { color: #8f8a7c; font-weight: 500; }
    .dish {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.4vmin; line-height: 1.15;
    }
    .cook { margin-top: .8vh; font-size: 1.9vmin; font-weight: 700; color: #3ec4b2; }
    .cook.warn { color: #8f8a7c; font-weight: 600; }
    .note {
      margin-top: 1.6vh; font-size: 2vmin; color: #d8d2c4; line-height: 1.3; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="tv" id="app">Räisän perhe</div>
  <script>
(function () {
  var DAYS = [
    { key: "su", full: "Sunnuntai" },
    { key: "ma", full: "Maanantai" },
    { key: "ti", full: "Tiistai" },
    { key: "ke", full: "Keskiviikko" },
    { key: "to", full: "Torstai" },
    { key: "pe", full: "Perjantai" },
    { key: "la", full: "Lauantai" }
  ];
  var KIDS = [
    { id: "ellen", name: "Ellen", color: "#e07a55" },
    { id: "samuel", name: "Samuel", color: "#6aa3c4" },
    { id: "milla", name: "Milla", color: "#6fba86" },
    { id: "mea", name: "Mea", color: "#a07cc8" }
  ];
  var SCHOOL = {
    ellen:  { ma: ["10:00","13:00"], ti: ["08:00","13:00"], ke: ["08:45","15:00"], to: ["10:00","15:00"], pe: ["08:00","13:00"] },
    samuel: { ma: ["08:45","13:00"], ti: ["08:45","13:00"], ke: ["08:45","13:00"], to: ["08:00","12:00"], pe: ["08:00","13:00"] },
    milla:  { ma: ["09:40","15:50"], ti: ["09:40","14:20"], ke: ["09:40","14:20"], to: ["08:10","15:50"], pe: ["09:40","14:20"] },
    mea:    { ma: ["08:00","13:00"], ti: ["08:00","13:00"], ke: ["10:00","14:50"], to: ["08:00","14:45"], pe: ["08:00","14:45"] }
  };
  var EVENTS = [
    { id: "ellen-ambrosia", who: "ellen", title: "Ambrosia", weekday: "ke", start: "18:00", end: "20:30", depart: "17:40", place: "Kuopiohalli", driver: "Jussi", ride: "vie+hakee", status: "us", kind: "treeni" },
    { id: "milla-vivida", who: "milla", title: "Vivida", weekday: "ke", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "mea-lianna", who: "mea", title: "Lianna", weekday: "ke", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "ellen-ambrosia-pe", who: "ellen", title: "Ambrosia", weekday: "pe", start: "16:00", end: "18:30", place: "Luola", driver: "Riikka", ride: "vie", status: "us", kind: "treeni" },
    { id: "milla-vivida-la", who: "milla", title: "Vivida", weekday: "la", start: "12:30", end: "15:00", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "milla-vivida-su", who: "milla", title: "Vivida", weekday: "su", start: "11:30", end: "14:00", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "mea-lianna-pe", who: "mea", title: "Lianna", weekday: "pe", start: "18:00", end: "20:30", place: "BellaCenter", driver: "", status: "open", kind: "treeni" },
    { id: "mea-lianna-su", who: "mea", title: "Lianna", weekday: "su", start: "15:30", end: "18:00", place: "BellaCenter", driver: "Räisä", ride: "hakee", status: "us", kind: "treeni" },
    { id: "samuel-sahly-ma", who: "samuel", title: "sähly", weekday: "ma", start: "17:00", end: "18:00", place: "Ylä-Pyörö", driver: "Sini/Topias", status: "other", kind: "treeni" },
    { id: "samuel-sahly-ti", who: "samuel", title: "sähly", weekday: "ti", start: "16:30", end: "18:00", depart: "16:15", place: "Lippumäki", driver: "Räisä", ride: "vie+hakee", status: "us", kind: "treeni" },
    { id: "samuel-sahly", who: "samuel", title: "sähly", weekday: "to", start: "17:00", end: "19:00", depart: "16:30", place: "Puijonsarvi", driver: "Manen äiti / Topias", status: "other", kind: "treeni" },
    { id: "jussi-kalakisat", who: "", title: "Jussi kalassa, kyydit Riikka", date: "2026-08-28", dateEnd: "2026-08-30", start: "15:00", kind: "info", note: "pe 15 – su 12" },
    { id: "ellen-samuel-syyskirkko", who: "ellen", title: "syyskirkko", date: "2026-08-28", place: "Kallaveden kirkko", kind: "info" }
  ];
  var MEALS = {
    ma: { emoji: "🍖", dish: "Lihapullat + muusi", cook: "" },
    ti: { emoji: "🍗", dish: "Kana + kasvikset", cook: "" },
    ke: { emoji: "🍕", dish: "Pizzailta", cook: "" },
    to: { emoji: "🐟", dish: "Lohikeitto", cook: "" },
    pe: { emoji: "🍕", dish: "Pizza", cook: "" },
    la: { emoji: "🍝", dish: "Bolognese", cook: "" },
    su: { emoji: "🍣", dish: "Sushi", cook: "" }
  };
  var note = "";
  var weatherLine = "";

  function pad(n) {
    n = parseInt(n, 10);
    return n < 10 ? "0" + n : "" + n;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function lastSunday(year, monthIndex) {
    var last = new Date(Date.UTC(year, monthIndex + 1, 0));
    return last.getUTCDate() - last.getUTCDay();
  }
  function helsinkiOffset(d) {
    var y = d.getUTCFullYear();
    var start = Date.UTC(y, 2, lastSunday(y, 2), 1, 0, 0);
    var end = Date.UTC(y, 9, lastSunday(y, 9), 1, 0, 0);
    var t = d.getTime();
    return (t >= start && t < end) ? 3 : 2;
  }
  function helsinkiNow() {
    var d = new Date();
    var utc = d.getTime() + d.getTimezoneOffset() * 60000;
    var hki = new Date(utc + helsinkiOffset(d) * 3600000);
    var y = hki.getUTCFullYear();
    var mo = hki.getUTCMonth() + 1;
    var da = hki.getUTCDate();
    var h = hki.getUTCHours();
    var mi = hki.getUTCMinutes();
    var wd = hki.getUTCDay();
    return {
      year: y, month: mo, day: da, hour: h, minute: mi, wd: wd,
      key: DAYS[wd].key,
      iso: y + "-" + pad(mo) + "-" + pad(da),
      minutes: h * 60 + mi
    };
  }
  function parseMin(hm) {
    if (!hm) return null;
    var p = String(hm).split(":");
    var h = +p[0], m = +(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }
  function fmtHm(hm) {
    if (!hm) return "";
    var p = String(hm).split(":");
    return Number(p[0]) + "." + pad(p[1] || "00");
  }
  function fmtRange(a, b) {
    if (!a && !b) return "";
    if (a && b) return fmtHm(a) + "–" + fmtHm(b);
    return a ? fmtHm(a) : "";
  }
  function kidById(id) {
    for (var i = 0; i < KIDS.length; i++) if (KIDS[i].id === id) return KIDS[i];
    return null;
  }
  function rideLabel(ev) {
    var a = ev.ride || "";
    if (a === "vie+hakee") return "vie + hakee";
    return a;
  }
  function driverText(ev) {
    if (!ev || ev.kind === "info") return null;
    if (ev.driver) {
      var act = rideLabel(ev);
      return { warn: false, text: act ? ev.driver + " " + act : ev.driver };
    }
    if (ev.kind === "treeni") return { warn: true, text: "Sovi kyyti" };
    return null;
  }
  function eventsOn(iso, key) {
    var out = [];
    for (var i = 0; i < EVENTS.length; i++) {
      var ev = EVENTS[i];
      if (ev.date) {
        if (ev.dateEnd) {
          if (iso >= ev.date && iso <= ev.dateEnd) out.push(ev);
        } else if (ev.date === iso) out.push(ev);
      } else if (ev.weekday === key) out.push(ev);
    }
    return out;
  }
  function keyTime(ev) {
    var m = parseMin(ev.depart);
    if (m == null) m = parseMin(ev.start);
    return m == null ? 24 * 60 : m;
  }
  function endTime(ev) {
    var e = parseMin(ev.end);
    if (e != null) return e;
    var s = parseMin(ev.start);
    return s == null ? 24 * 60 : s;
  }
  function durPhrase(diff) {
    if (diff < 0) diff = 0;
    var h = Math.floor(diff / 60);
    var m = diff % 60;
    if (h > 0) return h + " h " + m + " min";
    return m + " min";
  }
  function applyShared(remote) {
    if (!remote) return;
    if (remote.drivers) {
      for (var id in remote.drivers) {
        if (!remote.drivers.hasOwnProperty(id)) continue;
        for (var i = 0; i < EVENTS.length; i++) {
          if (EVENTS[i].id !== id) continue;
          var d = remote.drivers[id] || {};
          if (d.driver != null) EVENTS[i].driver = d.driver;
          if (d.ride != null) EVENTS[i].ride = d.ride;
          if (d.status) EVENTS[i].status = d.status;
        }
      }
    }
    if (remote.cooks) {
      for (var day in remote.cooks) {
        if (!remote.cooks.hasOwnProperty(day)) continue;
        if (!MEALS[day]) MEALS[day] = { emoji: "", dish: "", cook: "" };
        MEALS[day].cook = remote.cooks[day] || "";
      }
    }
    if (typeof remote.note === "string") note = remote.note;
  }
  function getJSON(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState === 4 && x.status === 200) {
          try { cb(JSON.parse(x.responseText)); } catch (e) {}
        }
      };
      x.send();
    } catch (e) {}
  }
  function infoTicker(list) {
    var bits = [];
    for (var i = 0; i < list.length; i++) {
      var ev = list[i];
      if (ev.kind !== "info") continue;
      var t = ev.title || "";
      if (ev.place) t += " · " + ev.place;
      bits.push(t);
    }
    return bits.join("   ·   ");
  }
  function schoolBlock(now) {
    var lines = [];
    var anyNow = false;
    var anySoon = false;
    for (var i = 0; i < KIDS.length; i++) {
      var kid = KIDS[i];
      var h = SCHOOL[kid.id][now.key];
      if (!h) continue;
      var a = parseMin(h[0]);
      var b = parseMin(h[1]);
      if (a == null) continue;
      var state = "later";
      if (now.minutes >= a && (b == null || now.minutes < b)) { state = "now"; anyNow = true; }
      else if (now.minutes < a && a - now.minutes <= 45) { state = "soon"; anySoon = true; }
      lines.push({ kid: kid, start: h[0], end: h[1], state: state, a: a });
    }
    if (!lines.length) return null;
    return { anyNow: anyNow, anySoon: anySoon, lines: lines };
  }
  function nextRides(now, list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var ev = list[i];
      if (ev.kind === "info") continue;
      if (endTime(ev) <= now.minutes) continue;
      out.push(ev);
    }
    out.sort(function (a, b) { return keyTime(a) - keyTime(b); });
    return out;
  }

  function paint() {
    var now = helsinkiNow();
    var list = eventsOn(now.iso, now.key);
    var school = schoolBlock(now);
    var rides = nextRides(now, list);
    var meal = MEALS[now.key] || {};
    var clock = pad(now.hour) + "." + pad(now.minute);

    var word = "";
    var sub = "";
    var drive = "";
    var driveWarn = false;
    var cd = "";
    var lbl = "Seuraavaksi";

    if (school && (school.anyNow || school.anySoon)) {
      lbl = school.anyNow ? "Nyt" : "Seuraavaksi";
      word = "Koulu";
      var parts = [];
      for (var s = 0; s < school.lines.length; s++) {
        var ln = school.lines[s];
        parts.push(ln.kid.name + " " + fmtRange(ln.start, ln.end));
      }
      sub = parts.join("   ·   ");
      if (school.anySoon && !school.anyNow) {
        var soon = null;
        for (var q = 0; q < school.lines.length; q++) {
          if (school.lines[q].state === "soon") {
            if (!soon || school.lines[q].a < soon.a) soon = school.lines[q];
          }
        }
        if (soon) cd = "Alkaa <b>" + durPhrase(soon.a - now.minutes) + "</b> · klo " + fmtHm(soon.start);
      }
    } else if (rides.length) {
      var ev = rides[0];
      var k = kidById(ev.who);
      word = (k && ev.kind === "treeni") ? k.name + " treeneihin" : (ev.title || "Meno");
      var bits = [];
      if (k && ev.title) bits.push(ev.title);
      if (ev.place) bits.push(ev.place);
      var tm = fmtRange(ev.start, ev.end);
      if (tm) bits.push(tm);
      sub = bits.join(" · ");
      var dt = driverText(ev);
      if (dt) { drive = dt.text; driveWarn = dt.warn; }
      var leave = parseMin(ev.depart);
      var start = parseMin(ev.start);
      if (leave != null && now.minutes < leave) cd = "Lähtö <b>" + durPhrase(leave - now.minutes) + "</b> · klo " + fmtHm(ev.depart);
      else if (start != null && now.minutes < start) cd = "Alkaa <b>" + durPhrase(start - now.minutes) + "</b> · klo " + fmtHm(ev.start);
      else cd = "Käynnissä";
    } else {
      word = "Illan menot hoidettu";
      lbl = "Tänään";
    }

    var rideRows = "";
    var rest = (school && (school.anyNow || school.anySoon)) ? rides : rides.slice(1);
    for (var r = 0; r < rest.length && r < 4; r++) {
      var e = rest[r];
      var kk = kidById(e.who);
      var title = (kk ? kk.name : "") + (e.title ? (kk ? " · " : "") + e.title : "");
      var meta = [];
      if (e.place) meta.push(e.place);
      var dtt = driverText(e);
      if (dtt) meta.push(dtt.text);
      rideRows += "<div class=\"row\"><div class=\"tm\">" + esc(fmtRange(e.start, e.end) || "·") + "</div>"
        + "<div><span class=\"what\">" + esc(title) + "</span>"
        + (meta.length ? " <span class=\"meta\">· " + esc(meta.join(" · ")) + "</span>" : "")
        + "</div></div>";
    }
    if (!rideRows) rideRows = "<div class=\"row\"><div class=\"tm\"></div><div class=\"meta\">Ei enempää kyytejä</div></div>";

    var cook = meal.cook
      ? "<div class=\"cook\">" + esc(meal.cook) + " tekee</div>"
      : "<div class=\"cook warn\">kokkaaja auki</div>";
    var dish = (meal.emoji ? meal.emoji + "  " : "") + (meal.dish || "");
    var noteHtml = (note && String(note).replace(/^\s+|\s+$/g, ""))
      ? "<div class=\"note\">" + esc(note) + "</div>"
      : "";
    var tick = infoTicker(list);

    document.getElementById("app").innerHTML =
      "<div class=\"head\">"
      + "<div><div class=\"kicker\">Räisän perhe</div><div class=\"date\">" + DAYS[now.wd].full + " " + now.day + "." + now.month + ".</div>"
      + (tick ? "<div class=\"ticker\">" + esc(tick) + "</div>" : "")
      + "</div>"
      + "<div class=\"clockwrap\"><div class=\"clock\" id=\"clock\">" + clock + "</div><div class=\"wx\" id=\"wx\">" + esc(weatherLine) + "</div></div>"
      + "</div>"
      + "<div class=\"stage\"><div class=\"lbl\">" + lbl + "</div><div class=\"word\">" + esc(word) + "</div>"
      + (sub ? "<div class=\"sub\">" + esc(sub) + "</div>" : "")
      + (drive ? "<div class=\"drive" + (driveWarn ? " warn" : "") + "\">" + esc(drive) + "</div>" : "")
      + (cd ? "<div class=\"cd\">" + cd + "</div>" : "")
      + "</div>"
      + "<div class=\"rule\"></div>"
      + "<div class=\"foot\">"
      + "<div class=\"col later\"><div class=\"lbl\">Myöhemmin</div>" + rideRows + "</div>"
      + "<div class=\"col food\"><div class=\"lbl\">Ruoka</div><div class=\"dish\">" + esc(dish) + "</div>" + cook + noteHtml + "</div>"
      + "</div>";
  }

  function tickClock() {
    var el = document.getElementById("clock");
    if (!el) return;
    var now = helsinkiNow();
    el.innerHTML = pad(now.hour) + "." + pad(now.minute);
  }

  paint();
  setInterval(tickClock, 1000);
  setInterval(function () { pullShared(); paint(); }, 20000);

  function pullShared() {
    getJSON("shared.json?t=" + new Date().getTime(), function (data) {
      applyShared(data);
      paint();
    });
  }
  pullShared();
  getJSON("https://api.open-meteo.com/v1/forecast?latitude=62.8924&longitude=27.6770&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FHelsinki&forecast_days=1", function (data) {
    try {
      var tmin = Math.round(data.daily.temperature_2m_min[0]);
      var tmax = Math.round(data.daily.temperature_2m_max[0]);
      var code = data.daily.weathercode[0];
      var phrase = "vaihtelevaa";
      if (code === 0) phrase = "selkeää";
      else if (code <= 2) phrase = "melkein selkeää";
      else if (code === 3) phrase = "pilvistä";
      else if (code >= 51) phrase = "sadetta";
      var clothes = tmax <= 8 ? "lämmin takki" : (tmax <= 14 ? "takki" : "ohut kerros");
      if (code >= 51) clothes += " · sade";
      weatherLine = tmin + "–" + tmax + "° · " + phrase + " · " + clothes;
      var wx = document.getElementById("wx");
      if (wx) wx.innerHTML = esc(weatherLine);
    } catch (e) {}
  });
})();
  </script>
</body>
</html>
